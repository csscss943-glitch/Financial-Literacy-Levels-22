}

ط"},{q:"شخص ينظر إلى أسعار الكشري (25 جنيهًا) والساندويتش (30 جنيهًا)، يختار الساندويتش، يدفع 30 جنيهًا، ويحتفظ بالباقي حتى الأسبوع القادم. ما وظائف المال؟",a:'الوظائف الثلاث جميعًا موجودة: "المقارنة بالسعر، والدفع بالمال، والاحتفاظ به"'}]},{title:"درس: أشكال المال الحديث",items:[{q:"عند انقطاع الكهرباء ولا يمكن استخدام الهواتف وأجهزة قراءة البطاقات، أي شكل من أشكال المال يناسب؟",a:"النقد (لأنه يمكن استخدامه دون كهرباء أو إنترنت)"},{q:'أي مبادرة أكثر ارتباطًا مباشرًا بـ "الشمول المالي"؟',a:"نشر خدمات الدفع عبر الهاتف المحمول ليتمكّن سكان الريف من التحويل والدفع بهواتفهم"},{q:"غيّرت دفع ثمن الكشري من النقد إلى المال الإلكتروني على هاتفك. ما الذي يتغيّر وما الذي لا يتغيّر؟",a:"يتغيّر الشكل، لكن لا تتغيّر أي من وظائف المال الثلاث"},{q:"تتقلب أسعار الأصول المشفّرة بشدة، بينما صُممت CBDC لتكون مستقرة. ما السبب الأكبر؟",a:"الأصول المشفّرة لا تملك دعمًا من بنك مركزي، بينما يُصدر ويدير CBDC البنك المركزي"},{q:'أي مما يلي يصف بدقة "شكل" المال و"وظيفته"؟',a:"حتى مع تغيّر شكل المال، الوظائف الثلاث مشتركة، لكن نقاط القوة والضعف تختلف حسب الشكل"}]},{title:"اختبار المستوى الأول - دور المال",items:[{q:"ما السبب الأكثر جوهرية لعدم انتشار المقايضة؟",a:"لأن من الصعب أن تجد شخصًا يملك ما تريده ويريد أيضًا ما تملكه"},{q:"ما السبب الأكبر لاحتفاظ الأوراق النقدية الحديثة بقيمتها مع أنها غير قابلة للاستبدال بالذهب؟",a:'لأن ضمان الحكومة وثقة المجتمع المشتركة بأن "يمكن استخدام هذا لشراء الأشياء"'},{q:"ما اسم الظاهرة التي تستمر فيها الأسعار في الارتفاع بشكل لا يمكن التحكم فيه وتكاد تختفي فيها قيمة المال؟",a:"التضخم المفرط"},{q:'كـ "كشري بـ 25 جنيهًا، شاورما بـ 40 جنيهًا"، أي وظيفة للمال تتيح لك مقارنة قيم سلع مختلفة برقم مشترك؟',a:"وحدة الحساب"},{q:'عندما يستلم شخص مالًا ويستطيع استخدامه لمشترياته القادمة، أي أن المال "يستمر في التداول"، مما يجعل الصفقات سلسة. أي وظيفة؟',a:"وسيلة التبادل"},{q:"شيء كان يمكن شراؤه بمائة جنيه منذ 10 سنوات لا يمكن شراؤه بنفس المائة جنيه اليوم. ما الذي انخفض؟",a:"القدرة الشرائية"},{q:"أي مما يلي خاصية صحيحة للمال الإلكتروني؟",a:"نظام يخزّن معلومات المال كبيانات رقمية ويستخدمها عبر بطاقة أو هاتف"},{q:'ما السبب في أن الأصول المشفّرة يُقال إنها غير مستقرة كـ "مخزن للقيمة"؟',a:"لأنها لا يُصدرها بنك مركزي، فتقلبات الأسعار كبيرة جدًا"},{q:"ما الفرق الأكبر بين CBDC والأصول المشفّرة؟",a:"CBDC يُصدرها البنك المركزي ولها نفس دعم الثقة الذي تتمتع به العملة القانونية"},{q:'أي مما يلي هو السبب الأكثر ملاءمة لاعتبار "الشمول المالي" مهمًا بشكل خاص؟',a:"لتوصيل الخدمات المالية حتى لمن لا يستطيعون الحصول على حساب بنكي، مما يتيح المشاركة في النشاط الاقتصادي"}]}]},{id:2,title:"المستوى الثاني — دور التمويل في المجتمع",tag:"الوساطة والمؤسسات المالية",sections:[{title:"درس: الوساطة المالية",items:[{q:"استُخدم المال الذي أودعته في البنك كتمويل لصاحب المقهى. المودع لا يعرف صاحب المقهى. كيف وصل مال المودع إليه؟",a:"جمع البنك مال المودع وأقرض جزءًا منه لصاحب المقهى"},{q:'أي مما يلي يُعد "تمويلًا مباشرًا"؟',a:"تُصدر شركة أسهمًا أو سندات وتجمع المال مباشرة من المستثمرين دون المرور ببنك"},{q:"ما اسم النظام الذي يدعو فيه أشخاص إلى الجمهور العام عبر الإنترنت لجمع المال لأفكار أو مشاريع جديدة؟",a:"التمويل الجماعي"},{q:"تخطط لفتح محل جديد صغير بفكرة جديدة. عند جمع الأموال، ما النهج الأكثر منطقية؟",a:"حسب حجم المشروع ومرحلته، تقارن طرق جمع متعددة وتستخدم ما يناسب"},{q:"في نظام التمويل الجسري، إذا لم ينشأ أي مقابل (تكلفة) عند توفير المال أو السلع، ماذا سيحدث؟",a:"لن يكون لمقدّمي المال أي عائد، فلن يقدّم أحد المال، وسيتوقف النظام الجسري"}]},{title:"درس: أنواع المؤسسات المالية وأدوارها",items:[{q:"البنوك التجارية تستلم ودائعنا وتُقرض المال للشركات والأفراد. فما دور البنك المركزي؟",a:"بنك يُصدر عملة الدولة، ويدعم البنوك التجارية، ويحافظ على استقرار قيمة العملة"},{q:'للبنك المركزي ثلاثة أدوار: "بنك الإصدار"، و"بنك البنوك"، و"بنك الحكومة". إذا لم يكن موجودًا، ما المشكلات؟',a:"سيصبح إصدار الأوراق النقدية ودعم البنوك مستحيلًا، ولن يمكن الحفاظ على الثقة في المال في المجتمع"},{q:'أي مما يلي يطابق بدقة أدوار "البنك التجاري" و"شركة الأوراق المالية" و"شركة التأمين"؟',a:"البنك التجاري = يستلم ودائع ويُقرض الشركات، شركة الأوراق المالية = تتوسّط في الأسهم والسندات، شركة التأمين = تجمع أقساطًا وتستعد للخطر وتستثمر المال"},{q:"لو لم يكن نظام مثل التمويل متناهي الصغر موجودًا، ما التأثير على المجتمع؟",a:"الأشخاص الذين لا يستطيعون الاقتراض من البنوك لن يحصلوا على المال، وسيكون هناك أشخاص لا يستطيعون بدء مشاريع تجارية"},{q:"أي من العبارات التالية غير صحيحة؟",a:"شركات الأوراق المالية مؤسسات مالية تستلم ودائعنا وتُقرض الشركات، بنفس دور البنوك التجارية"}]},{title:"درس: كيف يحرّك التمويل المجتمع",items:[{q:"أُغلق مصنع كبير وفقد 200 موظف وظائفهم. ما التأثير على المحلات القريبة؟",a:"مع تقليص تسوّق 200 شخص، من المرجح أن تنخفض مبيعات المحلات القريبة"},{q:'أعلن عمدة مدينة "سنقلّص ميزانية صيانة الطرق". لماذا قلق صاحب محل؟',a:"الطرق المتضررة تؤخّر التوصيل وتجعل قدوم العملاء أصعب، مما يؤثر على المبيعات"},{q:"ثلاثة بنوك كبرى أوقفت تقريبًا التمويل الجديد للشركات. إذا استمر الوضع، ما التأثير؟",a:"لن تبدأ مشاريع جديدة، وينخفض التوظيف والاستهلاك، وتنعكس الدورة الحميدة"},{q:'تفكّر في "طرق لتوصيل الخدمات المالية للناس الذين يعيشون في مناطق بلا فروع بنوك قريبة". ما الأكثر تفاؤلًا؟',a:"نشر الخدمات باستخدام تكنولوجيا جديدة كالدفع والتحويل عبر الهاتف الذكي"},{q:"في مجموعة جمعية، توقف عضو استلم المبلغ الإجمالي ثالثًا عن الدفعات من الشهر الرابع. ما التأثير؟",a:"المبلغ المُجمّع كل شهر ينخفض، والأعضاء اللاحقون في الترتيب يستلمون أقل"},{q:"في قرية ريفية بلا فرع بنك، شخص يريد فتح مخبز. ما وسيلة ممكنة لتحضير أموال بدء المشروع؟",a:"تكوين جمعية مع أصدقاء القرية واستلام مبالغ إجمالية بالتناوب"}]},{title:"اختبار المستوى الثاني",items:[{q:'أي نوع من النظام هو "التمويل"؟',a:"نظام يوصّل المال من أصحاب الفائض إلى من يحتاجون إلى المال"},{q:"ما اسم النظام الذي تجمع فيه البنوك مال المودعين وتُقرضه للشركات؟",a:"التمويل غير المباشر"},{q:"ما اسم النظام الذي تُصدر فيه الشركات أسهمًا وتجمع المال مباشرة من المستثمرين؟",a:"التمويل المباشر"},{q:"من بين أدوار البنك المركزي الثلاثة، أي دور يدعم البنوك التجارية عندما تنقصها الأموال؟",a:"بنك البنوك"},{q:"من بين المؤسسات المالية، أي منها له دور التوسّط في بيع الأسهم والسندات؟",a:"شركة الأوراق المالية"},{q:"ما السبب الصحيح لاعتبار شركات التأمين واحدة من المؤسسات المالية؟",a:"شركات التأمين تستثمر الأقساط التي تجمعها، مساهمة في حركة مال المجتمع"},{q:"ما الترتيب الصحيح للدورة الحميدة؟",a:"الأموال ← الاستثمار ← التوظيف ← الاستهلاك ← الإيرادات الضريبية"},{q:"ما كان المُحرّك الأولي لصدمة ليمان في 2008؟",a:"أقرضت البنوك مبالغ كبيرة حتى لأشخاص ذوي قدرة سداد منخفضة، مما أدى إلى تخلّف واسع عن الدفع"},{q:'أي مما يلي هو الخاصية الأكثر ملاءمة لشخص في حالة "استبعاد مالي"؟',a:"لا يستطيع الحصول على حساب بنكي وهو في حالة لا تصله فيها فوائد الربط المالي"},{q:"ما الوصف الصحيح لنظام الجمعية؟",a:"نظام يجمع فيه أصدقاء موثوقون المال معًا ويتناوبون على استلام مبالغ إجمالية"}]}]},{id:3,title:"المستوى الثالث — البنية الأساسية للاقتصاد",tag:"السوق والمؤشرات والنظم",sections:[{title:"درس: آليات السوق وتحديد الأسعار",items:[{q:"ارتفعت شهرة حذاء رياضي وارتفع سعره. ماذا سيفعل صانع الحذاء؟",a:"إذا استطاعوا البيع بسعر مرتفع، سيحاولون صنع وبيع أكثر"},{q:"صدرت برمجية لعبة مشهورة، كان العرض محدودًا وسعرها أعلى، ثم زاد الإنتاج وانخفض السعر. ما وصف الوضع؟",a:"ازداد العرض ولحق بالطلب، فاقترب السعر من التوازن وانخفض"},{q:'أي مشهد كان ارتفاع سعره بسبب "تغيّر من جانب العرض"؟',a:"ارتفعت أسعار الخضروات أكثر من المعتاد لأن الأمطار الغزيرة أضرّت بالمحاصيل"},{q:'أي مما يلي "أقرب إلى سوق احتكار"؟',a:"شركة واحدة فقط تزوّد المياه في منطقة، ويجب على السكان استخدام تلك الشركة"},{q:"في الشتاء جاءت موجة برد وارتفعت أسعار الغاز للتدفئة بشدة لكن عدد المستخدمين لم ينخفض تقريبًا. ما وصف الوضع؟",a:"موجة البرد جعلت العرض غير قادر على اللحاق، فارتفعت الأسعار. استمر الناس في استخدام الغاز لأنه ضروري للحياة اليومية"}]},{title:"درس: المؤشرات الاقتصادية",items:[{q:'أي مما يلي من الأخبار عن "مؤشر أسعار المستهلك"؟',a:'"ارتفعت أسعار منتجات الحياة اليومية بنسبة 7% عن العام الماضي"'},{q:"إذا أردت معرفة ما إذا كان هناك تضخم، فما الذي تعتقد أنه يجب أن تنظر إليه؟",a:"تتبّع أسعار منتجات حياة يومية كثيرة معًا وتحقّق مما إذا ارتفعت بشكل عام"},{q:"بدأت مصانع وشركات جديدة كثيرة في الظهور، وازدادت فرص العمل. ماذا يحدث لمعدل البطالة؟",a:"مع مصانع وشركات أكثر وأماكن عمل أكثر، ينخفض معدل البطالة"},{q:'دخل مصر من "قناة السويس" يقع تحت أي مما يلي؟',a:"دخل من تقديم خدمات عبور القناة لسفن أجنبية، مُضمَّن في ميزان الحساب الجاري"},{q:'أُعلنت أرقام: "معدل النمو الاقتصادي موجب (الاقتصاد ينمو)"، "معدل التضخم معتدل (الأسعار مستقرة)"، "معدل البطالة مرتفع (الوظائف صعبة الإيجاد)". أي مما يلي يقرأ اقتصاد الدولة بدقة؟',a:"الاقتصاد ينمو، لكن معدل من لا يجدون عملًا رغم البحث مرتفع"}]},{title:"درس: النظم الاقتصادية",items:[{q:"حادثة تعطل السفن في قناة السويس قد تكون مرتبطة بعدم وصول حذائك الرياضي. لماذا؟",a:"ربما كانت الأحذية الرياضية محمولة على سفينة تعبر قناة السويس"},{q:"عند بدء مشروع تجاري، أي دولة ستتيح لك بدء وإدارة مشروع بأكبر حرية؟",a:"دولة يستطيع فيها أي شخص فتح محل، وتقرر ماذا تبيع وبأي سعر بمراقبة المحلات والعملاء المحيطين"},{q:"عندما تتراجع الأحوال الاقتصادية أو الأسعار، بأي وسيلة يستطيع البنك المركزي الاستجابة؟",a:"ضبط مقدار المال المتداول في السوق لتسهيل تحرّك المال"},{q:"ارتفع معدل البطالة بشدة، وفي الوقت نفسه معدل التضخم يرتفع أيضًا. كيف يتصرف الحكومة والبنك المركزي؟",a:"تزيد الحكومة الأعمال العامة، ويشدّد البنك المركزي مقدار المال في السوق"},{q:"بسبب اضطراب الخدمات اللوجستية العالمية، انخفضت حركة قناة السويس، وارتفعت أسعار السلع المستوردة في مصر. نتيجة لذلك ارتفع مؤشر أسعار المستهلك وبدأ الاستهلاك المحلي في الانخفاض. ما تفسير الوضع؟",a:"بما أن مؤشر أسعار المستهلك المحلي ارتفع بسبب اضطراب الخدمات اللوجستية، يحتاج البنك المركزي إلى الاستجابة بالسياسة النقدية"}]},{title:"اختبار المستوى الثالث - البنية الأساسية للاقتصاد",items:[{q:"طُرح إصدار جديد من سلعة رياضية مشهورة، أراد كثير من الناس الشراء واستمر النقص. كيف سيتحرك السعر؟",a:"مع وجود كثير من الناس الذين يريدون الشراء، من المرجح أن يرتفع السعر"},{q:"أي مشهد أقرب إلى حالة سوق احتكار؟",a:"في منطقة، شركة واحدة فقط تزوّد المياه ويجب على السكان استخدامها"},{q:"أيها يُعتبَر ذا مرونة سعر صغيرة (الطلب لا يتغيّر تقريبًا عندما يتغيّر السعر)؟",a:"دواء مضاد للحمى مهم تتناوله عندما تكون مصابًا بحمى"},{q:"كان الناتج المحلي الإجمالي لدولة العام الماضي 100، لكن هذا العام 103. ما الصحيح بخصوص معدل النمو الاقتصادي؟",a:"معدل النمو الاقتصادي +3%، والاقتصاد ينمو"},{q:"بخصوص الناتج المحلي الإجمالي ومؤشر أسعار المستهلك، أي توليفة صحيحة؟",a:"الناتج المحلي الإجمالي يُظهر إجمالي إنتاج الدولة، ومؤشر أسعار المستهلك يُظهر تغيّرات الأسعار"},{q:"أُغلقت مصانع كثيرة وتم تسريح أشخاص أكثر. ماذا يحدث لمعدل البطالة؟",a:"بما أن أشخاصًا أكثر يُسرَّحون، يرتفع معدل البطالة في هذه الدولة"},{q:'من بين الدخول الأربعة، أي منها مُضمَّن مباشرة في "الميزان التجاري" لمصر؟',a:"دخل من تصدير مصر النفط والغاز الطبيعي لدول أجنبية"},{q:'أي وصف أقرب إلى خصائص "اقتصاد السوق"؟',a:"تُحدَّد الأسعار بالطلب والعرض، ويمكن للأفراد بدء مشاريع تجارية بحرية"},{q:"تتراجع الأحوال الاقتصادية ويرتفع معدل البطالة. ما التوليفة الصحيحة لتصرفات الحكومة والبنك المركزي؟",a:"تزيد الحكومة الأعمال العامة، ويزيد البنك المركزي المعروض النقدي"},{q:"تسبّبت اضطرابات الاستيراد في ارتفاع حاد لأسعار الضروريات اليومية. ما التسلسل الصحيح للأحداث؟",a:"انخفاض الواردات ← انخفاض العرض المحلي ← ارتفاع مؤشر أسعار المستهلك ← يستجيب البنك المركزي بالسياسة النقدية"}]}]},{id:4,title:"المستوى الرابع — فهم الزكاة",tag:"الزكاة والتمويل الإسلامي",sections:[{title:"درس: ما هي الزكاة؟",items:[{q:'مجتمع بقاعدة "من تتجاوز ثروته معيارًا معينًا يدفع مبلغًا ثابتًا للمجتمع كل عام". ما السمة الأكثر جوهرية؟',a:"إذا استُوفيت الشروط، يوجد واجب للدفع، والرفض غير مسموح"},{q:"من بين الأربعة، من خاضع لواجب دفع الزكاة؟",a:"مسلم يملك ثروة تتجاوز النصاب باستمرار"},{q:"أي سيناريو يصف الزكاة بأفضل شكل؟",a:"(1) و (3) - الدفع مرة واحدة سنويًا لأن الثروة تجاوزت الحد، وإعطاء مبلغ محسوب لأشخاص يستوفون الفئات المُعرَّفة"},{q:"أي مما يلي يصف بأفضل شكل الأثر الاجتماعي للزكاة؟",a:"يتدفق المال من الذين لديهم ثروة إلى المجتمع بأكمله، مما يقلّص التفاوت"},{q:"أي مما يلي يصف الزكاة بأفضل شكل؟",a:"مسلم لديه ثروة تتجاوز النصاب لديه واجب الدفع"}]},{title:"درس: كيف تُحسب الزكاة",items:[{q:"لينطبق واجب الزكاة على شخص يحمل ثروة تتجاوز النصاب، يجب استيفاء شرط آخر. ما هو؟",a:"حمل باستمرار ثروة تتجاوز النصاب لمدة سنة"},{q:"كم زكاة يدفع شخص حمل باستمرار ثروة بـ 580,000 جنيه، تتجاوز النصاب، لمدة سنة؟",a:"14,500 جنيه"},{q:"من مُضمَّن كمستفيد من الزكاة؟ (1) شخص سُرق ماله خلال السفر، (2) شخص لديه دخل كافٍ، (3) شخص لا يستطيع دفع دَينه، (4) شخص تتجاوز ثروته النصاب",a:"(1) و (3)"},{q:"أي مما يلي يصف نظام الزكاة بأفضل شكل؟",a:"إنه نظام يدفعه الأفراد كواجب، منفصل عن إدارة الدولة"},{q:'هناك نوعان: "زكاة المال" و"زكاة الفطر". أي مما يلي يصفهما بأفضل شكل؟',a:"زكاة المال واجب مشروط؛ زكاة الفطر تُدفَع أساسًا بالطعام"}]},{title:"درس: من يستحق الزكاة؟",items:[{q:"شخص استلم مال زكاة استخدمه لشراء بقالة. كيف يتحرك المال المدفوع للمحل عبر المجتمع؟",a:"يصبح دخل المحل، ثم ينتقل لشخص آخر ويتدفق عبر المجتمع"},{q:"أي وجهات النظر تختلف بين الزكاة والضرائب؟ (1) وظيفة جعل المال يتدفق، (2) من يجب أن يدفع، (3) إلى أين يذهب المال، (4) دور المساهمة في استقرار المجتمع",a:"(2) و (3)"},{q:'أيها أقرب إلى الفعل المحرَّم كـ "ربا" في التمويل الإسلامي؟',a:"إقراض مال واستلام أكثر بغض النظر عن النتيجة"},{q:'أي مما يلي يفسّر بأفضل شكل لماذا نظام المرابحة لا يقع تحت "الربا"؟',a:"إنه شكل يشتري ويبيع فيه البنك سلعًا، لا إقراض مال"},{q:"أي توليفة تحدد العبارات التي لا تنطبق كمبادئ أساسية للتمويل الإسلامي؟ (1) تجنّب طرق إقراض المال، (2) تحريم كل الأنظمة المالية تمامًا، (3) استخدام طرق بديلة كالمرابحة والصكوك، (4) مقدّمو المال لا يتحمّلون أي خطر",a:"(2) و (4)"}]},{title:"اختبار المستوى الرابع - فهم الزكاة",items:[{q:"أي مما يلي يصف الزكاة بشكل صحيح؟",a:"إنه شكل واجب من العطاء مُعرَّف كأحد أركان الإسلام الخمسة"},{q:"أي مما يلي يصف النصاب بشكل صحيح؟",a:"هو الحد الأدنى للثروة الذي ينشأ عنده واجب دفع الزكاة"},{q:"ما الفرق الأساسي بين الزكاة والصدقة؟",a:"الزكاة واجب بمبلغ ومستفيدين ثابتين، بينما الصدقة طوعية وحرة"},{q:"أي مما يلي هو التوليفة الصحيحة للشرطين لنشوء واجب الزكاة؟",a:"حمل ثروة تتجاوز النصاب + حملها باستمرار لمدة سنة"},{q:"كم زكاة يدفع شخص حمل ثروة بـ 3,000,000 جنيه، تتجاوز النصاب، لمدة سنة؟",a:"75,000 جنيه"},{q:"أي مما يلي صحيح كشخص مُضمَّن في فئات مستفيدي الزكاة؟",a:"شخص نفد ماله خلال السفر ويواجه صعوبة في العودة إلى بيته"},{q:"ما الفرق الأساسي بين الزكاة والضرائب؟",a:"الزكاة واجب ديني فردي، والضرائب تحصيل بقانون الدولة"},{q:"أي مما يلي يصف بأفضل شكل أثر مال الزكاة على المجتمع؟",a:"يتدفق المال من المستفيد إلى المجتمع بأكمله، مما يؤدي إلى تقليص التفاوت"},{q:'أي نوع من الفعل محرَّم كـ "ربا" في التمويل الإسلامي؟',a:"إقراض المال واستعادة أكثر بغض النظر عن النتيجة"},{q:"أي مما يلي يصف بأفضل شكل المحتوى الذي تعلمته بشكل عام؟",a:"الحساب والمستفيدون مُعرَّفون كواجب، مما يساهم أيضًا في تضييق التفاوت الاجتماعي"}]}]},{id:5,title:"المستوى الخامس — ما هو المشروع التجاري",tag:"الملكية والربح وCSR",sections:[{title:"درس: أنواع ملكية المشاريع",items:[{q:'أي مما يلي يُعتبَر "منشأة عامة"؟',a:"حافلة تديرها المدينة للنقل المحلي"},{q:'أي مشهد ينطبق على "المشروع الفردي"؟',a:"ورشة بدأها حرفي بمفرده ويديرها بنفسه"},{q:'أي مشهد ينطبق على "المسؤولية غير المحدودة"؟',a:"شركاء في شركة تضامن يتحمّلون كل دَين الشركة بنفسهم"},{q:"آدم يريد بدء مقهى مع أسرته وقليل من المعارف، يريد كسب ربح ومشاركته، ودعم بعضهم بمجموعة صغيرة. أي شكل أنسب؟",a:"شركة ذات مسؤولية محدودة (شكل يديره عدد قليل من الأعضاء جميعهم بمسؤولية محدودة)"},{q:"شخص يريد إنشاء مكان لدعم التعلّم لأطفال في منطقتهم مجانًا، والاستمرار لفترة طويلة. أي شكل أنسب؟",a:"منظمة غير ربحية (شكل لا يوزّع الدخل ويعمل لصالح المجتمع)"}]},{title:"درس: الغرض من المشاريع ودورها",items:[{q:"شركة دخلها 12,000,000 جنيه، والمُستخدَم للتشغيل 9,000,000 جنيه، والمتبقي 3,000,000 جنيه. ما تمثّل الـ 3,000,000؟",a:"ربح الشركة"},{q:'إدارة شركة تقرر: "لنحتفظ بربح الشركة المتبقي داخل الشركة كاحتياط". أي استخدام يتوافق؟',a:"الأرباح المحتجزة"},{q:"لشركة مساهمة كبيرة 10,000 مساهم. من يتخذ فعليًا القرارات عن الإدارة اليومية؟",a:"أعضاء مجلس الإدارة المختارون في الجمعية العامة للمساهمين يناقشون ويقررون في مجلس الإدارة"},{q:"أي توليفة لأصحاب المصلحة؟ 1 مستثمر، 2 موظف، 3 عميل، 4 شركة أخرى تشتري منها قطع غيار، 5 شخص يعيش قرب المصنع، 6 شخص في منطقة أخرى رأى الشركة فقط على التواصل",a:"الخمسة أشخاص 1، 2، 3، 4، 5"},{q:'اختر الوصف "غير الصحيح" عن ربح الشركة وأصحاب المصلحة',a:"في شركة مساهمة كبيرة، يقرر المساهمون أنفسهم مباشرة ويديرون كل الإدارة اليومية"}]},{title:"درس: المسؤولية الاجتماعية للشركات CSR",items:[{q:'أي مما يلي يفسّر بأفضل شكل "CSR"؟',a:'نهج تحاول فيه الشركة تحقيق ثلاث مسؤوليات، "اتباع القواعد"، و"الاهتمام بالبيئة"، و"المساهمة في المجتمع والمنطقة المحلية"، تجاه نطاق واسع من الأطراف كالمساهمين والموظفين'},{q:"أي توليفة تشمل كل الأفعال المتعلقة بالامتثال؟ 1 شركة أغذية تتبع معايير السلامة، 2 شركة تزوّر بيانات المكونات، 3 مصنع يصرّف مياه الصرف دون معالجة، 4 شركة تتبرّع، 5 شركة تقسّم أرباحها، 6 شركة تنظّم ساعات عمل الموظفين ضمن النطاق القانوني",a:"1، 2، 3، 6 - كما وردت في الملف"},{q:'أي توليفة تشمل كل الأفعال التي تنطبق على "الاهتمام بالبيئة"؟ 1 حوّلت الكهرباء إلى طاقة شمسية، 2 غيّرت الحاويات إلى ورقية، 3 ابتكرت طرقًا لجعل المنتجات أسهل للشراء، 4 قلّلت النفايات، 5 راقبت معايير السلامة، 6 عرضت إعلانًا',a:"1، 2، 4"},{q:'أي توليفة تشمل كل الأفعال التي تنطبق على "مساهمة الشركة في المجتمع"؟ 1 رعت بطولة كرة قدم، 2 بدأت إعادة تدوير، 3 تدعم موظفين يتطوعون، 4 تراقب معايير السلامة، 5 أنشطة إرسال منتجات للمناطق المتضررة، 6 زادت ميزانية الإعلانات',a:"1، 3، 5"},{q:"أي توليفة تشمل كل الجهود التي تنطبق على أي من محاور ESG الثلاثة؟ 1 طاقة شمسية، 2 خفّضت أسعار المنتجات، 3 بيئة عمل آمنة، 4 آلية لمراقبة الإدارة، 5 قلّلت النفايات، 6 أنشطة تبرعات",a:"1، 3، 4، 5، 6"},{q:"شركة حوّلت كل الكهرباء في مصنعها إلى طاقة طبيعية. أي فكرة ينطبق عليها الجهد؟",a:"كجزء من CSR، ممارسة فعلية للاهتمام بالبيئة"}]},{title:"اختبار المستوى الخامس",items:[{q:'أي منها ينطبق على "منشأة عامة"؟',a:"حافلة تديرها المدينة يستقلّها المواطنون عادة"},{q:'في أي شركة يتحمّل الشركاء "مسؤولية غير محدودة"؟',a:"شركة تضامن"},{q:'أي منها وصف صحيح لـ "منظمة غير ربحية"؟',a:"منظمة تعمل لصالح المجتمع وتستخدم الدخل للأنشطة دون توزيعه"},{q:'أي مما يلي يفسّر بأفضل شكل "ربح الشركة"؟',a:"المتبقي بعد طرح النفقات الضرورية من المال الذي دخل الشركة"},{q:"أي توليفة تختار كل ما ينطبق كاستخدامات لربح الشركة؟ 1 استثمار رأسمالي وبحث وتطوير، 2 توزيعات أرباح، 3 أرباح محتجزة، 4 تبرع للمجتمع المحلي",a:"1، 2، 3"},{q:'في أي مشهد يحدث "الفصل بين الملكية والإدارة"؟',a:"شركة كبيرة يستثمر فيها مساهمون كثيرون ويديرها أعضاء مجلس إدارة مختارون"},{q:"أي توليفة تشمل كل أصحاب المصلحة؟ 1 مساهم، 2 موظف، 3 عميل، 4 شركة أخرى تقدّم مواد خام، 5 أشخاص محليون قرب المصنع، 6 شخص في منطقة أخرى لم يسمع باسم الشركة أبدًا",a:"1، 2، 3، 4، 5"},{q:'أي مما يلي يصف بأفضل شكل "CSR"؟',a:"نهج تعمل فيه شركة بمسؤولية تجاه نطاق واسع من الأطراف التي تتصل بها (الناس والبيئة)"},{q:'أي فعل ينطبق على "الامتثال"؟',a:"شركة أغذية تصنع منتجات مع اتباع معايير السلامة المُقرَّرة بشكل صحيح"},{q:"أي توليفة تحدد كل العبارات الصحيحة؟ 1 المنشأة العامة بهدف دعم حياة المواطنين، 2 ربح الشركة يُقسَّم في اتجاهات متعددة، 3 في الشركة ذات المسؤولية المحدودة لا يحتاج الأعضاء لدفع دَين الشركة من أصولهم، 4 CSR واجب تبرّع دائمًا، 5 الاستثمار وفق ESG يقيّم الشركة بالنظر إلى ثلاثة محاور",a:"1، 2، 3، 5"}]}]}];var bc=[{id:6,title:"المستوى السادس — عمليات الأعمال والاقتصاد",tag:"الدورة الاقتصادية وسلاسل التوريد",sections:[{title:"درس: كيف تحرّك الشركات الاقتصاد",items:[{q:"بعد أن تصل فاتورة الهاتف المدفوعة من أسرتك إلى شركة الاتصالات، كيف تتحرك في المجتمع؟",a:"تُقسَّم بين عمال الشركة، والموردين، والدولة، وما شابه، وتستمر في التحرك بعد ذلك"},{q:'أي مما يلي يصف بأفضل شكل "الدورة الاقتصادية"؟',a:"بنية يتحرك فيها المال والسلع والخدمات والعمالة بين الأطراف الثلاثة: الأسر والشركات والحكومة"},{q:'أي مما يلي يصف بأفضل شكل "الطرق الثلاث لقياس الناتج المحلي الإجمالي"؟',a:"منظور الإنتاج ومنظور الدخل ومنظور الإنفاق هي الحركة نفسها مرئية من منظورات مختلفة، فتتطابق الإجماليات"},{q:"أسرتك اشترت بـ 1,000 جنيه. المحل استخدم 800 جنيه لرواتب ومخزون، والموظف استخدم 460 جنيهًا في محل آخر، وهكذا. ما وصف الظاهرة؟",a:"بجمع كل المال المُستخدَم في كل خطوة من المخزون والتسوّق، يصبح مبلغًا أكبر بكثير من ما دفعته أسرتك أولًا"},{q:'صديق قال: "حتى لو تسوّقت في محل، هذا فقط لصالح ذلك المحل". ما الرد الأكثر ملاءمة؟',a:"المال المدفوع عند التسوّق لا يتوقف عند المحل، يُقسَّم إلى رواتب الموظفين، والموردين، وضرائب الدولة، ويتسلسل ويتحرك أكثر من ذلك"}]},{title:"درس: سلاسل التوريد وسلاسل القيمة",items:[{q:"أي مما يلي هو الترتيب الصحيح الذي يصل به قميص إلى يدي المستهلك؟",a:"فلّاح القطن ← مصنع الخيوط ← مصنع الأقمشة ← مصنع الخياطة ← النقل ← المحل ← المستهلك"},{q:"مصنع خيوط شرى قطنًا بـ 80 جنيهًا وباعه بـ 200 جنيه. مصنع أقمشة شراه بـ 200 وباعه بـ 230 جنيهًا. ما إجمالي القيمة المضافة عند المصنعين؟",a:"240 جنيه - كما وردت في الملف"},{q:'أي مما يلي يصف بأفضل شكل "تقسيم العمل الدولي"؟',a:"آلية تتخصّص فيها كل دولة في ما تتميّز فيه وما هو فعّال من حيث التكلفة، فتبني منتجًا واحدًا معًا"},{q:"1 شركة ماركة قمصان مصرية تترك الخياطة لمصنع في فيتنام، 2 شركة ملابس مصرية تترك تشغيل موقعها لشركة تكنولوجيا معلومات داخل مصر. أيهما تقسيم عمل دولي وأيهما استعانة بمصادر خارجية؟",a:"1 تقسيم عمل دولي، 2 استعانة بمصادر خارجية"},{q:"توقّف مصنع أقمشة مؤقتًا بسبب كارثة. ماذا يحدث لسلسلة توريد القميص؟",a:"عندما يتوقف مصنع الأقمشة، ينتشر التأثير لمصنع الخياطة، والنقل، والمحل بعده، وفي النهاية تتوقف الأقمصة عن الوصول للمحل"}]},{title:"درس: المشاريع والحكومة والمجتمع",items:[{q:"أي مما يلي يصف بأفضل شكل ضريبة الشركات؟",a:"ضريبة يُدفَع فيها جزء من ربح الشركة النهائي الذي أنتجته الشركة للحكومة"},{q:'أي توليفة تستخدم "خدمة عامة"؟ 1 السير على طريق المدرسة، 2 شراء وجبات خفيفة، 3 شرب الماء من إمداد المياه، 4 شراء قهوة في مقهى، 5 الاتصال بـ 911 لطلب سيارة إسعاف، 6 دفع رسوم لخدمة بث فيديو',a:"1، 3، 5"},{q:"أي مما يلي يفسّر بأفضل شكل السبب الرئيسي لإنشاء الحكومة آليات التنظيم والترخيص للشركات؟",a:"لوضع القواعد اللازمة لأنشطة الشركات حتى يستطيع الجميع في المجتمع العيش بطمأنينة"},{q:"أي مما يلي يصف بأفضل شكل منطقة اقتصادية خاصة؟",a:"منطقة خاصة تقدّم فيها الحكومة معاملة تفضيلية بشأن الضرائب والقواعد لجلب الشركات"},{q:"ما هو غير الصحيح بخصوص العلاقة بين الشركات والحكومة؟",a:"تدعم الحكومة الشركات داخل منطقة اقتصادية خاصة بتحديد ضرائبهم أعلى من الأماكن الأخرى"}]},{title:"اختبار المستوى السادس",items:[{q:"أي مما يلي هو التوليفة الأفضل للأطراف الثلاثة في الدورة الاقتصادية؟",a:"الأسر، والشركات، والحكومة"},{q:"أي مما يلي يصف بأفضل شكل الطرق الثلاث لقياس الناتج المحلي الإجمالي؟",a:"المبدأ القائل بأن عندما تنظر إلى حركة الاقتصاد كله من ثلاثة منظورات، الإجماليات دائمًا بنفس الحجم"},{q:"أي مما يلي يصف بأفضل شكل أثر المضاعف؟",a:"ظاهرة تتسلسل فيها دورة واحدة من الصرف، ولمجتمع بأكمله تُخلَق حركة اقتصادية أكبر من المبلغ الأول"},{q:"أي مما يلي يصف بأفضل شكل سلسلة التوريد؟",a:"سلسلة التدفقات من توفير المواد الخام، عبر المعالجة والتوزيع، إلى الوصول ليد المستهلك"},{q:"أي مما يلي هي المعادلة الصحيحة لحساب القيمة المضافة؟",a:"المقدار المتبقي بعد طرح تكلفة الشراء من سعر البيع"},{q:"أي مما يلي يصف بأفضل شكل تقسيم العمل الدولي؟",a:"آلية تتخصّص فيها الدول في ما تتميّز فيه وتستطيع إنتاجه بفعالية"},{q:"أي مما يلي يصف بأفضل شكل الاستعانة بمصادر خارجية؟",a:"آلية لا تفعل فيها كل شيء داخليًا بل تترك جزءًا من العمل لشركات متخصصة خارجية"},{q:"أي مما يلي يصف بأفضل شكل الفرق بين ضريبة الشركات وضريبة الدخل؟",a:"ضريبة الشركات ضريبة تدفع فيها شركة جزءًا من ربح الشركة للحكومة، وضريبة الدخل ضريبة يدفع فيها فرد عامل جزءًا من دخله للحكومة"},{q:'أي مما يلي هو المثال الأفضل لـ "التنظيم والترخيص" الحكومي؟',a:"آلية عند بدء محل يتعامل مع الطعام، لا يمكنك الفتح دون الحصول على إذن النظافة من الحكومة"},{q:"أي مما يلي يصف بأفضل شكل آلية المناطق الاقتصادية الخاصة والاستثمار الأجنبي المباشر (FDI)؟",a:"آلية تُنشئ فيها الحكومة منطقة اقتصادية خاصة وتجلب شركات من الخارج بإعطاء معاملة تفضيلية على الضرائب والقواعد"}]}]},{id:7,title:"المستوى السابع — الدخل والنفقات والسلوك الاقتصادي",tag:"الدخل والادخار والاستهلاك",sections:[{title:"درس: أنواع ومصادر الدخل",items:[{q:"مقارنة بالعام الماضي، ارتفع الراتب 10%، وارتفعت الأسعار أيضًا 10%. كيف تغيّر مستوى المعيشة؟",a:"تستطيع التوقّع أنها بقيت نفسها. لأن زيادة الراتب وزيادة الأسعار متساويتان"},{q:"ارتفع الأجر الاسمي 8%، وكان معدل التضخم 5%. ماذا حدث للأجر الحقيقي؟",a:"ارتفع الأجر الحقيقي. لأن معدل زيادة الأجر الاسمي يتجاوز معدل التضخم"},{q:"شخص لديه محله الخاص ويخبز ويبيع الخبز بنفسه. ما نوع الدخل؟",a:"دخل الأعمال. لأنه يدير المحل بنفسه، وما يتبقى بعد طرح النفقات من الإيرادات يصبح دخله"},{q:"أي مما يلي يفسّر التحويالت بشكل صحيح؟",a:"مال يُرسَل فيه جزء من دخل العمل المكتسب من العمل بالخارج للأسرة، فيصبح عمودًا لدخل العملة الأجنبية للدولة"},{q:'الأجر الاسمي لم يتغيّر منذ العام الماضي. مع ذلك يقول الشخص: "مؤخرًا، أشعر أن الحياة أسهل قليلًا". ما السبب الأكثر منطقية؟',a:"لأن الأسعار انخفضت، ازداد المقدار القابل للشراء بنفس الأجر الاسمي"}]},{title:"درس: فهم النفقات",items:[{q:'من بين النفقات حولك، أي منها يُعتبَر "تكلفة ثابتة"؟',a:"الرسوم الشهرية لخدمة بث موسيقى"},{q:'أي توليفة تجمع فقط "الأشياء التي تتغيّر حسب الشهر (تكاليف متغيّرة)"؟ 1 الإيجار، 2 تكاليف الطعام، 3 الرسوم الشهرية للهاتف، 4 تكلفة شراء الملابس',a:"2 و 4"},{q:"ما هو غير الصحيح كشرح للميل للاستهلاك والميل للادّخار؟",a:"عندما يزداد الدخل، يزداد الميل للاستهلاك والميل للادّخار كلاهما معًا"},{q:"لديك 500 جنيه وتتردّد بين ادّخارها أو الأكل مع الأصدقاء. عند اتخاذ خيار مقتنع به مع الإدراك لتكلفة الفرصة البديلة، أي طريقة أكثر منطقية؟",a:"طريقة مقارنة الخيارين والحكم فيما إذا كان ما تتنازل عنه يستحق ذلك"},{q:"تتردّد بشأن الاشتراك الشهري في خدمة مجلة بـ 150 جنيهًا شهريًا. عند الحكم باستخدام تكلفة الفرصة البديلة والتكلفة الثابتة، أي تفكير يعطي أكبر شعور بالاقتناع؟",a:"تفكير يقارن ما تستطيع فعله بـ 150 جنيهًا كل شهر بالقيمة العالية للمجلة، ويحكم فيما إذا كنت تستطيع الاقتناع"}]},{title:"درس: الأسر والاقتصاد",items:[{q:"ما هو الدخل المتاح للتصرف؟",a:"مال متبقٍ في يد الأسرة بعد طرح ضريبة الدخل واشتراكات التأمين الاجتماعي من الراتب"},{q:'أي مما يلي يصف بأفضل شكل الظاهرة التي تُظهرها "مفارقة الادّخار"؟',a:"ظاهرة يمكن فيها للادّخار المنطقي على المستوى الفردي أن يُبرّد اقتصاد المجتمع بأكمله عندما يفعله الجميع في نفس الوقت"},{q:"ماليّة أسرتك أصبحت ضيقة قليلًا. ما الحكم الأكثر حكمة؟",a:"تمييز الصرف الضروري والصرف القابل للمراجعة للأسرة، ومراجعته ضمن نطاق معقول"},{q:"أي مما يلي يفسّر بأفضل شكل الدعم الحكومي؟",a:"آلية تتحمّل فيها الحكومة جزءًا من سعر المنتج حتى ينخفض عبء الأسرة. تستخدم الضرائب"},{q:'انتشر الحديث بأن "الأسر ضيقة" عبر الدولة كلها، والأسر المحيطة كلها تعزّز الادّخار دفعة واحدة. أسرتك لم يحدث لها تغيّر كبير. ما السياسة الأكثر ملاءمة؟',a:"تمييز الصرف الضروري والصرف القابل للمراجعة حسب وضع أسرتك الخاصة، والحكم مع الإدراك أيضًا للاتصال بالمجتمع بأكمله"}]},{title:"اختبار المستوى السابع",items:[{q:"ما اسم الدخل المكتسب من العمل كموظف لدى شركة أو شخص؟",a:"دخل العمل"},{q:"أي مما يلي يصف بأفضل شكل الفرق بين الأجر الاسمي والأجر الحقيقي؟",a:"الأجر الاسمي هو المقدار المدفوع كراتب، والأجر الحقيقي هو الأجر المرئي بالقدرة الشرائية الفعلية مع أخذ تغيّرات الأسعار بالحسبان"},{q:"أي مما يلي يصف بأفضل شكل موقع التحويالت في اقتصاد مصر؟",a:"مال يرسله المصريون العاملون بالخارج لأسرهم في البيت، أصبح مصدر دخل مهمًا لاقتصاد مصر"},{q:"أي مما يلي هو التوليفة الأفضل للتكلفة الثابتة والتكلفة المتغيّرة؟",a:"أمثلة التكلفة الثابتة هي الإيجار ورسوم الاتصالات الأساسية، وأمثلة التكلفة المتغيّرة هي تكاليف الطعام وتكاليف الضروريات اليومية"},{q:"أي مما يلي يفسّر بأفضل شكل الميل للاستهلاك والميل للادّخار؟",a:"نسبة الدخل المتاح للتصرف الموضوعة نحو الاستهلاك هي الميل للاستهلاك، والنسبة الموضوعة نحو الادّخار هي الميل للادّخار"},{q:'أي مما يلي يفسّر بأفضل شكل "تكلفة الفرصة البديلة" في مشهد التردد بين الدراسة أو المساعدة في البيت؟',a:"إذا اخترت المساعدة في البيت، التعلّم الذي كنت ستكسبه من الدراسة يصبح تكلفة الفرصة البديلة"},{q:"أي مما يلي يفسّر بأفضل شكل الدخل المتاح للتصرف؟",a:"المال الذي تستطيع الأسرة استخدامه بحرية فعليًا، بعد طرح الضرائب واشتراكات التأمين الاجتماعي من المقدار المدفوع كراتب"},{q:"أي مما يلي يصف بأفضل شكل الموقع الذي يحتلّه استهلاك الأسر ضمن اقتصاد الدولة كلها؟",a:"يحتلّ استهلاك الأسر الجزء الأكبر ضمن الناتج المحلي الإجمالي، وهو اللاعب الرئيسي الأكبر الذي يحمل الاستهلاك ضمن الاقتصاد"},{q:'قلّلت أسر عبر الدولة الصرف دفعة واحدة، فانخفضت إيرادات المحلات والتوظيف والدخل. ما تفسير "مفارقة الادّخار"؟',a:"ظاهرة يعمل فيها الادّخار، المنطقي لأسرة فردية، على تبريد الاقتصاد عندما يحدث في نفس الوقت عبر المجتمع بأكمله"},{q:"أي مما يلي يصف بأفضل شكل آلية الدعم الحكومي؟",a:"آلية تتحمّل فيها الحكومة جزءًا من سعر منتج حتى تستطيع الأسرة شراءه بأرخص. يأتي المال من الضرائب"}]}]},{id:8,title:"المستوى الثامن — محاكاة حياة العمل",tag:"محاكاة • 50 سؤالًا",sections:[{title:"محاكاة حياة العمل — 50 سؤالًا",items:[{q:'"بقالة محلية"، و"سلسلة مطاعم كبرى"، و"مرفق مياه". أيها "منشأة عامة"؟',a:"مرفق مياه تديره الحكومة الوطنية أو المحلية"},{q:'أي منها يصف بأفضل شكل "المشروع الفردي"؟',a:"شكل يدير فيه فرد المشروع، ويعود كل من الدخل المكتسب والديون إلى الفرد بالكامل"},{q:'"شركة تضامن"، و"شركة توصية بسيطة"، و"شركة ذات مسؤولية محدودة"، و"شركة مساهمة". أي منها يصف "الشركة المساهمة"؟',a:"شكل يتحمّل فيه كل المستثمرين مسؤولية فقط بحدود استثمارهم"},{q:'أي مشهد ينطبق بأفضل شكل على "المسؤولية غير المحدودة"؟',a:"مشهد لا تستطيع فيه شركة تضامن سداد دَين كبير، ويسدّد مستثمر المبلغ كاملًا حتى باستخدام أصوله الشخصية"},{q:'ما الفرق الأكبر بين "منظمة غير ربحية" و"شركة"؟',a:"الشركة منظمة هدفها الأساسي السعي للربح، لكن المنظمة غير الربحية تهدف للمساهمة الاجتماعية"},{q:'المدير يقول: "لننمّي ربح شركتنا أكثر". ماذا يعني "ربح الشركة"؟',a:"المال المتبقي في اليد بعد طرح النفقات من الإيرادات"},{q:"إيرادات الشهر الماضي 300,000 جنيه، النفقات 120,000 مواد خام، 70,000 عمالة، 20,000 تكاليف أخرى. ما ربح المصنع؟",a:"90,000 جنيه"},{q:"إذا استطعت تقليص كل نفقة بنفس النسبة، أي عنصر نفقات يمكن أن يزيد ربح الشركة أكثر؟",a:"تكاليف المواد الخام. هي الأكبر بين النفقات، فتقليصها له الأثر الأكبر"},{q:"المساهمون يستثمرون، لكن من يتعاملون مع الإدارة اليومية هم الرئيس والمسؤولون المختارون. ما وصف بنية الشركة؟",a:"المساهمون الذين يستثمرون في الشركة والأشخاص الذين يديرونها فعليًا مُقسَّمون إلى مناصب منفصلة"},{q:"أي توليفة تختار كل أصحاب المصلحة؟ 1 مساهمو الشركة، 2 الموظفون، 3 العملاء، 4 شركة في صناعة مختلفة بلا صفقات أو اتصال",a:"1، 2، و 3"},{q:'زميل يقول: "لا نسعى فقط للربح، نبذل جهدًا في أنشطة كهذه أيضًا". أي فكرة يمثل الجهد؟',a:"CSR. ينطبق على فكرة عمل الشركة بمسؤولية تجاه نطاق واسع من الأطراف"},{q:'أي مما يلي هو التوليفة الأفضل للعناصر الثلاثة لـ "ESG"؟',a:"البيئة، والمجتمع، والحوكمة، المحاور الثلاثة لتقييم شركة"},{q:'زميل يقول: "هذا العمل يقوم على الحفاظ على الامتثال". ما معنى "الامتثال"؟',a:"مراعاة القوانين واللوائح الداخلية وحتى قواعد وأخلاقيات المجتمع أثناء العمل"},{q:'كيف تتصل "مراعاة القواعد" بـ "العمل لصالح المجتمع"؟ ما العلاقة بين CSR والامتثال؟',a:"الامتثال أساس CSR، القاعدة لتحقيق المسؤولية الاجتماعية"},{q:"أي مما يلي يصف بأفضل شكل الهدف الأساسي من إعطاء الحكومة دعمًا لشركات؟",a:"لدعم أنشطة الشركة وتنشيط الاقتصاد كله"},{q:"إذا توقفت الشركات عن دفع الرواتب للأسر، ماذا سيحدث لتدفق المال كله؟",a:"تنخفض قدرة الأسر الشرائية ودخل الشركات أيضًا، وفي النهاية تنخفض الإيرادات الضريبية ويتأثر الكل"},{q:'شركة بناء فازت بعقد أعمال عامة حكومية. "المال المصروف حديثًا يصبح إيرادات، ثم رواتب، ومن خلال التسوّق يستمر في زيادة رواتب آخرين". أي ظاهرة؟',a:"الصرف الأولي يُولّد استهلاكًا جديدًا واحدًا تلو الآخر، وتتضخّم حركة مال المجتمع كله أكبر من الصرف الأولي"},{q:'الطعام يُحمَل بترتيب "توفير المواد الخام ← المعالجة ← التوزيع ← متجر التجزئة ← المستهلك". أي كلمة تمثّل هذا التسلسل؟',a:"سلسلة التوريد. تدفق المنتجات من المواد الخام إلى المستهلك"},{q:'كم قيمة مضافة جديدة تتولّد في مرحلة "المصنع ← التوزيع"؟ (القيمة المضافة = سعر البيع - سعر الشراء)',a:"2,000 جنيه"},{q:'أي مما يلي يصف بأفضل شكل خاصية منظور "سلسلة القيمة"؟',a:"منظور يركّز على كم قيمة تتولّد في كل مرحلة من المواد الخام إلى المستهلك"},{q:"شركة توفّر مواد خام من الخارج. أي مما يلي يفسّر بأفضل شكل طريقة اتصال الدول ببعضها من خلال التجارة؟",a:"آلية تتولّى فيها كل دولة إنتاج مجالها التخصصي وتتكامل من خلال التجارة"},{q:'موظف قال: "نترك أعمال المحاسبة لشركة متخصصة خارجية". أي مما يلي يفسر النهج؟',a:"آلية لتفويض جزء من عمليات الشركة الخاصة لشركة متخصصة خارجية"},{q:'مدير قال: "ضريبة الشركات مرتفعة هذا العام". ما "ضريبة الشركات"؟',a:"ضريبة تدفعها شركة للحكومة وفقًا لربح الشركة لتلك السنة"},{q:"كيف تختلف ضريبة الدخل عن ضريبة الشركات؟",a:"تُفرَض ضريبة الدخل على دخل فرد، وضريبة الشركات على ربح شركة"},{q:'أي مما يلي هو التوليفة الأفضل لأمثلة "الخدمة العامة"؟',a:"خدمات كالطرق والمياه والتعليم والشرطة التي تدعم بنية أساسية يستخدمها المجتمع كله"},{q:'مصنع شريك في منطقة اقتصادية خاصة. ما "المنطقة الاقتصادية الخاصة"؟',a:"منطقة تضع فيها الحكومة حوافز ضريبية وما شابه في منطقة محدَّدة لجلب الاستثمار والأعمال"},{q:"ما وصف الاستثمار الأجنبي المباشر (FDI)؟",a:"شركة أجنبية تبني مصنعًا أو فرعًا في دولة أخرى للقيام بأعمال طويلة الأمد"},{q:'بفضل التنظيم والترخيص الحكومي، يمكن بيع الطعام بأمان. ما دور "التنظيم والترخيص" الحكومي؟',a:"آلية تضع فيها الحكومة قواعد معينة على النشاط التجاري لحفظ سلامة السوق ونزاهته"},{q:"عندما تفعل شركة أشياء جيدة للمجتمع، ماذا يحدث من أشياء جيدة للشركة نفسها؟ ما ميزة العمل على CSR وESG؟",a:"كسب الثقة الاجتماعية، تصبح الشركة أكثر احتمالًا لأن يختارها العملاء والمستثمرون على المدى الطويل"},{q:'أي مما يلي هو المثال الأفضل لـ "العلاقة ثنائية الاتجاه" بين الشركات والحكومة؟',a:"تدفع الشركات ضرائب للحكومة، وتقدّم الحكومة خدمات عامة ومناطق اقتصادية خاصة للشركات"},{q:'تحمل قسيمة راتبك، فكّرت: "أي نوع من الدخل هو دخلي؟" ما نوع الدخل مقابل العمل موظَّفًا؟',a:"دخل العمل"},{q:"صديق يريد فتح مقهاه الخاص. ما نوع الدخل وطريقة حساب المقدار؟",a:"دخل الأعمال. المتبقي بعد طرح كل النفقات الضرورية كالمشتريات والإيجار وتكاليف العمالة من الإيرادات"},{q:'"هناك أيضًا طريقة للكسب بجعل المال يعمل لصالحك". ما التوليفة الأفضل لأمثلة "دخل الأصول"؟',a:"فائدة المدخرات، وتوزيعات أرباح الأسهم، ودخل تأجير العقارات، توليفة دخل مُتولّد من الأصول"},{q:'ترى مصطلح "الأجور الحقيقية". ما الفرق بين "الأجور الاسمية" و"الأجور الحقيقية"؟',a:"الأجور الاسمية هي مقدار الراتب نفسه، والأجور الحقيقية هي الأجر المرئي بمقدار ما تستطيع شراءه"},{q:'صديق قال: "ارتفع راتبي قليلًا، لكنني أشعر أن الأشياء التي أستطيع شراءها لم تزد كثيرًا". ما تفسير الوضع؟',a:"ارتفعت الأجور الاسمية، لكن ارتفاع الأسعار كان أكبر، فلم تزد الكمية القابلة للشراء كثيرًا"},{q:'صديق يعمل بالخارج ويرسل جزءًا من المال لأسرته. ما "التحويالت"؟',a:"مال يرسله شخص عامل بالخارج لأسرة تعيش في البيت"},{q:"الأجور الاسمية (الراتب الإجمالي) 10,000 جنيه. يُطرَح 1,500 ضرائب و 500 اشتراكات تأمين اجتماعي. ما إجمالي المطروح والمتبقي (الدخل المتاح للتصرف)؟",a:"إجمالي المطروح: 2,000 جنيه / المتبقي: 8,000 جنيه"},{q:"القيمة الاسمية للراتب لم تتغيّر منذ الشهر الماضي، وارتفعت الأسعار. ماذا حدث للأجور الحقيقية؟",a:"تُعتبَر الأجور الحقيقية قد انخفضت بمقدار ارتفاع الأسعار"},{q:'ما التوليفة الأفضل للتمييز بين "التكاليف الثابتة" و"التكاليف المتغيّرة" ضمن نفقات الأسرة؟',a:"التكاليف الثابتة: الإيجار، ورسوم الاتصالات، وأقساط التأمين / التكاليف المتغيّرة: الطعام، والترفيه، والنقل"},{q:"بناءً على بيان ميزانية الأسرة، ما مقدار المدخرات هذا الشهر؟",a:"1,000 جنيه"},{q:"من بين النفقات، عندما تجمع فقط التكاليف الثابتة، أي نسبة تقريبية تحتلّها من إجمالي النفقات؟",a:"حوالي 34%"},{q:'الدخل المتاح للتصرف 20,000 جنيه، منه 15,000 جنيه للاستهلاك و 5,000 جنيه للادّخار، ما أقرب "ميل للاستهلاك"؟',a:"حوالي 75%"},{q:"تستطيع استخدام ساعة لعمل بأجر 150 جنيهًا، أو للدراسة. إذا اخترت الدراسة، ما القيمة التي تنازلت عنها؟",a:"تنازلت عن دخل 150 جنيهًا الذي كنت ستكسبه لو اخترت العمل"},{q:"لماذا تُعتبَر مراجعة التكاليف الثابتة فعّالة لتحسين ميزانية الأسرة؟",a:"بمجرد المراجعة، تستمر النفقات الشهرية في الانخفاض، فأثر الادّخار يدوم طويلًا"},{q:"توزيع الناتج المحلي الإجمالي لمصر: استهلاك شخصي حوالي 60%، استثمار شركات حوالي 20%، إنفاق حكومي حوالي 15%، صافي صادرات حوالي 5%. ما دور الاستهلاك الشخصي؟",a:"يحتلّ الاستهلاك الشخصي أكبر نسبة ضمن الناتج المحلي الإجمالي، داعمًا الاقتصاد كله"},{q:'ظاهرة: "عندما تبدأ كل الأسر بالادّخار دفعة واحدة، الاستهلاك (1)، وإيرادات الشركات (2)، والشركات (3) التوظيف، والأجور فينخفض دخل الأسر". ما التوليفة للكلمات 1 إلى 3؟',a:"1 ينخفض / 2 ينخفض / 3 تقلّص"},{q:'عُرضت "تحويالت" مصر. إذا انخفضت بشكل كبير، ما التأثير الأكثر احتمالًا على اقتصاد مصر؟',a:"تنخفض العملة الأجنبية الداخلة للدولة، ويترقّق عمود رئيسي واحد لدخل العملة الأجنبية"},{q:"الاستثمار الرأسمالي للشركات واستهلاك الأسر يتراجعان. عندما تريد الحكومة منع تقلّص النشاط الاقتصادي أكثر، أي سياسة أنسب؟",a:"تقديم دعم يساعد الأسر والشركات، مخفّفًا التراجع في الاستهلاك والاستثمار"},{q:"كيف تستخدم ربح الشركة إذا بدأت مشروعًا تجاريًا في المستقبل؟",a:"بجانب الاستثمار الرأسمالي الجديد للمستقبل، وضعه أيضًا نحو عوائد للمساهمين والموظفين والمجتمع المحلي"},{q:"ما الفعل الأكثر عدم ملاءمة لصاحب مشروع تجاري إذا بدأ شركته الخاصة؟",a:"عند نقص المال المتاح للتسوّق الشخصي، تحويل إيرادات الشركة للدفع"}]}]},{id:9,title:"المستوى التاسع — وضع الموازنة وتخصيص الموارد",tag:"الميزانية والاحتياجات والرغبات",sections:[{title:"درس: ما هي الميزانية؟",items:[{q:"أي مما يلي وصف صحيح للميزانية؟",a:"النظر مسبقًا في الدخل والنفقات ووضع خطة لتجنّب الإنفاق العشوائي"},{q:"أي مما يلي هو العبارة الأكثر دقة بخصوص سجل الدخل والنفقات؟",a:"النفقات مطروحًا منها الدخل تصبح الرصيد - كما وردت في الملف"},{q:"في شهر واحد، كان الدخل 600 جنيه والنفقات 750 جنيهًا. ما وصف الحالة؟",a:"الرصيد سالب 150 جنيهًا، عجز"},{q:'إذا كان مصروفك الشهري 1,000 جنيه، كم يمكن أن يذهب لـ "الرغبات" وفقًا لقاعدة 50/30/20؟',a:"300 جنيه"},{q:"مصروفك 1,000 جنيه. أنفقت 600 جنيه على الطعام والنقل، و 250 جنيهًا على تناول الطعام مع الأصدقاء، واحتفظت بـ 150 جنيهًا. مقارنة بقاعدة 50/30/20، ما الحكم؟",a:"الإنفاق على الاحتياجات أعلى من الدليل، فهناك مساحة للمراجعة"}]},{title:"درس: الاحتياجات مقابل الرغبات",items:[{q:"أنفقت أكثر من المُخصَّص ومصروفك ينخفض. أي إنفاق يجب أن تحتفظ به حتى آخر لحظة كاحتياج؟",a:"النقل للوصول إلى المدرسة"},{q:"ميزانيتك ستتجاوز الحد. أي نوع من الإنفاق أسهل للبدء به عند المراجعة؟",a:"راجع الإنفاق الاختياري، الذي تستطيع تغييره بحكمك الخاص، أولًا"},{q:"صنّف النفقات الأربعة: 1 النقل للمدرسة، 2 وجبات يومية في البيت، 3 استبدال حقيبة لا تزال تعمل، 4 مال المقهى للخروج مع الأصدقاء",a:"أساسي = 1 و 2 / اختياري = 3 و 4"},{q:'رأيت إعلان "عرض محدود لليوم فقط" وأردت المنتج فجأة. ما أفضل تصرّف؟',a:"تحقّق من كم تستطيع استخدامه الآن، ثم احكم بالترتيب فيما إذا كان ضروريًا وفيما إذا كان يناسب الميزانية"},{q:"تحصل على 500 جنيه كمصروف شهري وميزانيتك ستتجاوز الحد. ما أفضل نهج للمراجعة؟",a:"راجع الإنفاق الاختياري أولًا، ثم تحقّق فيما إذا كانت رغبة قد تسرّبت إلى الإنفاق الأساسي أيضًا"}]},{title:"درس: تخصيص الموارد المحدودة",items:[{q:"صنّف الأهداف الثلاثة إلى قصيرة ومتوسطة وطويلة المدى: 1 دراجة للتنقّل تريد استبدالها بعد سنتين، 2 دراسة بالخارج بعد 6 سنوات، 3 مال بدء محلك بعد 15 سنة",a:"1 قصير المدى، 2 متوسط المدى، 3 طويل المدى"},{q:'أي مشهد يصف "مفاضلة"؟',a:"الحالة التي تستطيع فيها اختيار واحد فقط، شراء لعبة أو وضع مال جانبًا"},{q:"أي توليفة صحيحة لمواقف استخدام صندوق الطوارئ؟ 1 تكاليف علاج مرض مفاجئ، 2 بطاقة تنقّل مدرسية شهرية، 3 تكاليف إصلاح دراجة تعطّلت فجأة، 4 تكلفة رحلة مخطَّط لها مسبقًا",a:"1 و 3"},{q:"خانة الادّخار 200 جنيه فقط. أي هدف تضع المال جانبًا له أولًا؟ 1 رحلة مع الأصدقاء بعد سنة، 2 فعالية رياضية بعد 5 سنوات، 3 مشروع تجاري بعد 10 سنوات",a:"ابدأ بـ 1. موعده النهائي الأقرب فتحتاج لوضع المال جانبًا له أولًا كأولوية"},{q:"بخانة ادّخار شهرية بـ 200 جنيه، أي منها أكثر توازنًا؟",a:"بناء صندوق الطوارئ ووضع المال جانبًا للأهداف قليلًا قليلًا في كل مرة، بالتوازي"}]},{title:"اختبار المستوى التاسع",items:[{q:"أي مما يلي يصف بشكل صحيح غرض إدارة الميزانية؟",a:"فهم توازن الدخل والنفقات وإدارة كيفية إنفاقك"},{q:"أي مما يلي يصف بشكل صحيح التمييز بين الاحتياجات والرغبات؟",a:'الاحتياجات "ضروريات لا تستطيع الاستمرار بدونها للعيش"، والرغبات "رغبات تستمر الحياة بدونها"'},{q:"أي مما يلي يصف بشكل صحيح تخصيص قاعدة 50/30/20؟",a:"الاحتياجات 50%، الرغبات 30%، المدخرات 20%"},{q:"أي مما يلي يصف بشكل صحيح الإنفاق الاختياري؟",a:"إنفاق لتلبية الرغبات، تستطيع رفعه أو تخفيضه بحكمك الخاص"},{q:"أي مما يلي يصف بشكل صحيح المفاضلة؟",a:"حالة تضطر فيها دائمًا للتخلّي عن شيء آخر للحصول على شيء"},{q:"أي مما يلي هو التوليفة الصحيحة للجداول الزمنية للأهداف المالية؟",a:"قصير المدى: سنة إلى ثلاث سنوات، متوسط المدى: ثلاث إلى عشر سنوات، طويل المدى: عشر سنوات أو أكثر"},{q:"أي مما يلي يصف صندوق الطوارئ بشكل صحيح؟",a:"ثلاثة إلى ستة أشهر من تكاليف المعيشة، مؤمَّنة بشكل منفصل عن الأهداف للمصروفات غير المتوقَّعة"},{q:"أي مما يلي يطابق بأفضل شكل ربط الـ 20% للمدخرات في قاعدة 50/30/20 بالأهداف المالية؟",a:"ضمن الـ 20% للمدخرات، قسّم التخصيص بوعي بين الادّخار للأهداف وصندوق الطوارئ، قليلًا لكل منهما"},{q:'عندما تريد شيئًا فجأة بعد رؤية "تخفيض حصري لليوم فقط"، أي مما يلي هو أفضل تصرّف؟',a:"تحقّق مما إذا كان احتياجًا أو رغبة، واحكم بعد مراعاة التأثير على أهدافك المالية"},{q:"أي مما يلي هو أفضل نهج عند تخصيص أموال محدودة؟",a:"وازن بين أولوية الأهداف وموعدها النهائي، بينما تؤمّن صندوق الطوارئ بالتوازي"}]}]},{id:10,title:"المستوى العاشر — الادّخار والاستقرار والتخطيط للمستقبل",tag:"الفائدة المركبة والتأمين",sections:[{title:"درس: لماذا الادّخار؟",items:[{q:'أي منها يطابق "أموال الأهداف" بأفضل شكل؟',a:"مال تضعه جانبًا بمقدار ثابت كل شهر لرحلة عائلية العام القادم"},{q:'أي منها مناسب للاحتفاظ به "صندوق طوارئ"؟',a:"مال محتفَظ به جانبًا في حال تعطّل جهاز بشكل مفاجئ واحتاج استبدالًا"},{q:'أي توليفة تختار كل ما يطابق "صندوق الطوارئ"؟ 1 مال لرحلة عائلية، 2 مال جاهز لمرض أو إصابة مفاجئة، 3 مال للتقاعد، 4 مال جاهز لتعطّل جهاز مفاجئ، 5 مال في محفظتك للوجبات والنقل',a:"2 و 4"},{q:'حتى عندما تنوي "ادّخار ما يتبقى"، لماذا يصعب الادّخار غالبًا؟',a:'لأنه عندما يبقى المال قابلًا للإنفاق في يدك، ينتهي بك إنفاقه، فحتى مع نيّة "ادّخار الباقي"، لا يتبقى شيء'},{q:'صديق يقول: "أنوي الادّخار، لكنني لا أستطيع فعلًا. أنا قلق أيضًا بشأن الطوارئ". ما أفضل نصيحة؟',a:"قسّم المدخرات بحسب الغرض، وابدأ بوضع صندوق الطوارئ جانبًا ليوم سيء أولًا"}]},{title:"درس: سحر الفائدة المركبة",items:[{q:'أي مما يلي يصف "الفائدة الثابتة" بأفضل شكل؟',a:"الفائدة الثابتة آلية يُطبَّق فيها نفس سعر الفائدة فقط على أصل المبلغ كل سنة، فينمو بمقدار متساوٍ"},{q:'أي مما يلي يصف "الفائدة المركبة" بأفضل شكل؟',a:"آلية ينضم فيها النمو من الفائدة أيضًا لأصل المبلغ، ويُطبَّق نفس سعر الفائدة على ذلك المجموع كل سنة"},{q:"إدارة 1,000 جنيه بـ 5% بالفائدة المركبة تعطي حوالي 1,629 جنيه بعد 10 سنوات وحوالي 2,653 جنيه بعد 20 سنة. كم نمت في العشر الأولى والعشر التالية، وأيهما أكبر؟",a:"السنوات العشر الأولى حوالي 629 جنيهًا، العشر التالية حوالي 1,024 جنيهًا؛ العشر التالية أكبر"},{q:"المال ينمو 4% في السنة. باستخدام قاعدة 72، كم سنة حتى يتضاعف؟",a:"حوالي 18 سنة"},{q:"أي مما يلي سينتج عنه أكبر مقدار نهائي عند إدارته بـ 5% بالفائدة المركبة؟",a:"إدارة 1,000 جنيه لمدة 40 سنة بالفائدة المركبة"}]},{title:"درس: التحضير لمخاطر المستقبل",items:[{q:'أي مما يلي يُحسَب "خطرًا"؟',a:"تكلفة الإصلاح الكبيرة عندما تتضرّر سقف بيتك بأمطار غزيرة"},{q:'لـ "طارئ تحتاج فيه فجأة لمبلغ كبير، لا يضرب الجميع دفعة واحدة، لكن يمكن أن يحدث لأي شخص"، أي طريقة تفكير أكثر منطقية؟',a:"أشخاص كثيرون يضع كل منهم قليلًا من المال، ومن يحدث له طارئ يستلم من المال المُجمَّع"},{q:"أي منها يُحسَب تأمينًا عامًا (تأمينًا اجتماعيًا)؟",a:"تأمين يُخصَم شهريًا من راتب موظف شركة، يدفع تعويضًا عند زيارة أو الإقامة في مستشفى لمرض أو إصابة"},{q:'أي توليفة تصنّف بشكل صحيح إلى الطبقات الثلاث "المساعدة الذاتية، والتعاضد، والمساعدة العامة"؟',a:"المساعدة الذاتية: صندوق طوارئ مُدَّخَر في حسابك الخاص / التعاضد: تأمين حياة خاص يضع فيه النظراء أموالًا / المساعدة العامة: تأمين صحي عام مخصوم من الراتب"},{q:"ما الفرق الأساسي بين التكافل والتأمين الخاص العادي؟",a:"التكافل يُدار كصندوق مشترك للجميع، بينما مع التأمين الخاص المال المُجمَّع يصبح ربح الشركة"},{q:"كيف تحضّر للمصروفات الصغيرة المتكررة (تعطّل جهاز) وللمصروفات الكبيرة النادرة (إقامة طويلة في المستشفى)؟",a:"حضّر للمصروفات الصغيرة بالمدخرات، والكبيرة بالتأمين. المخاطر الكبيرة كالإصابة أو الحادث أو الكارثة يمكن تشاركها مع أشخاص كثيرين لتقليل عبء الشخص الواحد"}]},{title:"اختبار المستوى العاشر",items:[{q:"أي مما يلي يسرد بشكل صحيح الأغراض الثلاثة للمدخرات؟",a:"صندوق الطوارئ، أموال الأهداف، أموال التقاعد"},{q:"أي مصدر مالي تستخدمه عندما يتعطّل جهاز بشكل مفاجئ ويحتاج تكلفة إصلاح عاجلة؟",a:"صندوق الطوارئ"},{q:"أي مما يلي يفسّر بأفضل شكل الفرق بين الادّخار والاستثمار؟",a:"الادّخار لا يخسر أصل المبلغ أساسًا، بينما الاستثمار قد ينمو كثيرًا في مقابل خطر التقلّص"},{q:"ماذا تُسمى الآلية التي يُطبَّق فيها سعر محدَّد فقط على أصل المبلغ ويكون المقدار الذي ينمو نفسه كل سنة؟",a:"الفائدة الثابتة"},{q:"عند إدارة 1,000 جنيه بـ 5% في السنة، باستخدام قاعدة 72، أي مما يلي أقرب لعدد السنوات حتى يتضاعف إلى 2,000 جنيه بالفائدة المركبة؟",a:"حوالي 14 سنة"},{q:"أي مما يلي يفسّر بأفضل شكل الفرق بين الفائدة الثابتة والمركبة؟",a:"لنمو الفائدة، الفائدة الثابتة لا تضمّه لأصل المبلغ بينما الفائدة المركبة تدمجه فيه، فيتوسّع الفرق مع مرور الوقت"},{q:"أي مما يلي يفسّر بأفضل شكل الآلية الأساسية للتأمين؟",a:"آلية يضع فيها أشخاص كثيرون قسط تأمين صغيرًا كل واحد، ويُدفَع تعويض لمن ضربه سوء الحظ"},{q:"أي توليفة تُحسَب مساعدة عامة؟ 1 صندوق طوارئ، 2 تأمين صحي مموَّل بأقساط تُخصَم من الراتب، 3 تأمين حياة، 4 معاش تديره الدولة، 5 تأمين سيارات طوعي، 6 مدخرات للشيخوخة",a:"2 و 4"},{q:"أي مما يلي يصف بأفضل شكل خاصية التكافل؟",a:"آلية دعم متبادل من التمويل الإسلامي، يضع فيها المشاركون مالًا في صندوق مشترك ويديرونه كملكية للجميع"},{q:"أي مما يلي يطابق بأفضل شكل موقفًا مع التحضير الفعّال له؟",a:"لمرض خطير بتكاليف علاج كبيرة لا يستطيع شخص واحد حملها، التعاضد الذي يتشارك بين كثيرين فعّال"}]}]},{id:11,title:"المستوى الحادي عشر — العقود والشروط والمسؤولية المالية",tag:"العقود والائتمان وحماية المستهلك",sections:[{title:"درس: ما هو العقد؟",items:[{q:'في متجر إلكتروني، اخترت سلعة وضغطت "تأكيد الطلب". وصل ردّ "تم تأكيد الطلب"، دفعت، وبعد أيام وصلت السلعة. في أي نقطة تكوّن العقد؟',a:'عندما ردّ المتجر "تم تأكيد الطلب"'},{q:'أي مما يلي صحيح بخصوص تكوّن العقد ووثائق العقد؟ 1 حتى بدون وثيقة يتكوّن عقد إذا وعدتما بصوت عالٍ، 2 حتى ردّ خفيف بـ "موافق" يمكن أن يُؤخَذ كقبول، 3 إلا إذا وقّعت وثيقة لا تحتاج لحفظ الوعد، 4 تُصنَع وثيقة العقد لتخفيض سعر السلعة',a:"1 و 2"},{q:'أي تبادل يُحسَب "عقدًا" قانونيًا؟',a:'قول "هذه، من فضلك" عند الصندوق، وردّ الموظف "بكل سرور"'},{q:"مشترٍ استلم سلعًا في متجر ثم مضى دون دفع السعر. ماذا يحدث؟",a:"لا يزال للبائع حق استلام السعر (مطالبة)، فيمكن مطالبة المشتري بالدفع"},{q:"تنظر في سلعة غالية غير متأكد من شرائها في متجر إلكتروني. ما أفضل طريقة للتفكير قبل تأكيد الطلب؟",a:"بما أن التأكيد يكوّن عقدًا يصعب إلغاؤه، قرّر بعد التحقّق من قواعد الإلغاء بجانب ما إذا كنت تحتاجها، والسعر، والمحتويات"}]},{title:"درس: كيف يعمل الائتمان",items:[{q:'تخيّل نفسك بعد التسوّق ببطاقة ائتمان. ما التوليفة الصحيحة لوضع "السلعة" و"السعر"؟',a:"[السلعة] استُلِمَت بالفعل / [السعر] لم يُدفَع بعد"},{q:'التسوّق ببطاقة ائتمان وعد بـ "دفع المال لاحقًا". لماذا لا يحتاج المتجر للقلق "ماذا لو لم أُدفَع لاحقًا"؟',a:"لأن شركة الائتمان تدفع للمتجر السعر أولًا، نيابة عن المستهلك"},{q:"لم تستطع جمع المال لدفعه دفعة واحدة، فقرّرت الشراء بالدفع بالتقسيط. لجعل الإجمالي النهائي بأصغر قدر ممكن، أي طريقة دفع جيدة؟",a:"اجعل الدفعة الشهرية بأكبر قدر ممكن ضمن نطاق لا يضغط على حياتك، وادفع على مدى قصير"},{q:"أي منها يحتوي على كل الأشياء التي تؤثر على درجة الائتمان؟ 1 الاستمرار في الدفع بشكل صحيح في مواعيد الاستحقاق، 2 عمر الشخص أو مظهره، 3 الفشل في حفظ وعود السداد مع تأخّر الدفعات مرارًا، 4 إنهاء سداد المال المُقترَض كما خُطّط له",a:"1 و 3 و 4"},{q:"عند شراء حاسوب بالدفع بالتقسيط، أي مما يلي هو الحكم المناسب؟",a:"بما أن العقد لا يمكن إلغاؤه بسهولة في المنتصف، فكّر بعناية فيما إذا كنت تستطيع الاستمرار في الدفع حتى النهاية"}]},{title:"درس: المسؤولية عن الديون وحقوق المستهلك",items:[{q:"للقصص المشبوهة عدة خصائص. أي مما يلي يطابق بأفضل شكل خاصية مع كيفية التعامل معها؟",a:'بالشكّ في قصة استثمار "ستكسب مالًا بالتأكيد" كخاصية احتيال، ترفض بحزم في الموقع وتستشير خطًا مساعدًا متخصّصًا'},{q:"أي مما يلي شرح صحيح لآليات حماية المستهلكين؟ 1 آلية إلغاء دون شروط ضمن فترة محدَّدة، 2 المستهلكون في وضع غير مُفضَّل من ناحية المعلومات، 3 تستطيع استشارة خط مساعد عام، 4 لا حاجة للتحقّق من المحتويات بنفسك",a:"1 و 2 و 3"},{q:'غير متأكد فيما إذا كنت تقترض مالًا وتحضر مدرسة لكسب شهادة مفيدة لوظيفة مستقبلية. ما الطريقة الأحكم للتعامل مع "الدين"؟',a:"بعد وضع خطة سداد قوية، اقترض كاستثمار في المستقبل"},{q:"عندما يستمر شخص يصارع السداد في (1) للسداد مرارًا، يتضخّم الدين ويصبح غير قابل للسداد. يُسمى هذا (2). ما التوليفة الصحيحة؟",a:"1 الاقتراض من جديد من مكان آخر / 2 دوامة الدين"},{q:'تعاقدت لشراء منتج مشبوه وقلق. تفكّر "سأنتظر أيامًا قليلة". ما أكبر سبب لعدم التأجيل؟',a:"لأن هناك آلية بفترة محدَّدة لإلغاء العقد، وكلما انتظرت أكثر، يمرّ ذلك الموعد النهائي ويصبح غير قابل للاستخدام"}]},{title:"اختبار المستوى الحادي عشر",items:[{q:'في أي مشهد يتكوّن "عقد" ملزم قانونيًا؟',a:"اختيار خبز في متجر وشراؤه بدفع المال"},{q:"يتكوّن عقد بيع عندما يتلاقى أي من التالي؟",a:'إيجاب المشتري "سأشتري" وقبول البائع "سنبيع"'},{q:"عندما تكون على وشك الدخول في عقد، أي تصرّف يجب أن تُقدّره أكثر؟",a:"تعاقد بعد التحقّق جيدًا من المحتويات والشروط وطريقة الدفع"},{q:'أي نوع من الوعد هو "الائتمان" عبر بطاقة ائتمان؟',a:"وعد بتأخير الدفع مقابل الحصول على السلعة أولًا"},{q:"عند شراء سلعة ببطاقة ائتمان، من يقدّم السعر للمتجر أولًا؟",a:"شركة الائتمان التي تأتي بين المستهلك والمتجر"},{q:"عند شراء سلعة من خلال آلية ائتمان البيع، إذا أردت جعل المبلغ بأصغر قدر ممكن، أي مما يلي مناسب؟",a:"ادفع كل المبلغ دفعة واحدة"},{q:"أي مما يلي شرح صحيح لدرجة الائتمان؟ 1 تُصنَع من سجلات سابقة لاستخدام بطاقة الائتمان، 2 كلما زاد المال المُودَع ارتفعت درجتك تلقائيًا، 3 حفظ وعود السداد يؤثر على استخدامك للخدمات في المستقبل، 4 كلما لم يستخدم شخص بطاقة ائتمان أبدًا يبقى في أفضل حالة",a:"1 و 3"},{q:"ماذا يحدث عندما يقترض شخص يصارع السداد مرارًا من مصدر آخر لسداد دفعاته؟",a:"يتضخّم الدين واحدًا تلو الآخر، ويقع في حلقة مفرغة يصبح فيها غير قابل للسداد"},{q:"بعد التعاقد من خلال بيع من الباب للباب، تريد الإلغاء. أي تصرّفات مناسبة؟ 1 التحقّق مبكرًا من آلية الإلغاء، 2 لا تحمله بمفردك واستشر شخصًا موثوقًا، 3 اتصل بالشركة مرارًا وتفاوض، 4 أرسل السلعة مُبلّغًا نيّتك في الإلغاء",a:"1 و 2"},{q:'وصل بريد إلكتروني متنكّرًا كبنك، يقول "أدخل رقمك السري". ما التصرّف الأحكم؟',a:"لا تُدخِل الرقم السري؛ بدلًا من الرد على البريد مباشرة، تحقق من الموقع الرسمي للبنك أو نقطة الاتصال الرسمية للتأكد من صحة الرسالة"}]}]}];var ef=[{id:12,title:"المستوى الثاني عشر — محاكاة رحلة الحياة - النجاة المالية",tag:"محاكاة • 50 سؤالًا",sections:[{title:"محاكاة رحلة الحياة — 50 سؤالًا",items:[{q:"عمرك 22 سنة، في سنتك الأولى كبالغ عامل. بدأت العيش بمفردك ووصل راتبك الأول. قبل أن تبدأ الإنفاق، ما أكثر خطوة يمكن الاعتماد عليها؟",a:"قرّر مسبقًا كيفية تخصيص مالك للإيجار، والطعام، والمدخرات، وما شابه"},{q:"استراحة الغداء، الليلة عشاء مدفوع ستتحضره، فسيكون الإنفاق أعلى من المعتاد. متردّد بشأن الغداء: الأكل بالخارج أو الوجبة من البيت. ما الحكم الأحكم؟",a:"للتحضير للإنفاق المؤكَّد في المساء، جلب وجبة ظهرًا لتقليل الإنفاق مسبقًا"},{q:'سماعات بـ 1,000 جنيه. شراؤها يعني أنك لن تستطيع وضع أي شيء في المدخرات هذا الشهر. ما "تكلفة الفرصة البديلة"؟',a:"مدخرات هذا الشهر التي كنت تستطيع تحقيقها لو لم تشترِ السماعات"},{q:'تقسّم ما تشتريه إلى "احتياجات" و"رغبات": 1 أرز، 2 وجبات خفيفة، 3 جوارب للتنقّل، 4 مجلة مفضَّلة. ما التوليفة؟',a:"الاحتياجات = 1 و 3 / الرغبات = 2 و 4"},{q:"المال الداخل راتبك 8,000 جنيه، والمال الخارج كما في سجل الدخل والنفقات. ما وصف رصيد الشهر؟",a:"-1,000 جنيه، عجز"},{q:'بتقسيم 1 الإيجار، 2 فاتورتا الكهرباء والمياه، 3 رسوم شهرية لخدمة بث فيديو، 4 تكلفة معدات هواية إلى "إنفاق أساسي" و"إنفاق اختياري"، أي توليفة؟',a:"أساسي = 1 و 2 / اختياري = 3 و 4"},{q:"بتخصيص راتب صافٍ 8,000 جنيه بقاعدة 50/30/20، كم لكل جزء؟",a:"الاحتياجات: 4,000 جنيه / الرغبات: 2,400 جنيه / مدخرات المستقبل: 1,600 جنيه"},{q:"أي توليفة تختار كل الطرق المناسبة للادّخار بشكل موثوق كل شهر؟ 1 ضع جانبًا مبلغًا ثابتًا بمجرد استلام راتبك، 2 بعد إدارة الشهر ضع ما تبقى، 3 رتّب نقل مبلغ ثابت تلقائيًا، 4 ضع مالًا دفعة واحدة فقط عندما تحصل على دخل إضافي",a:"1 و 3"},{q:"عمرك 24 سنة، تسمع أن صديقًا شرى حذاء جلديًا جديدًا، وأنت أيضًا تريده فجأة. ما أحكم تصرّف؟",a:"اهدأ لحظة، وقرر بعد التحقّق مما إذا كان يناسب ميزانية هذا الشهر ومما إذا كنت تحتاجه فعليًا"},{q:'وصلت رسالة: "أودع في هذا التطبيق وسيزداد مالك بالتأكيد. عرض خاص لليوم فقط". ما تصرّفك؟',a:'احكم أن شعارات "سيزداد بالتأكيد" و"لليوم فقط" احتيال محتمل جدًا، وتجاهلها'},{q:'طلبت منتجًا في متجر إلكتروني. في نفس اليوم، قدّمت وعدًا شفهيًا لصديق "سأدعوك لوجبة". أي منهما محمي كـ "عقد"؟',a:"طلب المتجر الإلكتروني. لأن حقوقًا وواجبات قانونية متبادلة تنشأ، دفع السعر واستلام المنتج"},{q:'التسوّق الإلكتروني بالترتيب: 1 وضع المنتج في السلة، 2 مراجعة التفاصيل والضغط على "تأكيد الطلب"، 3 وصول ردّ "تم استلام الطلب"، 4 وصول المنتج. في أي نقطة يتكوّن عقد البيع؟',a:"3"},{q:"عندما يتكوّن عقد طلب، ينشأ حق وواجب للمشتري. ما شرح الحق والواجب؟",a:"الحق هو استلام المنتج، الواجب هو دفع السعر"},{q:"اشتريت دراجة مستعملة من أحد معارفك دون عقد ورقي. ما الغرض الأساسي من ترك وثيقة عقد؟",a:'لأنها توثّق مضمون الوعد المتبادل بشكل واضح، مانعة نزاعات "من قال ماذا" لاحقًا'},{q:'أي موقف يُعد "معاملة ائتمانية"؟',a:"في مكتبة، استلم مجلة أولًا وادفع لاحقًا دفعة واحدة عبر فاتورة تُرسَل في نهاية الشهر"},{q:"ببطاقة ائتمان، اشتريت ملابس بـ 5,000 جنيه. يستلم المتجر السعر في نفس اليوم، لكنك تدفع الشهر القادم. من يدفع للمتجر فورًا، ولمن تدفع لاحقًا؟",a:"شركة الائتمان تدفع للمتجر فورًا (شركة الائتمان → المتجر)؛ لمن تدفع لاحقًا هو شركة الائتمان (أنت → شركة الائتمان)"},{q:'على وشك شراء جهاز طبخ غالٍ. الضغط على "تأكيد الطلب" يكوّن عقد بيع. ما أفضل نهج عند التأكيد؟',a:"تحقّق مما إذا كان الإجمالي المُفوتَر، وطريقة الدفع، وشروط المنتج، تناسب ميزانيتك ورغباتك"},{q:"تناقش مع شريكك المال الذي ستحتاجانه في المستقبل. تقرران تنظيم أهدافكما بحسب الجدول الزمني. ما أفضل فائدة؟",a:"تستطيع أن ترى متى وكم تحتاج، وتقدّر المقدار الشهري للوضع جانبًا"},{q:"صنّفا العناصر إلى أهداف قصيرة ومتوسطة وطويلة المدى: 1 سيارة بعد 4 سنوات، 2 حفل زفاف بعد نصف سنة، 3 دفعة أولى للسكن نحو 12 سنة، 4 تكلفة انتقال في 3 أشهر، 5 تكاليف معيشة يومية",a:"1 متوسط، 2 قصير، 3 طويل، 4 قصير، 5 غير منطبق"},{q:"بعد الزواج، لديكما أهداف: زفاف بعد نصف سنة، سيارة بعد 4 سنوات، دفعة سكن بعد 12 سنة. المبلغ للادخار محدود. ما أفضل طريقة؟",a:"خصّص أكثر لتكلفة الزفاف القريبة الموعد، وللأهداف الأخرى أيضًا، قرر الأولوية بالحساب العكسي من الأشهر المتبقية"},{q:'بدلا من التفكير "لندّخر"، من المهم أن تقررا كـ "ادّخر (1) (2)". أي توليفة تناسب 1 و 2؟',a:"1 بحلول 3 سنوات من الآن، 2 300,000 جنيه - كما وردت في الملف"},{q:"لنحضّر مالًا للطوارئ حتى تستطيعا الاستمرار حتى لو توقّف دخلكما. ما القاعدة المناسبة؟",a:"ثلاثة إلى ستة أشهر من تكاليف المعيشة الشهرية"},{q:"تفكّر في أين تحفظ صندوق الطوارئ. أي مما يلي غير مناسب؟",a:"ضعه كله في استثمار طويل المدى لا خطط لاستخدامه الآن"},{q:"أي توليفة تطابق المدخرات: 1 مال يُدَّخَر قليلًا قليلًا من عمر مبكر للتقاعد، 2 مال بمقدار ثابت كل شهر لسيارة بعد 3 سنوات، 3 مال للتعامل الفوري مع إنفاق غير متوقَّع",a:"1 أموال تقاعد، 2 أموال أهداف، 3 صندوق طوارئ"},{q:"لتأثيث بيتكما الجديد (240,000 جنيه)، راتباكما الصافيان 20,000 جنيه شهريًا. كيف تحدد المبلغ المناسب للادخار دون ضغط؟",a:"ضعا 4,000 جنيه جانبًا كل شهر، بدليل 20% من الراتب الصافي"},{q:"ما الفرق الأساسي بين الادّخار والاستثمار؟",a:"الادّخار لا يتقلّص أساسًا؛ الاستثمار ينمو في مقابل خطر التقلّص"},{q:'كل وصف يحتوي كلمة "خطر". ما معنى "الخطر" في الاستثمار؟',a:"النتيجة غير مؤكَّدة، وتستلم أثرًا يطابق النتيجة التي تحدث"},{q:"جدول يُظهر كيف ينمو 3,000 جنيه عند إدارته بـ 4% بالفائدة الثابتة. ما المبالغ في الفراغين: 1 بعد 10 سنوات، 2 بعد 20 سنة؟",a:"1: 4,200، 2: 5,400"},{q:"جدول يُظهر كيف ينمو 3,000 جنيه بـ 4% بالفائدة المركبة. ما المبالغ: 1 بعد سنة واحدة، 2 بعد سنتين؟",a:"1: 3,120، 2: 3,245"},{q:'"قاعدة 72". عندما يعطي استثمار عائدًا 6% سنويًا، كم سنة حتى يتضاعف المال؟',a:"حوالي 12 سنة"},{q:'عند الإدارة بالفائدة المركبة، باستخدام "قاعدة 72"، أيها يحقق أكبر مقدار من النمو؟ (نسبة النمو 5%)',a:"إدارة 1,000 جنيه لمدة 30 سنة"},{q:"نحو حلم فتح محلك الخاص، تريد تحضير مال بدء تشغيل كبير. ما أفضل طريقة؟",a:"احتفظ بتكاليف المعيشة وصندوق الطوارئ، وضع الأموال الفائضة جانبًا بشكل منهجي"},{q:'عمرك 35 سنة، وطفل انضم للأسرة. ما المقصود بـ "المخاطر" التي تحتاج إلى الاستعداد لها؟',a:"متى واحتمال حدوثه غير معروفين، لكن بمجرد حدوثه له أثر كبير على الحياة"},{q:"مع التأمين، قسط صغير يوفّر تحضيرًا كبيرًا للطوارئ. لماذا يصح هذا؟",a:"لأنه إذا وضع أشخاص كثيرون قليلًا كل واحد، يمكن تغطية تكلفة حدث لا يحدث للجميع دفعة واحدة"},{q:'تأمين تعاضدي: 1,000 مشترك، كل واحد 600 جنيه سنويًا، إجمالي 600,000 جنيه. 10 أشخاص استلموا 50,000 جنيه كل واحد (500,000 إجمالًا)، والـ 100,000 المتبقية تكاليف تشغيل. من الـ 600 جنيه، ما تقسيم "الجزء المُستخدَم لإغاثة شخص" و"الجزء لتكاليف التشغيل"؟',a:"الإغاثة: 500 جنيه / التكاليف: 100 جنيه"},{q:"بجانب التأمين الذي تختاره بنفسك، هناك تأمين تديره الدولة للمرض والإصابة والشيخوخة والبطالة. أي مما يلي يُعد تأمينًا عامًا؟",a:"تأمين اجتماعي يلتحق به العاملون وغيرهم، يدعم الرعاية الطبية والمعاشات والبطالة"},{q:"أي توليفة تطابق: 1 صندوق طوارئ، 2 تأمين خاص، 3 ضمان اجتماعي؟",a:"1 مساعدة ذاتية، 2 تعاضد، 3 مساعدة عامة"},{q:"ما خاصية التكافل؟",a:"الدفعات تأتي من تعاضد المشتركين، والمتبقي يعود للمشتركين"},{q:'للمصروفات الصغيرة اليومية والمصروفات الكبيرة النادرة، أيهما منطقي للتحضير به، "الادّخار" أو "التأمين"؟',a:"المصروفات الصغيرة: الادّخار / المصروفات الكبيرة: التأمين"},{q:"ما أقل طريقة تفكير مناسبة للتحضير للمخاطر؟",a:"بما أن تأمينًا أكثر يعني أمانًا أكثر، زد التأمين حتى إذا كانت الميزانية ضيقة"},{q:"تفكّر في كيفية دفع المعدات (السعر المُعلَن 30,000 جنيه). لديك مساحة في أموالك. أي طريقة دفع أكثر منطقية؟ (جدول بثلاث طرق)",a:"الدفع دفعة واحدة. لأنه لا مبلغ إضافي يُطبَّق ولديك مساحة في الأموال في اليد"},{q:"بعد الفتح، تشتري المعدات. للحفاظ على النقد، تقرر الدفع ببطاقة ائتمان. لتقليل عبء رسوم البطاقة، أي طريقة دفع أنسب؟",a:"ادفع دفعة واحدة الشهر القادم، دون زيادة الرسوم الإضافية"},{q:'للتحقّق "هل هذا الشخص يدفع في الوقت المناسب"، يستخدمون "معلومات الائتمان". أكمل: "معلومات الائتمان تُصنَع بناءً على تاريخ (1) الماضي وهي سجل تُديره (2)".',a:"1 الدفعات والاقتراض، 2 وكالة متخصّصة"},{q:"تدفع لاحقًا مقابل معدات بـ 20,000 جنيه. عندما تُطبَّق رسوم 10% لاستخدام المال لفترة إضافية، ما المقدار الإجمالي؟",a:"22,000 جنيه"},{q:"على وشك شراء معدات بالدفع بالتقسيط. ما أنسب عقلية قبل التقديم؟",a:"اعتبر تغيّرات الدخل والمقدار الإجمالي شاملًا المُضاف، أكّد أنك تستطيع الدفع دون ضغط، وقدّم"},{q:'يقترب منك عرض: "اكسب كبيرًا بشكل موثوق بلا رأس مال". أي توليفة تجمع الخصائص المشتركة للدعوات المشبوهة؟ 1 التأكيد "ستكسب مالًا بالتأكيد"، 2 جعلك تؤكّد محتويات العقد كتابيًا، 3 إرباكك بـ "الآن فقط"، "أنت فقط"، 4 إغراؤك بأن المال سيأتي إذا أحضرت آخرين',a:"1، 3، 4"},{q:'ما الأقل مناسبة كطريقة تفكير في "الدين الجيد والدين السيء"؟',a:"إذا نقص مال السداد، اقترض من جديد من شركة أخرى لملء فجوة السداد الحالية"},{q:'أخبار عن شريك أفادت بـ "أزمة تخلّف عن السداد (عدم أداء الواجب)". ما الحالة؟',a:"حالة عدم القدرة على سداد مال وعد بسداده (دين أو سعر) كما وُعد"},{q:"محلك كسب عملاء دائمين، لكن تراكمت دفعات استثمار المعدات وأصبحت السيولة ضيقة. ما الردّ الأنسب؟",a:"قبل الوصول لحائط مسدود، تواصل مع المُقرِض أو خط مساعد وناقش مراجعة كيفية السداد"},{q:"بلغت 50 سنة. محلك الأول يدخل ربح ثابت 10,000 جنيه كل شهر. بعد 5 سنوات تتوجّه لفتح محل ثانٍ بمبلغ هدف 180,000 جنيه. ما أدنى نسبة من ربحك الشهري تحتاج إلى ادخارها أولًا؟",a:"30% من الربح الشهري"}]}]},{id:13,title:"المستوى الثالث عشر — ماهي ريادة الأعمال",tag:"العقلية والفكرة والمخاطر",sections:[{title:"درس: العقلية الريادية",items:[{q:'من يمكن أن يُقال عنه إنه "يفيض بريادة الأعمال" أكثر من غيره، حتى دون أن يكون قد بدأ محله بعد؟',a:'موظف في محل قرطاسية، لاحظ أن الصندوق يزدحم في بداية الفصل الدراسي، فخطّط بنفسه "حزمة بداية الفصل الجديد" التي تجمع الأدوات اللازمة، وحاول بيعها'},{q:'أي نموذج يتناسب أكثر مع "ريادة الأعمال الاجتماعية"؟',a:"تقديم خدمات تعليمية منخفضة التكلفة لمن يفتقرون إلى فرص التعلّم مثل القراءة والكتابة والحساب، وتأمين إيراد تجاري يجعل النشاط مستمرًا ذاتيًا، مع التقدّم في حل مشكلة التفاوت التعليمي"},{q:"أيها يُحسب ابتكارًا؟ 1 إدخال آلية استعارة كتب بمسح الرمز الشريطي، 2 الحفاظ على إجراءات الطبخ دون تغيير، 3 إنشاء آلية توصيل خضروات من المزارع مباشرة، 4 تطوير دواء جديد في مختبر",a:"1 و 3"},{q:'أي فعل يتناسب أكثر مع "المخاطرة المحسوبة"؟',a:"حساب إمكانية الدخول في العجز مسبقًا، ووضع خطة للحد من الخسائر، وتجربة منتج جديد"},{q:'شخص لاحظ أن كثيرًا من المسافرين يعانون من حمل حقائب ثقيلة أعلى الدرج، فقال: "لكان من الجيد لو وُجدت آلية جديدة". أي خطوة تتوافق أكثر مع ريادة الأعمال؟',a:'دعوة بعض الأشخاص القريبين، والمساعدة فعليًا في الحمل باستخدام عربات وما شابه، والتجربة على نطاق صغير مع التحقق من "أي نوع من المساعدة سيكون مُقدّرًا بالفعل"'}]},{title:"درس: من الفكرة إلى المشروع التجاري",items:[{q:"شخص يريد بدء خدمة استعارة وإقراض أدوات عبر تطبيق. أي مما يلي يعبّر عن الرغبة كأقوى عرض قيمة؟",a:"خدمة يمكن فيها لمن لا يريدون أن تشغل الأدوات التي يستخدمونها فقط بضع مرات في السنة مساحة تخزين، أن يستعيروها من مكان قريب عبر هاتفهم فورًا، دون الشراء"},{q:"شخص فكّر في فكرة خدمة جديدة. قبل استثمار المال والوقت، يريد التأكد من وجود أشخاص يريدونها. ما الأكثر ملاءمة لدراسة السوق؟",a:"مقابلة أشخاص يبدو أنهم منزعجون فعلًا بشكل مباشر، والتأكد بالتفصيل من تجاربهم وسلوكهم الفعلي السابق"},{q:"أي جهد يتناسب أكثر مع فكرة المنتج الأولي القابل للتطبيق (MVP)؟",a:"شخص يريد بيع أغطية الهاتف عبر الإنترنت، بدلًا من طلب كمية كبيرة دفعة واحدة، يصنع بيديه واحدًا فقط أولًا، ويعرضه في محله الإلكتروني، ويراقب إن كان هناك من يشتريه فعلًا"},{q:"عند إطلاق خدمة جديدة، أي ترتيب له أقل خطر ويتيح المضي قدمًا بثبات؟",a:"الانتباه إلى المشكلة ← عرض القيمة ← دراسة السوق ← اختبار صغير بمنتج أولي قابل للتطبيق"},{q:"شخص فكّر في خدمة تربط الطعام الذي صنعه محل شهير وتبقى منه، بشباب يريدون تناوله بسعر رخيص. ما الطريقة الأكثر ملاءمة للتأكد كمنتج أولي قابل للتطبيق؟",a:"ربط عدد قليل من المحلات القريبة وعدد قليل من الشباب الذين يريدون الأكل، فقط بتبادل الرسائل، ومراقبة الرد"}]},{title:"درس: المخاطر والتأثير الاجتماعي",items:[{q:"أيها يتناسب مع أي من المخاطر الثلاثة (التمويل، السوق، المنافسة)؟ 1 إنفاق مال كثير على ديكور صالون ونفاد المال قبل الافتتاح، 2 محل زهور مشابه افتُتح قريبًا وذهب العملاء إليه، 3 بيع إكسسوارات يدوية لكن عددًا أقل اشترى",a:"1 تمويل، 2 منافسة، 3 سوق"},{q:'شخص يحاول تطوير عصير صحي وإطلاق محل إلكتروني. كـ "كيفية مواجهة الخطر"، أي فعل أكثر ملاءمة؟',a:"صنع كمية صغيرة أولًا وبيع مجموعة محدودة، ومراقبة ردود من اشترى، والمضي قدمًا تدريجيًا"},{q:'بلدة تدعم تحديات رواد الأعمال من منظور "المنظومة". ما التفسير الصحيح؟',a:"أشخاص ومنظمات مختلفة يرتبطون ببعضهم، وهناك بيئة تخلق قيمة جديدة في البلدة كلها"},{q:'عندما ينطلق مشروع تجاري، كـ "الأهمية الاجتماعية"، أي تفسير أكثر أساسية؟',a:'حل مشكلات العالم بأفكار جديدة، وخلق "التوظيف" و"تداول المال" في المنطقة'},{q:"شخص اختبر أولًا بشكل صغير وجمع ردود من اشتروا. بناءً على فكرة المنظومة، كالفعل التالي، أي مما يلي أكثر ملاءمة؟",a:"زيارة كبار المنطقة ومكاتب الاستشارة الحكومية، والتواصل مع النصيحة والدعم القادم (المال، الأماكن)"}]},{title:"اختبار المستوى الثالث عشر",items:[{q:"أي مما يلي يفسّر ريادة الأعمال بأفضل شكل؟",a:"ليس فعل تأسيس الشركة بذاته، بل عقلية إيجاد الحلول والتحرك بنفسك، في محاولة لخلق قيمة جديدة"},{q:"شركة أُطلقت لنشر خدمة مبتكرة لم تُشاهَد من قبل، صغيرة وفي عجز، لكنها تعطي الأولوية للسرعة على التعافي الفوري للربح، مستحوذة على حصة سوقية بشكل انفجاري. أي شكل يتناسب؟",a:"نوع الشركة الناشئة: بتقنية جديدة وأفكار فريدة كأسلحة، تهدف إلى التوسع السوقي الانفجاري والنمو السريع في وقت قصير من خلال تمويل خارجي"},{q:"أي مما يلي هو التفسير الأفضل للابتكار؟",a:"خلق ليس فقط منتجات جديدة بل طرقًا وآليات جديدة أيضًا، صانعًا قيمة لم تكن موجودة من قبل"},{q:"شخص عند بدء مشروع جديد، تحدّى الأمر بعد توقّع إمكانية عدم نجاحه وتحديد نطاق يمكن التعافي منه. أي مصطلح يصف النهج؟",a:"المخاطرة المحسوبة"},{q:'عند تجميع "عرض القيمة"، أي مما يلي هو المنظور الأهم؟',a:'جعل "لمن، وما المشكلة الموجودة، وبأي قوة فريدة تحلّها" متلائمة بوضوح'},{q:"بعد التفكير في فكرة، للتحقيق فيما إذا كانت مطلوبة فعلًا، أي فعل هو دراسة السوق الأكثر ملاءمة؟",a:'وضع فرضية عن "من ينزعج من ماذا"، والذهاب للتأكد مباشرة من صحتها مع أشخاص يبدو أنهم يحملون تلك المشكلة'},{q:"شخص استلم ردودًا إيجابية في دراسة السوق. للتأكد من هل سيدفع الناس مالًا فعلًا، أي مما يلي هو الخطوة القادمة؟",a:"صنع شكل أدنى مُضيَّق إلى القيمة الجوهرية فقط (منتج أولي قابل للتطبيق)، وجعل الناس يستخدمونه فعليًا، ومراقبة الرد"},{q:'أي وضع يُحسب "الخطر المالي" لبدء مشروع تجاري؟',a:"تراكمت تكلفة بدء محل كتب، ونفد المال المتوفر قبل أن يأتي الدخل"},{q:'أي مما يلي يصف بأفضل شكل ما يميل إلى الحدوث في منطقة لديها "منظومة شركات ناشئة" قوية؟',a:"تُتشارَك خبرة الكبار وحكمتهم في المنطقة كلها، فيسهل تكرار الاختبار والإصلاح، ويسهل التحدي أي عدد من المرات"},{q:'أيها يتناسب أكثر كمثال على "الأهمية الاجتماعية" لبدء مشروع تجاري؟',a:"آلية جديدة لم تكن موجودة من قبل انتشرت في العالم، وأصبحت حياة كثير من الناس أكثر راحة"}]}]},{id:14,title:"المستوى الرابع عشر — نماذج الأعمال وهياكل الإيرادات",tag:"نماذج العمل وLTV وCAC",sections:[{title:"درس: ما هو نموذج العمل؟",items:[{q:'على وشك بدء مشروع لحل مشكلة "الرغبة في تقصير الوقت في الطبخ". كطريقة تفكير عند تحديد "لمن"، أي مما يلي أكثر ملاءمة؟',a:'التحقيق في "أي نوع من الشخص يشعر بأكبر إزعاج من قلة وقت الطبخ (ذوو الدخل المزدوج، من يربّون أطفالًا، إلخ)" وتضييق الطرف الذي تريد مساعدته بشكل ملموس'},{q:'شخص يبدأ خدمة إصلاح دراجات منزلية يقول: "سأذهب لمنزل الشخص وأصلحها". ما الشيء المهم لاستمرار الخدمة الذي لم يُحدَّد؟',a:"أين وكيف تُولَّد الإيراد"},{q:"مقهى يبيع قهوة لذيذة، يأتي عملاء كثيرون، لكن بعد دفع المواد والإيجار لا يبقى ربح. ما الفكرة الأفضل لجعل المحل يستمر؟",a:"بدء خطة يمكنك فيها شرب قهوة واحدة يوميًا برسم شهري، وخطة مميزة بدفع رسم إضافي يضيف قائمة خاصة"},{q:"محل وجبات جاهزة يحاول بيع وجبات خاصة لعمال في موقع بناء في الضواحي، في متجر بمنطقة مكاتب. عند التحقق من الأسئلة الأربعة، أي تركيبة لا تتالءم؟",a:'"عمال في موقع بناء في الضواحي" و"البيع في متجر بمنطقة مكاتب"'},{q:"أي واحد لديه الأسئلة الأربعة لنموذج العمل متلائمة دون تناقض؟",a:'للأشخاص المشغولين الذين لا يستطيعون تخصيص وقت للتنظيف اليومي، بدء خدمة زيارة منزلية تنظّف المنزل لهم. بالإضافة إلى الاستخدام لمرة واحدة، تحضير "خطة شهرية منتظمة" للاستخدام المتكرر'}]},{title:"درس: نماذج العمل الشائعة",items:[{q:"مخبز يخبز ويبيع الخبز، ومحل تصليح أحذية يصلح الأحذية. كيف تُقسّم إلى نموذج الدفع لمرة واحدة ونوع الخدمة؟",a:"المخبز = نموذج الدفع لمرة واحدة، محل تصليح الأحذية = نوع الخدمة"},{q:"أيها يُحسب نموذج اشتراك؟ 1 ميكروويف يمكنك استخدامه كملكك، 2 خدمة توصيل منتظم خبز مقابل رسم شهري، 3 برنامج تحرير صور لسنة بدفع رسم سنوي، 4 خدمة نقل لحمل الأثاث عند الانتقال",a:"2 و 3"},{q:'لعبة تطبيق هاتف مجانية، ومع ذلك تُولّد الشركة المال بثبات. كتفسير لـ "كيفية توليد الربح رغم كونها مجانية"، أيها غير مناسب؟',a:'إطلاق التطبيق مجانًا تمامًا دون أي محتوى مدفوع، وتجميع كتلة من "الأشخاص الذين يريدون اللعب دون إنفاق المال". وانتشار المستخدمين بالتوصية الشفهية فقط، فتُولَّد الربح'},{q:"على وشك بدء مشروع نموذج منصة جديد. أي منظور أكثر أهمية؟",a:'جمّع كلا من "البائعين" و"المشترين" بينما تحافظ على أعدادهما متوازنة بشكل جيد، حتى لا تنحاز إلى جانب واحد فقط'},{q:'شخص يريد أن ينشر رامن لذيذًا في العالم. كميزة عند نشر المحلات بـ "نموذج الامتياز التجاري"، أي مما يلي أكثر ملاءمة؟',a:'باستعارة "اللافتة" و"وصفة الطعم" لمحل شهير ناجح بالفعل، القدرة على فتح محلات في أماكن كثيرة بمخاطر فشل أقل، دون التدريب من الصفر'}]},{title:"درس: تصميم تدفّقات الإيراد",items:[{q:'خدمة إنترنت تُحضّر "مكانًا يمكن أن يتقابل فيه من يريدون البيع ومن يريدون الشراء". وفي كل مرة تتم معاملة، تستلم جزءًا من الدفع. ما "آلية دخول المال"؟',a:"نموذج العمولة"},{q:'في كشك مشروبات، بسبب ارتفاع سعر شراء المواد، يُخطَّط لزيادة السعر. عند تحديد "السعر"، أي طريقة تفكير أكثر أهمية؟',a:'الأخذ بالاعتبار إمكانية انخفاض العملاء بسبب زيادة السعر، ودراسة التوازن بين السعر و"الكمية القابلة للبيع" وتحديده وفقًا لذلك'},{q:"مطعم صغير يريد زيادة قيمته الدائمة للعميل. أي مما يلي أكثر فعالية؟",a:'لجعل العملاء الذين أتوا مرة واحدة متابعين، صنع "بطاقة نقاط" تصبح قسيمة خصم بعد 30 زيارة'},{q:'شركة تدير خدمة إنترنت شهرية، رغم العمل الجاد لاكتساب العملاء، يستمر العجز الإجمالي في التضخّم، مما يؤدي إلى "اقتصاديات وحدة غير مستدامة". ما السبب؟',a:"اشتدّت المنافسة مع الشركات المنافسة، ونمت تكلفة اكتساب العميل. علاوة على ذلك، أصبح العملاء الذين مَلّوا من الخدمة يُلغون فورًا"},{q:"مشروعان: X آلية سهلة التوسّع لكن تكلفة الاكتساب تبقى فوق القيمة الدائمة، Y كلما زاد العملاء زاد عملك بنفسك لكن القيمة الدائمة تتجاوز تكلفة الاكتساب بثبات. أي مشروع يمكن أن ينمو بشكل مستدام؟",a:"المشروع Y: لأن اقتصاديات الشخص الواحد تعمل أولًا، فكلما زاد العملاء، وُلدت دورة غنية بشكل أكثر تأكيدًا"}]},{title:"اختبار المستوى الرابع عشر",items:[{q:'أي مما يلي هو التركيبة الأكثر دقة لـ "الأسئلة الأربعة" لتصميم نموذج العمل؟ 1 لمن تبيع، 2 أين تصنعه، 3 كيفية توصيله، 4 كيفية توليد الإيراد، 5 ماذا تبيع، 6 متى تبيع',a:"1 و 3 و 4 و 5"},{q:'"كيفية توليد الإيراد" هو سؤال لتصميم ماذا؟',a:'"الآلية لترك الربح بشكل موثوق في اليد وجعل المشروع يستمر،" متغلّبة على تكاليف كالمواد وتكاليف الإعلانات'},{q:"أي نموذج عمل لديه الأسئلة الأربعة متلائمة؟",a:'مخبز: لـ "أشخاص في الحي يتطلّعون إلى وجبتهم الصباحية"، يقدّم خبزًا مخبوزًا طازجًا في المحل كل صباح عند واجهة المتجر قبل التنقّل أو المدرسة، وصنع بطاقة نقاط للزيارات المتكررة'},{q:"تطبيق موسيقى يتيح الاستماع لأغانٍ كثيرة بلا حدود ما داموا يدفعون رسمًا كل شهر. أي نموذج عمل؟",a:"نموذج الاشتراك"},{q:"أي مما يلي هو المثال الأكثر ملاءمة لمشروع يُحسب نموذج عمل بنموذج المنصة؟",a:"تطبيق يربط أشخاصًا يريدون البيع بأشخاص يريدون الشراء، مستلمًا رسمًا لكل معاملة"},{q:"أي مما يلي يفسّر بأفضل شكل نموذج عمل فريميوم؟",a:"جعل الأساسيات مستخدَمة مجانًا، واستلام رسم للميزات الإضافية من بعض الناس"},{q:"مشروع بنموذج اشتراك، من ناحية تدفّق الإيراد، يتوافق مع أي شكل؟",a:"نموذج الإيراد المتكرر"},{q:"أي مما يلي يفسّر بأفضل شكل القيمة الدائمة للعميل (LTV)؟",a:"إجمالي الربح الذي يجلبه عميل واحد طوال استمراره في استخدام المنتج أو الخدمة"},{q:"لمشروع، LTV = 800 جنيه و CAC = 500 جنيه. كالأثر الاقتصادي لكل عميل، أي مما يلي صحيح؟",a:"زيادة قدرها 300 جنيه"},{q:"أي مما يلي يصف بأفضل شكل مشروعًا عالي قابلية التوسّع؟",a:"حتى مع زيادة العملاء، ينمو الربح بسهولة دون زيادة القوى العاملة أو العمل كثيرًا"}]}]},{id:15,title:"المستوى الخامس عشر — التكاليف والأرباح وإعادة الاستثمار",tag:"التكاليف وهوامش الربح",sections:[{title:"درس: أنواع التكاليف وإدارتها",items:[{q:"ترتيب مصروفات شاحنة طعام: 1 رسم مكان مستأجر 5,000 شهريًا، 2 تكلفة تخزين الفاكهة والشاي، 3 تكلفة الأكواب والمصّاصات، 4 أجور العاملين. أيها يميل إلى التكلفة أكثر كلما زاد عدد المُباع؟",a:"2 و 3"},{q:"محل ساندويتشات: 1 مال استئجار المحل، 2 تكلفة تخزين الخبز والخضروات، 3 تكلفة أكياس الورق، 4 رسم نظام الكاشير شهريًا. ما التكاليف الثابتة والمتغيرة؟",a:"ثابتة = 1 و 4 / متغيرة = 2 و 3"},{q:"محل ساندويتشات قرر استخدام جبن أرخص لتقليل التكاليف. بالنظر إلى تقليص التكاليف وخطر انخفاض الجودة، ما الفعل الأكثر ملاءمة؟",a:"تعويض الرضا الذي قد ينخفض من المواد الأرخص، بوسائل كتعديل مقدار أو مظهر الحشوة، أو خدمة أكثر عناية"},{q:"محل تكاليف ثابتة 6,000 جنيه شهريًا. يبيع منتجًا بـ 40 جنيهًا، تكلفة المواد 10 جنيهات. عند نقطة التعادل، كم منتجًا يُباع شهريًا؟",a:"200 منتج"},{q:"نقطة التعادل لمحل 300 منتج شهريًا. باع 320 منتجًا لكن دخل في العجز. ما السبب الأكثر احتمالًا؟",a:'بسبب أنه، لجعل كثيرين يشترون، باع كل المنتجات "بتخفيض أقل من المعتاد"'}]},{title:"درس: فهم هوامش الربح",items:[{q:"محل ساندويتشات يحاول إيجاد الربح الإجمالي من إيراد الشهر. أي مما يلي أكثر ملاءمة لطرحه أولًا؟",a:"تكلفة تخزين الخبز والخضروات المستخدمة في الساندويتشات"},{q:"شركة أثاث: الإيراد 60,000 جنيه؛ تكلفة مواد 36,000 جنيه؛ إيجار وتكلفة عمل 15,000 جنيه. ما الربح التشغيلي؟",a:"9,000 جنيه"},{q:"أي مما يلي يفسّر بشكل صحيح أنواع التكاليف المطروحة والربح الناتج؟ 1 الربح الإجمالي = الإيراد - تكلفة البضاعة، 2 الربح التشغيلي = الربح الإجمالي - المصروفات التشغيلية، 3 الربح الصافي = الربح التشغيلي - الضريبة، 4 الربح الصافي = الإيراد - الضريبة",a:"1 و 2 و 3"},{q:"المحل X: إيراد 100,000 جنيه، إجمالي التكاليف 69,*تكملة المستوى الخامس عشر*",a:"لم ترد إجابة مكتملة لهذا السؤال في النص الأصلي."},{q:"شركة طباعة حققت ربحًا هذا الشهر لكن الدفع يأتي الشهر القادم، وتحتاج دفع تكاليف مواد مقدمًا الآن. ما طريقة رؤية المال الصحيحة؟",a:"حساب المبلغ القادم الشهر القادم وتكاليف المواد المطلوبة الآن، والتفكير بحيث لا ينفد النقد المتوفر"}]},{title:"درس: إعادة استثمار الأرباح",items:[{q:"إذا استخدمت كل الربح الصافي لمحل يُدار بشكل شخصي في الصرف الشخصي، ما النتيجة السلبية الأكثر احتمالًا؟",a:"الجزء لتحسين المحل، والجزء للاستعداد للأحداث المفاجئة، يصبحان غير قابلين للاستخدام"},{q:"شركة قسّمت ربحًا صافيًا شهريًا إلى ثلاثة: 1 الاحتفاظ داخل الشركة استعدادًا لنفقات مفاجئة، 2 إعطاء جزء لحاملي الأسهم، 3 إدخال أرفف جديدة. ما التركيبة الصحيحة؟",a:"1 / الأرباح المحتجزة، 2 توزيعات الأرباح / 3 إعادة الاستثمار"},{q:"محلان X و Y بدآ بربح متقارب. X استمر في إعادة استثمار جزء من ربحه في معدات جديدة، و Y لم يُعد أي استثمار واحتفظ بكل ربحه. بعد بضع سنوات، ما التغيير الأكثر ملاءمة؟",a:"المحل X، بفضل المعدات الجديدة، يرفع سرعة عمله وجودته، ونتيجة لذلك يصبح أكثر قدرة على توليد ربح صافٍ أكثر"},{q:"محل إصلاح افتُتح للتو، ربح صغير، عدد الطلبات غير مستقر، والأدوات قديمة. ما الاستخدام الأكثر ملاءمة للربح الصافي؟",a:'تأمين نقد يمكنه تحمّل نفقات مفاجئة كـ "احتياطي (إدارة مستقرة)"، والنظر في تحسين الأدوات (إعادة استثمار) ضمن نطاق يمكن تحمّله'},{q:"المحل X مخبز زاد عملاؤه وتستمر المنتجات في نفاد المخزون، والمحل Y محل إصلاح افتُتح للتو وطلباته غير مستقرة. ما التركيبة المناسبة؟",a:"المحل X يحوّل المزيد إلى إعادة الاستثمار في معدات جديدة، والمحل Y يؤمّن احتياطيًا أكثر"}]},{title:"اختبار المستوى الخامس عشر",items:[{q:'ترتيب مصروفات محل غسيل صغير. أيها يُحسب "تكلفة متغيرة"؟',a:"تكلفة المنظّف المُشترى حسب الحاجة لغسل الملابس المُستلَمة"},{q:"محل قرطاسية إلكتروني يفكّر في التحوّل إلى صناديق أرق لتقليل تكاليف الشحن. ما العامل الأكثر ملاءمة للنظر فيه إلى جانب تقليل التكلفة؟",a:"التفكير مع النظر إلى هل يجعل ترقيق الصندوق المنتجات أكثر عرضة للتلف، مع التوازن مقابل التكلفة"},{q:'لإيجاد كمية المبيعات التي هي نقطة التعادل، ما الصحيح "لقسمة التكاليف الثابتة عليه"؟',a:"سعر البيع ناقص التكلفة المتغيرة لكل منتج"},{q:'محل دفاتر يدوية: إيراد 30,000 جنيه، تكلفة مواد 12,000 جنيه، مصروفات تشغيلية 7,000 جنيه. ما تركيبة "الربح الإجمالي" و"الربح التشغيلي"؟',a:"الربح الإجمالي: 18,000 جنيه / الربح التشغيلي: 11,000 جنيه"},{q:"مقارنة الربح التشغيلي: المتجر العام إيراد 90,000 جنيه وتكاليف 48,000 جنيه، محل السلع اليومية إيراد 55,000 جنيه وتكاليف 46,000 جنيه. ما الطريقة الأكثر ملاءمة؟",a:"رغم أن إيراد محل السلع اليومية صغير، بما أنه يحدّ من التكاليف، ربحه التشغيلي أكثر من المتجر العام"},{q:'محل إكسسوارات استلم طلبًا بالجملة، حسابيًا يخرج ربح، لكن الدفع يأتي "الشهر القادم"، وتكلفة المواد يجب دفعها "خلال هذا الأسبوع". لمنع إفلاس المحل، ما الفعل الأكثر ملاءمة؟',a:'إدارة "الربح" حسابيًا و"النقد المتوفر" القابل للتحريك الآن بشكل منفصل تمامًا'},{q:"شركة تطبيقات استخدمت جزءًا من الربح الصافي على تكاليف تطوير لميزة جديدة. ما المصطلح؟",a:"إعادة الاستثمار"},{q:"شركة تعلّم إلكترونية حوّلت جزءًا من الربح الصافي إلى تحسينات، فزادت تسجيلات الشهر القادم. ما تفسير التدفّق؟",a:"تحويل الربح الصافي إلى إعادة استثمار يزيد أسباب اختيار المستخدمين، مُنمّيًا الإيراد القادم، مؤديًا إلى ربح صافٍ أكبر"},{q:"شركة قررت عدم تقسيم جزء من الربح الصافي ولا استخدامه على تحسين المحل، بل الاحتفاظ به داخل المحل استعدادًا لنفقات مفاجئة. ماذا يُسمّى هذا المال؟",a:"الأرباح المحتجزة"},{q:"شركة توصيل: الطلبات قوية وتريد شراء دراجات جديدة، وفي الوقت نفسه هناك مخاطر كتكلفة إصلاح مفاجئة. كطريقة لتوزيع الربح الصافي، أي مما يلي مناسب؟",a:'تخصيص التوازن بين "إعادة الاستثمار" لانتهاز الفرصة و"الأرباح المحتجزة" للاستعداد للضيق، حسب وضع المحل'}]}]},{id:16,title:"المستوى السادس عشر — محاكاة رائد الأعمال - من الفكرة إلى المشروع",tag:"محاكاة • 50 سؤالًا",sections:[{title:"محاكاة رائد الأعمال — 50 سؤالًا",items:[{q:"في لقاء تبادل، من يُظهر أكثر ريادة الأعمال حتى دون أن يكون قد بدأ شركة بعد؟",a:'"بما أنني لاحظت مشكلة قريبة مني، بدأت أولًا خدمة تجريبية صغيرة (منتج أولي قابل للتطبيق) في مجموعة على وسائل التواصل الاجتماعي. الآن أصلحها بشدة بناءً على انتقادات من استخدمها"'},{q:"الأنواع الثلاثة: 1 مشروع يهدف للانتشار في العالم كله دفعة واحدة، 2 مشروع كمطعم عائلي متجذّر في المنطقة، 3 مشروع يجعل خلق أماكن عمل هدفه الأول. ما التصنيف؟",a:"1 شركة ناشئة، 2 مشروع صغير، 3 ريادة أعمال اجتماعية"},{q:'ما المعنى الأساسي لـ "خلق القيمة"؟',a:'إيجاد وحل مشكلة شخص ما أو "لكان من الجيد لو وُجد هذا"، وتوليد فائدة جديدة لم تكن موجودة من قبل'},{q:'أي تركيبة تُحسب أمثلة نجاح لـ "الابتكار"؟ 1 تغيير حجوزات التمرين إلى آلية غير مسبوقة عبر الهاتف، 2 منافسة سعرية ببيع مشروب أرخص قليلًا، 3 البحث عن مادة تزيل الأوساخ، 4 آلية مشاركة تنقّل تربط المقاعد الشاغرة عبر تطبيق',a:"1 و 4"},{q:'عرض قيمة: "بعد النادي أو التمرين، حتى دون ماء، تنظف الأحذية المُغطّاة بالطين في دقائق". ما الجمهور المستهدف والمشكلة والقوة الفريدة؟',a:"لمن = أشخاص تتغطّى أحذية كرة القدم لديهم بالطين في التمرين / المشكلة = لا يوجد مصدر ماء قريب، ولا يمكنهم تنظيفها فورًا / القوة = إزالة الأوساخ في دقائق قليلة دون ماء، حتى بين التنقّلات"},{q:'عند تطوير المشروع مع تقليل خطر الفشل، أي فعل أكثر ملاءمة كـ "مخاطرة محسوبة"؟',a:"صنع كمية صغيرة فقط أولًا، والبحث عن أشخاص يدفعون فعلًا للشراء، والتأكد من ردهم"},{q:'كـ "دراسة سوق"، أي فعل أكثر ملاءمة؟',a:"سؤال زملاء المركز في الرياضة وطالب النادي الفعليين مباشرة عن أساليب العناية المعتادة والخطوات كثيفة العمالة، والتأكد"},{q:"أي مما يلي يفسّر المنتج الأولي القابل للتطبيق بأفضل شكل؟",a:"صنع منتج أو خدمة تجريبية مُضيَّقة إلى النقطة الأهم فقط في الفكرة، وإصلاحها خلال مراقبة ردود العملاء"},{q:'رتّب الخطوات: 1 [منتج أولي] صنع كمية صغيرة والاختبار، 2 [دراسة سوق] سؤال من يتمرّنون مباشرة، 3 [عرض قيمة] تلخيص قوة "التنظيف دون ماء"، 4 [إجراءات تأسيس] تقديم الوثائق. ما الترتيب الصحيح للمضي قدمًا بثبات؟',a:"3 ← 2 ← 1"},{q:'أي من المخاطر الثلاثة تنتمي إليه: 1 إيراد ينمو لكن الدفعات تراكمت، 2 منتجات بتصميم مشابه مُتداوَلة وانطمرت منتجاته، 3 ورشة اكتمل عددها لكن المشاركين قالوا "يجب أن تكون أرخص"؟',a:"1 الخطر المالي، 2 خطر المنافسة، 3 خطر السوق"},{q:"باستخدام بيئة مركز بدء المشاريع، أي طريقة تتيح صنع النموذج الأولي بينما تترك المال بأذكى شكل؟",a:"استئجار معدات ورشة العمل المشتركة للمركز بسعر رخيص، وتجميع النموذج الأولي الأول أولًا ضمن ميزانية بضعة آلاف من الجنيهات المتوفرة فقط"},{q:'مشروع خارجي بدأ ببيع سلع عناية بحذاء كرة القدم تمامًا كفكرتك. كطريقة مواجهة "خطر المنافسة"، ما الاستراتيجية الأكثر ملاءمة؟',a:"تحسين القوة الفريدة الخاصة بسلعك أكثر - القدرة على التنظيف بسرعة دون ماء - وتقديمها للعملاء"},{q:'أي طريقة تستخدم "منظومة الشركات الناشئة" بأفضل شكل؟',a:'استخدام الشبكات المتعددة التي يربطك بها المركز - "الحكومة المحلية"، "مختبر جامعي"، "فريق رياضي إقليمي" - لتطوير المشروع'},{q:'ما التركيبة الصحيحة لـ "الأهميات الكبرى الثلاث التي يجلبها بدء المشروع التجاري للمجتمع"؟',a:"خلق أماكن عمل، الابتكار، حل مشكلات إقليمية"},{q:'مدرب قال: "فكرة إزالة الطين دون ماء هي الأفضل. لكن بهذا الحجم صعب التعامل في ملعب مُغطّى بالطين". كرائد أعمال، ما الطريقة الأكثر ملاءمة؟',a:"أخذ حتى الملاحظة القاسية كبيانات مهمة لتحسين المنتج، وسؤال المدرّب عن تفاصيل عدم رضاه، والبدء في تحضير النموذج الأولي القادم بتحسين شكل السلعة ومواصفاتها"},{q:"قبل ورشة تصميم نموذج العمل، ما أفضل طريقة لتجميع آلية مشروعك؟",a:"الاستناد إلى الملاحظات المُستلَمة فعليًا من المدرّبين، وإعادة التفكير في آلية المشروع، وترتيبها بإصلاحها مرات كثيرة خلال الاختبار الفعلي"},{q:"أي مما يلي يفسّر نموذج العمل بأفضل شكل؟",a:'الآلية الكاملة لتوليد المال التي تجيب عن الأسئلة الأربعة "لمن، وماذا، وكيفية التوصيل، وكيفية توليد الإيراد"'},{q:"رتّب الملاحظات: 1 نقطة تواصل يمكنهم فيها استلامه فعليًا، 2 أشخاص منزعجون من اتساخ حذاء كرة القدم، 3 وسيلة للاستمرار في توليد المال بالشراء بالجملة، 4 فائدة التنظيف بسرعة دون ماء. ما التركيبة الصحيحة؟",a:"1 كيفية التوصيل، 2 لمن، 3 كيفية توليد الإيراد، 4 ماذا"},{q:'زميل يقول: "لأشخاص يحبون الفن، أريد صنع بطاقات بريدية ووضعها في محلات". من بين الأسئلة الأربعة، أي عنصر لا يزال غير واضح؟',a:"كيفية توليد الإيراد: وسيلة توليد المال (الإيراد) التي تحافظ على استمرار المشروع"},{q:"مشروع يبيع لوازم يومية لأشخاص لديهم أطفال صغار لا يمكنهم الخروج للتسوق، ويأتون إلى المحل بأنفسهم. أي عنصر لا يتالءم؟",a:"كيفية التوصيل (طريقة/مسار البيع)"},{q:"رتّب الحالات: 1 بيع سلع عناية في المحلات واستلام الدفع، 2 دفع رسم شهري يجعل معدات الورشة قابلة للاستخدام، 3 تشغيل موقع مطابقة واستلام رسم بن
