سبة قليلة لكل معاملة، 4 توزيع تطبيق صور مجانًا وتقديم خطة مدفوعة. ما التركيبة؟",a:"1 نموذج الدفع لمرة واحدة، 2 نموذج الاشتراك، 3 نموذج المنصة، 4 نموذج فريميوم"},{q:'لتحويل "تطبيق خرائط مجاني" إلى آلية تستمر في توليد المال، ما التصميم الأكثر ملاءمة؟',a:"عرض إعلانات على الشاشة للحصول على دخل إعلاني من المعلنين، بينما تجعل ميزات أكثر راحة خطة شهرية مدفوعة، للكسب"},{q:"أي مما يلي يصف بأفضل شكل الامتياز التجاري؟",a:'منح حق استخدام "اسم" و"أساليب إدارة" مشروع ناجح كحزمة لآخرين، ونشره على نطاق واسع وبسرعة عبر المناطق بجودة موحّدة'},{q:'تبدأ من شكل "تقديم منظّف حذاء كرة القدم المكتمل واستلام الدفع مقابله". كنوع نموذج عمل، أي مما يلي؟',a:"نموذج الدفع لمرة واحدة، صنع وتقديم المنتجات بنفسك واستلام الدفع مقابلها"},{q:"لجعل الإيراد أكثر استقرارًا، ودمج نوع آخر على أساس أن المنظّف ينفد بعد استخدامات قليلة، ما الطريقة الأكثر تلاؤمًا؟",a:"بما أنه منتج استهلاكي، دمج شكل من التوصيل المنتظم وجعلهم يستمرون في استخدامه (إيراد متكرر / اشتراك)"},{q:"أي مما يلي يفسّر تدفّق الإيراد بأفضل شكل؟",a:"طريقة تحقيق الإيرادات - بأي شكل (الدفع لمرة واحدة، الإيراد المتكرر، العمولة، إلخ) تستلم مقابل القيمة المُقدَّمة"},{q:"رتّب: 1 بيع منتجات مصنوعة واحدة تلو الأخرى واستلام الدفع في الموقع، 2 الوساطة بين من يريدون طلب خدمة ومن يريدون تقديمها واستلام جزء من المعاملة، 3 استلام رسم محدد كل شهر. ما التركيبة؟",a:"1 نموذج الدفع لمرة واحدة، 2 نموذج العمولة، 3 نموذج الإيراد المتكرر"},{q:"بناءً على أرقام الجدول، كم ربح يبقى في كل مرة يُباع منظّف حذاء كرة قدم واحد؟",a:"80 جنيهًا"},{q:"بناءً على أرقام الجدول، ما القيمة الدائمة للعميل لكل عميل؟",a:"650 جنيهًا"},{q:"بناءً على أرقام الجدول، ما تكلفة اكتساب العميل لكل شخص؟",a:"100 جنيه"},{q:"LTV يتجاوز CAC بشدة. ما وصف الحالة الراهنة؟",a:"بما أن إجمالي الربح من شخص واحد (القيمة الدائمة) يتجاوز تكلفة جمع ذلك الواحد (تكلفة الاكتساب)، إذا أمكن الحفاظ على كفاءة الاكتساب الحالية، هناك احتمال لتراكم الربح"},{q:'أي مما يلي يفسّر بأفضل شكل "قابلية التوسّع"؟',a:"الخاصية التي، حتى مع زيادة العملاء، يمكنك التعامل معها دون زيادة العمل أو التكلفة الإضافية كثيرًا، ويرتفع هامش الربح مع توسّع الإيراد"},{q:'أي طريقة للمضي قدمًا لديها أعلى "قابلية توسّع"؟',a:"توحيد خطوات التصنيع تمامًا لبناء نظام للإنتاج الضخم دفعة واحدة، والتعامل مع طفرة طلبات مفاجئة بفعالية بنفس الطريقة"},{q:'عند تقسيم التكاليف إلى ثابتة ومتغيرة، ما تفسير "التكلفة المتغيرة"؟',a:"تكلفة يزيد أو ينخفض إجمالي مقدارها بالتناسب مع زيادة أو انخفاض كمية المبيعات"},{q:'أي تكلفة تُحسب "تكلفة ثابتة" - مقدار محدد كل شهر بغض النظر عن المبيعات؟',a:"إيجار المكان المُستأجر كمساحة عمل"},{q:'بناءً على "المقايضة" بين التكلفة والجودة، أي طريقة أكثر ملاءمة للرؤية عند تقليل تكلفة المواد؟',a:"الحكم برؤية كلا التأثيرين - أثر تقليل التكلفة والأثر على الإيراد من تغيّر الجودة أو قابلية الاستخدام"},{q:"ما الصيغة الصحيحة لإيجاد كمية المبيعات التي هي نقطة التعادل؟",a:"قسمة إجمالي التكاليف الثابتة على مقدار سعر البيع لكل منتج واحد ناقص التكلفة المتغيرة لكل منتج واحد (الربح المتبقي لكل منتج واحد)"},{q:'بناءً على بيانات الجدول، ما "كمية المبيعات عند نقطة التعادل" المطلوبة لاسترداد التكاليف الثابتة الشهرية؟',a:"200 منتج"},{q:"بناءً على نقطة التعادل (200 منتج)، هل كان الشهر الماضي وهذا الشهر ربحًا أو عجزًا؟",a:'بما أن الشهر الماضي كان فوق نقطة التعادل فهو "ربح"، وبما أن هذا الشهر كان تحتها فهو "عجز"'},{q:'ما الهدف الأساسي من تقسيم الربح إلى مراحل "الربح الإجمالي ← التشغيلي ← الصافي" بدلًا من رقم واحد؟',a:'لتحديد موقع المشكلة - "أي تكلفة هي سبب انخفاض الربح" - والقدرة على تحديد إجراءات تحسين إداري دقيقة وصحيحة'},{q:'أي مما يلي مناسب كتعريف "الربح الإجمالي"؟',a:"الربح من طرح، من الإيراد، التكاليف المُنفَقة مباشرة على تصنيع المنتج نفسه أو تخزينه، كتكاليف المواد"},{q:"بالتحقق مع الجدول، ما الربح التشغيلي لهذا الشهر؟",a:"11,000 جنيه"},{q:"باستخدام المحاكاة، ما الربح الصافي لهذا الشهر؟",a:"8,000 جنيه"},{q:'من بين المحلات A إلى C في الشكل، أي محل له أكثر "ربح تشغيلي"؟',a:"رغم أن إيراده أصغر، المحل B له أكثر ربح تشغيلي"},{q:'المشروع مربح على الورق لكن لا يوجد نقد كافٍ لشراء الدفعة القادمة. كمنظور "الربح والنقد"، أي مما يلي مناسب؟',a:"بما أن الربح في بيان الدخل والنقد المتوفر يتحركان بشكل منفصل، حتى عندما يخرج الربح، يجب التأكد من توقيت دخول وخروج النقد بشكل مستقل"},{q:'استخدام الربح المتبقي في "إدخال معدات تصنيع جديدة لصنع المنتجات أسرع وبكميات أكبر" - أي استخدام ينتمي إليه؟',a:"إعادة الاستثمار"},{q:'كتفسير لـ "الأرباح المحتجزة"، أي مما يلي مناسب؟',a:"ربح محتفَظ به في اليد بالشركة، غير مُحوَّل إلى توزيعات أرباح ولا إعادة استثمار، استعدادًا لأحداث أو مخاطر مستقبلية غير متوقعة"},{q:"عندما يُستخدَم الربح الصافي لمعدات جديدة أو تطوير سلع جديدة، أي ظاهرة أكثر احتمالًا في نمو المشروع اللاحق؟",a:"القوة الإنتاجية والبيعية المرتفعة تولّد ربحًا آخر، واستخدام ذلك الربح للاستثمار القادم يسرّع النمو"},{q:"الطلبات تضاعفت والمشروع ينمو بسرعة، مع الاستعداد لمخاطر المحل. كتخصيص للربح الصافي، ما الحكم الأكثر ملاءمة؟",a:'تحويل معظم الربح إلى "إعادة استثمار" لتقوية القدرة الإنتاجية بحيث يمكن تلبية الطلبات المتضاعفة، بينما تترك أيضًا "أرباحًا محتجزة" بتوازن للاستعداد لما هو غير متوقع'},{q:'كأهم سياسة إدارية في أساس "كيفية استخدام الربح" لنشر المشروع أكثر، أي مما يلي؟',a:"سياسة الاستمرار في إعادة استثمار الربح الصافي في النمو القادم، رفع القوة الإنتاجية وقيمة المنتج، وتوسيع دائرة حل المشكلات المُقدَّمة للمجتمع أكثر"}]}]}];var tf=[{id:17,title:"المستوى السابع عشر — ما هو الاستثمار",tag:"الاستثمار والمخاطرة والعائد",sections:[{title:"درس: التعريف الأساسي للاستثمار",items:[{q:'يُقال إن الاستثمار في الأسهم يحتاج إلى "وقت" طويل. ما تفسير السبب؟',a:"لأن المال المستثمر يُستخدم في النهاية كأموال تشغيلية للشركة أو المشروع داخل المجتمع، ويحتاج الأمر إلى وقت حتى تعود نتائج ذلك النمو (العائد)"},{q:"X يتوقع نمو شركة P على مدى 20 عامًا ويدعم مشروعًا يُثري المجتمع على المدى الطويل، و Y يشتري اليوم ويبيع غدًا مستهدفًا فرق السعر بعد إطلاق برنامج. ما تصنيف تصرفهما؟",a:"X = استثمار / Y = مضاربة"},{q:'لنفترض أن "التضخم" يحدث. ما وصف التغيير في قيمة المال أو الاستجابة؟',a:'بسبب انخفاض الكمية التي يمكنك شراءها بالمال (القوة الشرائية) عند ارتفاع الأسعار، يجب اعتماد "الاستثمار"، الذي يُنمّي الأصول بما يتماشى مع ارتفاع الأسعار، كإجراء استعداد فعّال'},{q:"شخص يريد تنمية المال بصبر على مدى 10 سنوات، ويتقبّل مخاطرة الزيادة أو الانخفاض، ولا يريد الاعتماد على الحظ. ما طريقة التعامل الأكثر توافقًا؟",a:"الاستثمار: لأنها طريقة تستثمر فيها في شركة أو مشروع يبدو أنه سينمو في المستقبل، وبالرغم من وجود ارتفاع وانخفاض في السعر خلال الفترة، يمكنك تنميته تدريجيًا على مدى فترة طويلة"},{q:'صديق يقول: "الاحتفاظ بالمال كنقد ليس له معنى، سأضع كل أموالي في طريقة يمكنها مضاعفة الأصول بشكل مؤكد في فترة قصيرة". ما الرد المناسب؟',a:'مع التعاطف مع الشعور بالأزمة بخصوص التضخم، وبما أنه لا توجد طريقة "مؤكدة في فترة قصيرة" في عالم الاستثمار، تُخبر الصديق بمخاطر النصب والمضاربة العالية الخطورة، وتحاول إقناعه بعدم وضع المبلغ كاملًا'}]},{title:"درس: المخاطرة والعائد",items:[{q:"الهدف X مدى تقلب سعري صغير جدًا، والهدف Y مدى تقلب سعري كبير جدًا. ماذا يمكن قوله؟",a:"بسبب أن الهدف Y لديه مدى تقلب سعري كبير، فإن مخاطرته كبيرة، والعائد الذي يعود منه يميل أيضًا إلى أن يكون كبيرًا"},{q:"أي مما يلي يطابق بشكل صحيح بين أنواع المخاطر الأربعة والسيناريوهات؟",a:'"مخاطر سعر الصرف": قيمة أصل تملكه بعملة أجنبية تنخفض مع تغيَّر سعر الصرف، وعند تحويله إلى نقد يقل المبلغ'},{q:"شخص سيدير أموالًا لن تُستخدم إلا بعد ثلاثة أشهر. عند اختيار هدف استثماري، ما النقطة التي يجب أن يكون حريصًا عليها؟",a:'بحيث يمكنه تحويل المال إلى نقد بشكل موثوق في الوقت المطلوب، تجنّب "مخاطر السيولة" - وهي أنه عندما يريد البيع، لا يجد مشتريًا فورًا'},{q:"ما الطريقة الأنسب لتحديد قدرتك الخاصة على تحمل المخاطر؟",a:'الحكم بناءً على وضعك الملموس الخاص، مثل "متى تخطط لاستخدام هذه الأموال" و"مقدار المجال المالي المتاح لديك"'},{q:"رأى إعلانات مختلفة. أي طريقة غير مناسبة للتعامل مع المعلومات؟",a:'منتج مكتوب عليه "الأصول ستتضاعف بشكل مؤكد!": بشكل عام، العائد الكبير يعني مخاطرة كبيرة أيضًا، لكن حقيقة أن أحدهم كتب هذه الجملة فعليًا تعني أنه لا بد أن توجد طريقة لتنمية المال دون مخاطرة'}]},{title:"درس: أنواع فئات الأصول",items:[{q:"شخص لا يحتاج إلى تنمية أصوله كثيرًا، ويريد تقليل خطر تقلب السعر بأقصى قدر. ما التوليفة الأنسب؟",a:"السند: لأن الشركة أو الدولة عليها التزام بإعادة رأس المال، فبالمقارنة مع السهم، يكون مدى تقلب السعر في السوق (المخاطرة) صغيرًا نسبيًا"},{q:"مبتدئ لديه معرفة قليلة ويقلق من اختيار أهداف بمفرده. أي مما يلي ليست نصيحة جيدة؟",a:'"العقارات"، مثل الأرض والمباني، تجذب دائمًا مشترين ويمكن تحويلها إلى نقد فورًا، فحتى المبتدئ بأموال قليلة يمكنه التعامل معها بسهولة'},{q:"طريقة تتكرر فيها شراء سهم وبيعه فورًا عند ارتفاعه خلال أيام قليلة. ما طبيعة هذه الإدارة؟",a:'تندرج تحت "المضاربة" أو "إدارة قريبة من المضاربة"، تستهدف التقلب السعري قصير المدى، وبسبب اعتمادها على التنبؤ الفوري بالسعر، تصبح عدم اليقين (المخاطرة) مرتفعة للغاية'},{q:"مشهد التركيز على الذهب كاستعداد لخطر انخفاض القوة الشرائية بسبب التضخم. ما تفسير طبيعة الاستثمار في الذهب؟",a:"مع أنه لا يُنتج بنفسه فائدة أو توزيعات أرباح، بسبب احتفاظه بقيمته الخاصة المستقلة، فإنه يعمل كأصل آمن عند ارتفاع الأسعار"},{q:"أي مما يلي اعتبار مناسب عند اختيار هدف استثماري؟",a:"بعد فهم الخصائص الثلاث - المخاطرة، والعائد، والسيولة - الاختيار بما يتماشى مع قدرتك الخاصة على تحمل المخاطر (طبيعة الأموال وفترتها)"}]},{title:"اختبار المستوى السابع عشر",items:[{q:'أي مما يلي يفسّر بأفضل شكل المعنى الجوهري لـ "الاستثمار"؟',a:"استخدام الأصول المملوكة حاليًا لنمو الشركات وما شابه على المدى المتوسط إلى الطويل، متوقعًا ربحًا أو نتيجة في المستقبل"},{q:"ميّز بين الاستثمار والادخار والمضاربة: 1 فعل الاستثمار على مدى طويل متوقعًا عائدًا، 2 فعل المراهنة على تحركات السعر خلال فترة قصيرة، 3 فعل تخزين المال. ما التوليفة؟",a:"1 استثمار، 2 مضاربة، 3 ادخار"},{q:"شخص يشعر بمخاطرة في الاستمرار في الاحتفاظ بأموال كنقد في مشهد يُتوقَّع فيه التضخم. ما الرد المناسب؟",a:"بما أن النقد وحده لا يمنع تآكل القوة الشرائية بسبب التضخم، توزيع جزء من الأصول في الأسهم والصناديق الاستثمارية وما شابه، مستخدمًا إياها كإجراء مضاد لارتفاع الأسعار"},{q:'أي مما يلي يفسّر بأفضل شكل العلاقة الأساسية بين "المخاطرة" و"العائد"؟',a:"علاقة غير قابلة للانفصال حيث كلما زاد العائد المتوقع، كلما كبرت المخاطرة المصاحبة (مدى تقلب السعر) أيضًا"},{q:"تحمل أصلًا أجنبيًا، يبقى سعر الأصل دون تغيير، ويتقلب سعر الصرف فقط. ما وصف التأثير عند التحويل؟",a:"حتى إذا تقلب سعر الصرف، حتى تبيع فعليًا ذلك الأصل وتحوّله إلى عملتك المحلية، قيمة الأصل الذي تحمله لا تتقلب - كما وردت في الملف"},{q:"شخص إذا استمر انخفاض السعر حتى مؤقتًا أصبح قلقًا جدًا حتى لا يستطيع النوم. ما الاختيار الأنسب؟",a:"حتى مع وجود مجال في فترة الإدارة، تقبّل انخفاض قدرتك النفسية على التحمل بشكل موضوعي، والتفكير أساسًا في السندات وما شابهها ذات مخاطرة تقلب سعري صغيرة"},{q:"أي مما يلي يصف بأكثر دقة خصائص الأسهم والسندات؟",a:"السهم له مخاطرة وعائد كبيران، والسند له كلاهما أصغر من السهم"},{q:"أي مما يلي نصيحة مناسبة لشخص يفكر في صندوق استثماري؟",a:"بما أن متخصصًا يستثمر في أهداف متنوعة بالنيابة عنك، تُوزَّع المخاطرة، لكنها لا تتحول إلى إيجابية بالضرورة"},{q:"مستثمر يخطط لإدارة أموال على مدى 20 عامًا أو أكثر، بتجميع مبلغ ثابت كل شهر في صندوق استثماري في الأسهم، وسيستمر في الاحتفاظ حتى مع انخفاض كبير مؤقت. ما وصف الموقف؟",a:"توجيه المال إلى النمو طويل المدى لاقتصاد العالم والشركات، وبجعل الوقت حليفًا، الاستفادة من تأثير الفائدة المركبة لتنمية الأصول بصبر"},{q:'أكمل الفراغات: "الذهب لا يُنتج قيمة كالفائدة أو توزيعات الأرباح، لكن الأصل نفسه يحمل قيمة فريدة، وله طبيعة أن مدى (1) تقلب سعره (المخاطرة) مقارنة بالسهم. لذلك يميل إلى جذب الانتباه كمخزن قيمة آمن. أيضًا، عندما تقوم باستثمار في الذهب بعملة أجنبية، فإن قيمة الأصل الحقيقية (2) لتأثير سعر الصرف."',a:"(1) مستقرة نسبيًا / (2) تخضع"}]}]},{id:18,title:"المستوى الثامن عشر — ما هي الأسهم؟",tag:"الأسهم وسوق الأسهم",sections:[{title:"درس: الأسهم",items:[{q:'أي مما يلي يصف بأفضل شكل المكانة القانونية للشخص الذي شرى سهمًا وأصبح "مساهمًا"؟',a:'يحمل "حصة (سهمًا)"، جزءًا من الملكية الإجمالية للشركة مُقسّمًا، وكأحد مالك الشركة يشارك في إدارة الشركة ونتائج عملياتها'},{q:'أي مما يلي هو المثال الأفضل لموقف يمارس فيه مساهم "حقوق التصويت"؟',a:"حضور الجمعية العامة للمساهمين والتصويت بالموافقة على جدول الأعمال المقترح من مجلس الإدارة، بشأن سياسة الأعمال المستقبلية والتعيينات التنفيذية"},{q:'شركة حققت "صافي ربح" لكنها قررت عدم دفع توزيعات أرباح، واستخدام الأموال لتطوير منتجات جديدة. ما طبيعة القرار؟',a:"بما أن الشركة يمكنها اختيار بحرية توزيع الربح كتوزيعات أرباح أو تحويله إلى النمو التالي، فهذا يعني استثمارًا استشرافيًا بعين على نمو الشركة المستقبلي"},{q:"أي مما يلي هو المثال الأفضل للحصول على مكسب رأسمالي؟",a:"شراء سهم شركة تكنولوجيا بسعر 1,000 جنيه للسهم، وبيعه عندما ارتفع إلى 1,500 جنيه، وتحقيق الفرق البالغ 500 جنيه كربح"},{q:"أي مما يلي يصف بأكثر دقة ما يعنيه امتلاك سهم؟",a:"تصبح في موقف حمل جزء من الشركة (مالكًا مشتركًا)، وتتحمل، على مسؤوليتك الخاصة، كلا من إمكانية الحصول على ربح عندما تسير الشركة بشكل جيد وخطر الخسارة عند تراجع الأداء"}]},{title:"درس: لماذا تتغيّر أسعار الأسهم",items:[{q:"منتج جديد لشركة مشروبات أصبح موضوعًا كبيرًا، وتدفق من يريدون الشراء ومن يريدون البيع لتحقيق الربح. ما تفسير تحرك سعر السهم؟",a:"بما أن جانبي الشراء والبيع يزدادان معًا، تتحدد اتجاه سعر السهم بالتوازن النهائي بين العرض والطلب"},{q:"خدمة شركة أصبحت موضوعًا كبيرًا على التواصل، لكن بيانات الإيرادات والأرباح لا تظهر نموًا كبيرًا. ما المنظور الأنسب عند التفكير في الشراء؟",a:"تقييم الرواج كمادة ترفع التوقع (الطلب)، مع التحقق أيضًا من الأداء المُعلَن (الواقع) مثل الإيرادات والأرباح"},{q:"رغم عدم تغيّر كبير في إيرادات أو ربح شركة، ارتفع سعر سهمها. ما عامل مناسب دفع السعر للارتفاع؟",a:"ارتفعت التوقعات للصناعة بأكملها التي تنتمي إليها الشركة، وزاد الأشخاص الذين يريدون شراء سهم تلك الصناعة"},{q:"شركة لوجستية نمت إيراداتها وأرباحها 25% أو أكثر، وارتفع سهمها بثبات. شركة ملابس إيراداتها دون تغيير لكن سعر سهمها ارتفع حادًا بمحفّز على التواصل. ما الرأي الأكثر دقة؟",a:"بما أن سعر سهم شركة الملابس يتصاعد على التوقع وحده دون دعم من الأداء، فإنه يستدعي الحذر لكونه ذا خطر انهيار مفاجئ مرتفع جدًا مقارنة بالشركة اللوجستية"},{q:"شركة تراقبها تنمو بقوة، لكن بسبب تراجع اقتصاد العالم انهارت أسعار السوق وانخفض سهمها أيضًا. ما الحكم المناسب؟",a:"بما أن أداء الشركة (الجوهر) قوي لكن سعر السهم ينخفض جراء تراجع السوق بأكمله، التحقق والحكم عبر الفصل بين الأداء والعوامل الخارجية"}]},{title:"درس: كيف يعمل سوق الأسهم",items:[{q:"أي من العبارات عن دور بورصة الأوراق المالية غير صحيحة؟",a:"تثبيت سعر سهم السوق عند سعر ثابت في كل الأوقات وحمايته، بحيث لا يتحمل المستثمرون خسارة من انخفاض السعر"},{q:"مدير شركة غير مطروحة يريد فتح سهم الشركة للسوق. ما شرط مناسب مطلوب؟",a:'تجاوز معايير الفحص الصارمة التي تحددها البورصة وتحقيق "الطرح للتداول (IPO)"، وفتح السهم للسوق'},{q:'ما وصف آلية "المؤشر السهمي" وطبيعته؟',a:"تجميع ومتوسط أسعار أسهم شركات عديدة تمثّل السوق، بطريقة حساب فريدة، ليصبح دليلًا لاتجاه السوق بأكمله"},{q:"شركة أغذية جمعت أموالًا لبناء مصنع جديد وحققت الطرح للتداول (IPO). ما تأثير مناسب؟",a:"من خلال سوق الأسهم، يصبح أسهل جمع الأموال اللازمة لنمو الشركة مباشرة من مستثمرين كثيرين"},{q:"شركة ناشئة تستخدم سوق الأسهم لتوسيع أعمالها وتتطور إلى شركة كبرى تمثّل مصر. ما وصف آلية سوق الأسهم ودوره؟",a:"بتجاوز فحص صارم والطرح للتداول (IPO) في البورصة، تصبح قادرة على جمع أموال نمو على نطاق واسع دون الحاجة إلى سداد، وإذا نمت أكثر إلى حجم يمثّل السوق، يمكن دمجها كجزء من المؤشر السهمي"}]},{title:"اختبار المستوى الثامن عشر",items:[{q:"مستثمر شرى سهمًا في شركة مشروبات يريد دعمها، ويتوقع توزيعات أرباح ومكاسب ارتفاع سعر. ما وصف موقفه وحقوقه؟",a:"يصبح في موقف حمل جزء من ملكية الشركة (حصة)، ويمكنه الحصول على ربح وخسارة معًا بحسب تقلبات الأداء"},{q:"مستثمر حصل على توزيع من صافي الربح، ثم باع السهم بسعر أعلى محققًا الفرق. ما نوعي الربح؟",a:"الربح الموزَّع يُسمّى توزيعات أرباح، وربح الفرق من بيع السهم يُسمّى مكسبًا رأسماليًا"},{q:'في الجمعية العامة، يشارك مساهم يحمل سهمًا كثيرًا ومساهم يحمل قليلًا. ما وصف آلية "حقوق التصويت"؟',a:"آلية يمكن للمساهمين فيها التصويت على مقترحات مهمة متعلقة بإدارة الشركة، وتُحدَّد نتيجة القرار بحسب عدد السهم المحمول (الحصة)"},{q:"أعلنت شركة ألعاب عن لعبة جديدة شائعة، وزاد من يريدون شراء سهمها. ما سبب مناسب لتقلب سعر السهم؟",a:"لأنه عندما يزداد المشترون، يظهر أشخاص يريدون الحصول على ذلك السهم حتى بدفع سعر أعلى قليلًا، ويرتفع سعر السهم بسهولة"},{q:"شركة ملابس موضوع كبير على التواصل، لكن الربح انخفض عن العام السابق. ما رأي مناسب حول العلاقة بين الأداء وسعر السهم؟",a:'رأي بأن الرواج يرتبط بـ "توقع (طلب)" المستثمرين، لكن يجب أيضًا التأكد من "الأداء (الواقع)" كالإيرادات والربح الفعليين'},{q:"تجمّع انتباه على شركات في مجال معين، وارتفعت أسعار أسهم شركات لم تنمُ إيراداتها بشكل كافٍ معًا. ما وصف الحالة؟",a:"حالة تحمل خطر أنه، بما أن سعر السهم قد ارتفع بعيدًا جدًا عن الواقع على التوقع (الطلب) وحده، في اللحظة التي يتبين فيها أن الأداء الفعلي المستقبلي لن يصل إلى التوقع، ينهار سعر السهم بشكل كبير"},{q:"مستثمر يريد شراء سهم شركة أغذية، وآخر يريد بيع سهم نفس الشركة. ما دور البورصة؟",a:"البورصة مكان يجمع أوامر البائعين والمشترين في مكان واحد ويقيم الصفقات"},{q:'شركة لوجستيات تريد زيادة مستودعات وتوسيع التوصيل. ما وصف "الطرح العام الأولي (IPO)"؟',a:"بالخروج إلى سوق الأسهم لأول مرة بعد تجاوز فحص صارم، تسهيل جمع أموال الأعمال من مستثمرين حول العالم"},{q:'أفادت أخبار أن "المؤشر السهمي الرئيسي انخفض اليوم"، لكن سعر سهم شركة أدوية ارتفع. ما رأي مناسب في العلاقة بين المؤشر والأسهم الفردية؟',a:"رأي بأنه بما أن المؤشر السهمي دليل على اتجاه السوق بأكمله، حتى عندما ينخفض المؤشر، يمكن أن يرتفع سعر سهم شركة فردية"},{q:"مستثمر غير متأكد من شراء سهم شركة أجهزة منزلية. الشركة تجذب الانتباه لمنتج جديد لكن الربح لم ينمُ كثيرًا، والتوقعات تتجمع على الصناعة ويرتفع المؤشر. ما حكم مناسب؟",a:"يمكنك الحكم بأن التوقع، وحركة القطاع، وارتفاع المؤشر أدلة، لكن يجب أن تنظر أيضًا في نمو الربح معًا"}]}]},{id:19,title:"المستوى التاسع عشر — التنويع وتقييم الشركات",tag:"التنويع وPER وPBR وROE",sections:[{title:"درس: مبادئ التنويع",items:[{q:'X يحمل أسهم شركات في مصر وأمريكا واليابان مُقسّمة، و Y فقط شركات مصرية لكن مُقسّمة إلى أسهم وسندات وعقارات. كلاهما يقول "أنا أنوّع". ما النقطة المناسبة؟',a:"X قسّم فقط المناطق، و Y قسّم فقط فئات الأصول، فلا أحد منهما نوّع بشكل كافٍ إجمالًا"},{q:'شخص يستثمر بالتقسيط، رأى سعر السهم ينخفض كثيرًا، فيتردد: "هل أوقف الشراء وهو منخفض؟" ما النصيحة المناسبة؟',a:"بما أن الآن، وقد انخفض، هو فترة يمكنك فيها شراء كمية كبيرة بنفس المبلغ، الاستمرار كالمعتاد يتناسب مع طريقة تفكير التقسيط"},{q:"الخطة أ: أسهم 90%، سندات 10%. الخطة ب: أسهم 50%، سندات 50%. ما الفرق؟",a:"بما أن الخطة أ لديها نسبة مرتفعة من الأسهم ذات التحرك السعري الكبير نوعًا ما، فهي بناء يميل فيه التحرك السعري للاستثمار كله إلى أن يكون كبيرًا"},{q:'عرض: "هذا المنتج يضمن لك عائدًا مرتفعًا بشكل موثوق كل شهر، ورأس المال لا ينخفض أبدًا". ما الحكم؟',a:"بما أنه حديث مستحيل يخالف أساسيات الاستثمار القائلة بأن المخاطرة والعائد علاقة طردية، رفضه بحزم"},{q:'شخص يقول: "إذا انخفضت قيمة المال الذي استثمرته بشكل كبير، سأصبح قلقًا وسأتخلى عنه فورًا". ما الطريقة الأنسب لبناء محفظة تناسبه؟',a:"اصنع بناءً بمزيد من شيء ذي تحرك سعري لطيف كالسندات، والأسهم بشكل متواضع"}]},{title:"درس: تقييم الشركات",items:[{q:"الشركة X سعر السهم 80 جنيهًا وعدد الأسهم مليار سهم، والشركة Y سعر السهم 1,200 جنيه وعدد الأسهم 5 مليون سهم. ما تفسير قيمتهما الكاملة (القيمة السوقية)؟",a:"القيمة السوقية أكبر للشركة X، لكن ما إذا كانت رخيصة لا يمكن تحديده حتى تقارن الجوهر"},{q:'PER الشركة أ 10 مرات ومتوسط PER نفس الصناعة 15 مرة، فيقول مستثمر: "بما أنه أقل من المتوسط، هذه الشركة رخيصة. لنشتر فورًا". ما النقطة المناسبة؟',a:"بما أن PER أقل من متوسط الصناعة، يمكن اعتبار الشركة أ منخفضة التقييم مقارنة بمتوسط القطاع. مع ذلك، احكم على الاستثمار بعد التأكد أيضًا من السبب وحالة الشركة"},{q:"PBR الشركة أ 0.7 مرة، و PBR الشركة ب 2.5 مرة. ما تفسير الحالتين؟",a:"سعر سهم الشركة أ مُسعّر أرخص من صافي الأصول، وسعر سهم الشركة ب أعلى من صافي الأصول، لكن الحكم الاستثماري لا يمكن تحديده بالارتفاع أو الانخفاض وحده"},{q:"الشركة أ: حقوق ملكية مليون جنيه، صافي ربح 200,000 جنيه. الشركة ب: حقوق ملكية 5 مليون جنيه، صافي ربح 500,000 جنيه. من منظور ROE، ما التفسير؟",a:"كفاءة الكسب (ROE) أعلى للشركة أ، ويحتاج الأمر إلى رؤيته بشكل منفصل عن حجم مبلغ صافي الربح"},{q:"PER و PBR و ROE لشركة كلها أرقام مُفضّلة مقارنة بمتوسط الصناعة، لكن الرئيس التنفيذي تغيّر حديثًا وسجل فريق الإدارة الجديد غير معروف. ما حكم مناسب؟",a:"الحكم بينما تراقب حالة فريق الإدارة الجديد، بما في ذلك الجزء الذي لا يظهر في الأرقام"},{q:'P يقول: "PER هذه الشركة أقل بكثير من المتوسط، والعمل مستقر، وسعر السهم لم يلحق بالقوة الحقيقية". و Q يقول: "PER مرتفع لكنها نمت بسرعة، فأرى الربح يزداد عدة مرات". ما تفسير أسلوبيهما؟',a:"P يتوافق مع الاستثمار القيمي الذي يركّز على الرخص الحالي، و Q مع الاستثمار في النمو الذي يركّز على النمو المستقبلي"}]},{title:"درس: أدوات الاستثمار",items:[{q:'صندوق استثماري وضع فيه 100 شخص كل منهم 100 جنيه، والمال المُجمَّع يستثمره متخصص مُقسّمًا إلى أسهم وسندات. ما تفسير "وضع الاستثمار الفردي"؟',a:"بما أن متخصصًا يستثمر 10,000 جنيه، حيث تجمّع مال الجميع مُقسّمًا، حتى بـ 100 جنيه للشخص، يمكنك حمل شكل تنويع قوي"},{q:"شخص يريد الشراء والبيع في توقيته الخاص بينما يراقب سعر اللحظة خلال ساعات السوق. أي منتج يناسبه؟",a:"الصندوق المتداول في البورصة مناسب، لأنه، كالسهم في سوق الأسهم، يمكن شراؤه وبيعه بسعر اللحظة الفعلي بينما السوق مفتوح"},{q:'شخص يقول: "الاستثمار في المؤشر يُنوّع عبر السوق بأكمله، فالسعر لا ينخفض أبدًا". ما تقييم مناسب؟',a:"هذا التفكير خاطئ، وبما أنها آلية ترتبط بالكامل بحركة السوق بأكمله، في فترات تراجع السوق بأكمله، ينخفض المنتج في قيمته معًا"},{q:'شخص يجمع صندوقًا مرتبطًا بالمؤشر يحتوي على شركات من مناطق متعددة، بمبلغ ثابت كل شهر. ما الطريقة الأنسب للتفكير في "التنويع عبر الزمن"؟',a:"طريقة التفكير القائلة بتقسيم فترة الشراء إلى مرات متعددة، مما يجعل سعر الشراء أقل تأثرًا بارتفاع أو انخفاض يوم محدد"},{q:'شخص يقول: "ليس لدي مال كثير، فأفكر في البدء بمبلغ صغير. لدي شعور بالاستمرار طويلًا، لكن لا يمكنني أخذ وقت كثير للبحث". ما المزيج الأنسب؟',a:"اختيار منتج واحد مرتبط بمؤشرات أسهم مناطق متعددة، والاستمرار في الشراء بنفس المبلغ كل شهر"}]},{title:"اختبار المستوى التاسع عشر",items:[{q:'أي مما يلي يفسّر بأفضل شكل "التنويع"؟',a:"طريقة لتقسيم الأهداف الاستثمارية إلى عدة أجزاء، بحيث حتى إذا انخفض أحدها، يمكن للأخرى دعمه"},{q:'شخص اختار 5 أسهم من قطاعات مختلفة داخل مصر، ويجمّع كل واحد بنفس المبلغ كل شهر، ويقول "أنا مُنوَّع بالمحاور الثلاثة". أي محور لم يُنوّع فيه؟',a:"كلا التنويع عبر فئات الأصول والتنويع عبر المناطق"},{q:'محفظة "أسهم 80%، سندات 20%". ما عبارة دقيقة؟',a:"بما أنه يتركز على الأسهم ذات التحرك السعري الكبير نوعًا ما، هو بناء يميل فيه التحرك السعري للكل إلى أن يكون كبيرًا أيضًا"},{q:"أي مما يلي أقرب إلى معنى PER؟",a:"رقم يمثّل كم مرة من ربحية السهم يمثّل سعر سهم الشركة"},{q:"ROE الشركة أ 18% و ROE الشركة ب 6%. ما شيء مناسب يمكن قوله؟",a:"الشركة أ تكسب بكفاءة أكبر، لكن ما إذا كانت رخيصة لا يمكن معرفته من ROE وحدها"},{q:"PER شركة أقل بكثير من المتوسط، و PBR أيضًا أقل من 1 مرة، وعملها حقق ربحًا بثبات لسنوات. أي نوع مستثمرين سيميل لاعتبارها مرشحة للشراء؟",a:"مستثمر استثمار قيمي. لأنه يركّز على إمكانية أن يكون سعر السهم الحالي مُتروكًا أرخص من القوة الحقيقية"},{q:'شخص لديه فقط حوالي 200 جنيه شهريًا للاستثمار، فيقول "حمله مُقسّمًا مستحيل". ما النصيحة الأنسب؟',a:"باستخدام صندوق استثماري، يمكنك صنع شكل من الحمل المُقسّم حتى بمبلغ صغير"},{q:"أي مما يلي أقرب كخاصية للصندوق المتداول في البورصة (ETF)؟",a:"قريب للصندوق الاستثماري، منتج قابل للتداول في السوق كالسهم بسعر اللحظة"},{q:"تحمل منتجًا مرتبطًا بمؤشر يحتوي على أسهم 30 شركة رئيسية. إذا تراجع أداء إحدى الشركات وانخفض سهمها فقط كثيرًا، ماذا يحدث لسعر المنتج؟",a:"حصة تلك الشركة الواحدة تعمل في اتجاه الانخفاض، لكن مجتمعة مع حركات الـ 29 شركة الأخرى، التأثير على المنتج بأكمله يسهل تقليله"},{q:"تقوم بالاستثمار بالتقسيط بـ 300 جنيه كل شهر. في يناير كان سعر المنتج 30 جنيهًا للوحدة، وفي فبراير 15 جنيهًا. ما تفسير تأثير طريقة الشراء؟",a:"يمكنك شراء 30 وحدة إجماليًا، ويصبح متوسط سعر الشراء للوحدة 20 جنيهًا، أرخص من منتصف الأسعار البسيط. عمل شراء المزيد في الشهر الرخيص يقلل متوسط سعر الشراء"}]}]},{id:20,title:"المستوى العشرون — محاكاة حياة المستثمر - بناء الثروة للمستقبل",tag:"محاكاة • 50 سؤالًا",sections:[{title:"محاكاة حياة المستثمر — 50 سؤالًا",items:[{q:'من أجل شركتك الناشئة المستقبلية، قررت أولًا اكتساب القوة على تنمية المال. أي مما يلي يطابق "وسيلة فعّالة لتنمية 30,000 جنيه من الأموال الفائضة" مع تعريفها؟',a:"الاستثمار: توقع عائد مستقبلي، وضع المال في نمو شركة أو مشروع، وتنميته بمرور الوقت"},{q:"تريد تنمية أموال فائضة على مدى طويل. من بين طرق استخدام المال، أي فعل أنسب؟",a:"وضع مبلغ ثابت كل شهر لشركة تتوقع نموها حتى بعد 10 سنوات، الاستمرار في حمل السهم، وتنميته بمكاسب ارتفاع السعر وتوزيعات الأرباح"},{q:'أفادت أخبار أن "الأسعار ترتفع في كل العالم". مع أنه لم تنخفض ورقة نقدية واحدة من حافظتك، لماذا تنخفض قيمتها فقط من الاحتفاظ بها؟',a:"لأن حتى إذا بقي المبلغ نفسه، تنخفض كمية السلع والخدمات التي يمكنك شراءها بذلك المبلغ"},{q:"ارتفع سعر غداء المقصف من 80 جنيهًا إلى 100 جنيه. كيف يتغيّر عدد وجبات الغداء التي يمكنك شراءها بـ 4,000 جنيه؟",a:"العدد ينخفض بـ 10، وحتى بنفس المبلغ، انكمشت الكمية التي يمكنك شراءها"},{q:"المبلغ المتوفر 57,000 جنيه له ثلاث خطط: 25,000 جنيه تكلفة دورة يجب دفعها في نصف عام، 20,000 جنيه نفقات معيشة قريبة المدى للانتقال في 3 سنوات، والباقي 30,000 جنيه لا خطة لاستخدامه - كما وردت الأرقام في الملف. ما طريقة مناسبة للتعامل مع المبالغ الثلاثة؟",a:"تأمين المبلغين ذوي وقت الاستخدام المحدد من خلال الادخار، وتحويل فقط الـ 30,000 جنيه غير المُستخدَمة في الوقت الحالي إلى استثمار"},{q:'تحرك سعر سهم شركة بشكل كبير حتى خلال يوم واحد. ما تفسير مناسب لـ "المخاطرة" في عالم التمويل؟',a:"يشير إلى مدى تقلب السعر، متحركًا في الاتجاهين، الزيادة والانخفاض"},{q:'ما تفسير مناسب لعلاقة "المخاطرة والعائد"؟',a:"هما في علاقة مقايضة حيث كلما زاد العائد المتوقع، كبرت المخاطرة المصاحبة أيضًا"},{q:'ظهر إعلان "رأس مال مضمون، ينمو بشكل موثوق وكبير كل شهر". ما طريقة مناسبة للتعامل معه؟',a:"اعتباره قصة تبدو جيدة أكثر من الحقيقة تخالف مقايضة المخاطرة والعائد، والشك فيها أولًا"},{q:"طابق الأحداث مع أنواع المخاطر: 1 تراجعت إدارة الهدف الاستثماري ولم يعد المال المُقدَّم، 2 تغيّر سعر الصرف وانخفضت قيمة أصل أجنبي، 3 تراجع اقتصادي عالمي وانخفضت أسعار أسهم كثيرة، 4 أردت البيع لكن لم تجد مشتريًا. ما التوليفة؟",a:"(1) المخاطر الائتمانية، (2) مخاطر سعر الصرف، (3) مخاطر السوق، (4) مخاطر السيولة"},{q:"تغيّر سعر الصرف من 1 دولار = 48 جنيهًا إلى 1 دولار = 52 جنيهًا. إذا كنت تحمل أصولًا بقيمة 500 دولار لا يتغيّر سعرها المحلي، كيف تتغيّر قيمتها عند التحويل؟",a:"زادت بمقدار 2,000 جنيه، وحتى بنفس السعر المحلي، تتحرك القيمة فقط من تغيّر سعر الصرف"},{q:"ما تُخصّصه للإدارة أموال فائضة لا خطة لاستخدامها الآن، لكنك قد تستخدم جزءًا في غضون سنوات قليلة، وتنزعج عندما تنخفض الأصول كثيرًا. ما طريقة مناسبة للتفكير في القدرة على تحمل المخاطر؟",a:"بما أن لديك مجالًا لكن قد تستخدم جزءًا في غضون سنوات قليلة وتتحمّل انخفاضات السعر بشكل ضعيف أيضًا، تحديد مدى التقلب المقبول عند المستوى المتوسط"},{q:'ما تفسير مناسب للفرق بين "السهم" و"السند"؟',a:"السهم حصة شركة ذو تحرك سعري كبير نوعًا ما، والسند يميل إلى تحرك سعري صغير بسبب وجود وعد بالسداد"},{q:"تريد دخلًا شهريًا منتظمًا وارتفاع سعر طويل المدى معًا، ولا يهمك عدم القدرة على التحويل إلى نقد فورًا. أي هدف يناسب؟",a:"العقارات"},{q:'لاحظت "الذهب" الذي يختلف تحركه السعري عن الأسهم والسندات. ما تفسير مناسب للذهب؟',a:"لا يُنتج عائدًا، لكنه يميل إلى جذب الانتباه كمخزن للقيمة في أوقات ارتفاع الأسعار أو عدم الاستقرار"},{q:'بأموال فائضة، فورًا بعد البدء انخفض السوق وتنكمشت أصولك مؤقتًا بحوالي 10%، ويقول من حولك "من الأفضل أن تبيع الآن". ما سياسة مناسبة؟',a:"بما أن الأموال لن تُستخدَم في الوقت الحالي، عدم الانجراف مع انخفاضات السعر القريبة المدى أو أصوات من حولك، والاستمرار في حمل هدف استثماري متوقع أن ينمو"},{q:'سهم ارتفع سعره ثلاث مرات في نصف العام الماضي ويُشتهَر أنه سيستمر في الارتفاع، وتحركه السعري حاد جدًا، ولا يمكنك بالضرورة البيع فورًا. قدرتك على تحمل المخاطر "قد تستخدم جزءًا في غضون سنوات قليلة، وتريد تجنب انخفاضات كبيرة". ما طريقة مناسبة؟',a:"التحقق من آفاق النمو، وحجم التحرك السعري، وما إذا كان يمكن بيعه فورًا مقابل القدرة المُحدَّدة، والتنازل عن الشراء إذا لم تتناسب"},{q:"قبل شراء سهم لأول مرة، ما تفسير مناسب للسهم؟",a:"ورقة مالية تُصدرها شركة لجمع أموال لأنشطتها، تمثّل حصة شركة"},{q:"عندما تضع أمر شراء سهم، تُبرم الصفقة دون أن تبحث عن طرف مقابل بنفسك. ما تفسير دور البورصة؟",a:"تجمع أوامر بائعي ومشتري الأسهم في مكان واحد، ويتحدد سعر السهم حيث تتلاقى رغبات المشترين والبائعين"},{q:"المال المُحصَّل من الاستثمار في الأسهم له شكلان - توزيعات الأرباح والمكسب الرأسمالي. ما الفرق؟",a:"توزيعات الأرباح (مكسب الدخل) مال توزّعه شركة على المساهمين من جزء من صافي الربح، والمكسب الرأسمالي هو ربح الفرق من بيع السهم بسعر أعلى من سعر الشراء"},{q:"إذا شريت وبعت سهمًا بالضبط كما في الجدول، ما المكسب الرأسمالي المناسب؟",a:"600 جنيه، وفقط الفرق بين سعر البيع وسعر الشراء مضروبًا في عدد الأسهم يصبح ربحًا"},{q:"مقدار توزيعات الأرباح لكل سهم زاد وانخفض عامًا بعد عام. ما سبب مناسب لتغيّر المقدار؟",a:"لأن مصدر توزيعات الأرباح (مكسب الدخل) هو صافي الربح الذي حققته الشركة، والمبلغ القابل للتوزيع يتغيّر بحسب أداء تلك السنة"},{q:'أعلنت الشركة: "هذه السنة لن ندفع توزيعات أرباح، وسنخصص هذا الجزء بدلًا من ذلك لبناء مصنع جديد (إعادة استثمار)"، وانخفض سعر السهم قليلًا. كمساهم، ما طريقة مناسبة لأخذ هذا؟',a:"أخذها كخيار لإعادة استثمار صافي الربح في النمو، والحكم على المدى الطويل فيما إذا كانت قيمة الشركة تنمو"},{q:"سعر السهم يرتفع وينخفض يوميًا. ما تفسير الآلية الأساسية التي يتحرك بها سعر السهم؟",a:"تغيّر توازن الأشخاص الذين يريدون الشراء والأشخاص الذين يريدون البيع يجعل سعر السهم يرتفع وينخفض"},{q:"شركة حلويات موضوع كبير على التواصل، لكن لا يظهر نمو كبير في الإيرادات أو الربح. ما طريقة مناسبة للتفكير في شراء المزيد؟",a:"رغم أن الشعبية يمكن أن ترفع سعر السهم، الحكم بعد التحقق من دعم الأداء"},{q:'في يوم أفادت فيه الأخبار أن "معدل البطالة تراجع"، رغم أن شركتك لم تُعلن شيئًا، انخفض سعر سهمها. ما تفسير عامل الانخفاض؟',a:"مؤشر اقتصادي كمعدل البطالة نشر قلقًا حول الآفاق الاقتصادية، وزاد الأشخاص الذين يريدون بيع الأسهم عبر السوق بأكمله"},{q:'أفادت الأخبار أن "أسعار أسهم شركات كثيرة ترتفع بزخم يتجاوز نمو ربحها". ما تفسير مناسب عندما يكون السوق بأكمله في حالة كهذه؟',a:"حالة يرتفع فيها سعر السهم على التوقع أو الشعبية وحدها بما يتجاوز الواقع، وعندما ينتشر الحذر يمكن أن ينهار من تدفق البيع"},{q:"سهم يستمر في التصاعد موضوع في العمل. عند التردد بين شرائه بجزء من أموالك الفائضة طويلة المدى، ما طريقة مناسبة للتفكير؟",a:"فحص جوهر التصاعد مقابل الأداء، وإذا كان ارتفاعًا على التوقع وحده، التنازل عن الشراء بالأموال الفائضة"},{q:"وصلت دعوة للجمعية العامة للمساهمين. عندما تحضر كمساهم، ماذا يمكنك أن تفعل؟",a:"يمكنك إظهار الموافقة أو عدم الموافقة على قرارات الشركة المهمة باستخدام حقوق التصويت التي تملكها"},{q:"عندما حاولت شراء سهم شركة مصنّعة لمعدات كرة القدم، لم تكن قد خرجت للسوق بعد. ما المطلوب لكي يصبح سهمها قابلًا للتداول؟",a:"قيام الشركة بتجاوز فحص البورصة، والطرح للتداول، وفتح وعرض سهمها للسوق"},{q:'في أعلى الشاشة يُعرَض رقم "المؤشر السهمي". ما تفسير مناسب لما يمثّله؟',a:"رقم يُجمّع ويحسب، بطريقة فريدة، أسعار أسهم شركات متعددة تمثّل السوق"},{q:"تُحاكي سوقًا صغيرًا مكوّنًا من ثلاث شركات. بالأمس كان متوسط الثلاث 100 جنيه، واليوم فقط الشركة ب ارتفعت 60 جنيهًا بينما الأخريان دون تغيير. ما متوسط سعر السهم لليوم وطبيعة المؤشر؟",a:"120 جنيهًا، وارتفاع الشركة ب البالغ 60 جنيهًا يصبح ارتفاعًا بـ 20 جنيهًا في متوسط الثلاث شركات"},{q:"في صباح ما، انخفض المؤشر بشكل كبير. سعر سهم هدفك لم ينخفض تقريبًا وأداؤه سلس. ما رد مناسب؟",a:"بما أن المؤشر مقياس السوق بأكمله، التحقق من السهم المحمول وحالة الشركة، ثم النظر فيما إذا كنت تبيع أو تستمر في حمل ذلك السهم"},{q:"بالنظر إلى سجل استثمارك، تحدَّدت زيادة وانخفاض الأصول كلها بتحرك سعر شركة واحدة فقط. ما طريقة مناسبة نحو بناء أصول مستقبلي مستقر؟",a:"بما أن البقاء مُركَّزًا في شركة واحدة يترك كل الأصول متأثرة بتحرك سعر شركة واحدة، اعتمد التنويع بتقسيم أموالك على عدة أهداف استثمارية"},{q:"ما تفسير مناسب للتنويع؟",a:"تقسيم الأهداف الاستثمارية إلى عدة أجزاء، بحيث حتى إذا انخفض سعر هدف واحد، يمكن للأخرى دعمه"},{q:"ما المزيج المناسب للأمثلة: 1 شراء نفس الهدف بمبالغ صغيرة على فترات منتظمة، 2 حمل أموال مُقسّمة إلى أسهم وسندات وذهب، 3 حمل شركات مُقسّمة إلى محلية وخارجية؟ والمحاور الثلاثة (فئة الأصول، المنطقة، الزمن)؟",a:"1 الزمن، 2 فئة الأصل، 3 المنطقة"},{q:'بنيت محفظة إجماليها 30,000 جنيه. حددت دليلًا "حتى نصف (50%) الكل" للتسليم للأسهم ذات التحرك السعري الكبير. ما تفسير العلاقة بين نسبة الأسهم الحالية والدليل؟',a:"ضمن دليل النصف، لكن الأسهم تحتل قريبًا من النصف"},{q:'بمطابقة كل يوم راتب شهري، تبدأ "الاستثمار بالتقسيط". ما تفسير آلية الاستثمار بالتقسيط؟',a:"الاستمرار في شراء نفس الهدف الاستثماري بمبلغ ثابت في توقيت ثابت، وتشتري قليلًا عندما يكون مرتفعًا وكثيرًا عندما يكون رخيصًا"},{q:"شريت نفس السهم بـ 3,000 جنيه في كل مرة، مُقسّمًا على مرتين. المرة الأولى بسعر 100 جنيه، والثانية بسعر 300 جنيه. ما متوسط سعر الشراء الإجمالي وتأثير التقسيط؟",a:"150 جنيهًا، مُحافَظًا عليه أقل من الوسط البسيط بمقدار ما استطعت شراءه أكثر عندما كان رخيصًا"},{q:"تعلمت المحاور الثلاثة للتنويع وقدرتك على تحمل المخاطر، لكن الآن معظم أصولك مُنحازة لسهم شركة واحدة. ما طريقة مناسبة لبناء محفظة تناسبك؟",a:"التقسيم بالمحاور الثلاثة لفئة الأصل والمنطقة والزمن، والبناء بحيث يتناسب مع القدرة على تحمل المخاطر، مخفّفًا الانحياز نحو شركة واحدة"},{q:'من بين المعلومات لتقييم شركة: 1 عدد المحلات الجديدة المفتوحة، 2 طريقة تفكير المدير، 3 سهولة استخدام المنتجات وحالة الموظفين، 4 قيمة ROE. أي مما يلي يحدد كل معلومة كـ "كمية" أو "نوعية"؟',a:"1 كمية، 2 نوعية، 3 نوعية، 4 كمية"},{q:"شركة سعر سهمها 160 جنيهًا وربحية سهمها 8 جنيهات. ما PER و معناه؟",a:"PER هو 20 مرة، وسعر السهم عند مستوى ما يعادل 20 سنة من ربحية السهم"},{q:"وسط متوسط PER للصناعة 18 مرة، وجدت شركة بـ PER 9 مرات. ما معنى مناسب؟",a:"حالة يكون فيها سعر السهم منخفضًا نسبيًا مقارنةً بربحيته، ما قد يشير إلى انخفاض تقييمه"},{q:"تُقارن شركتين في الجدول. أي مما يلي يحدد الشركة ذات سعر السهم الأرخص نسبيًا نسبة إلى صافي الأصول، والشركة التي تكسب بكفاءة؟",a:"الأرخص = الشركة أ، الأكثر كفاءة في الكسب = الشركة ب"},{q:"لاحظت شركة PER منخفض بشكل خاص عن المتوسط، لكن إيرادات منتجها الرئيسي تراجعت حديثًا. ما طريقة مناسبة للتفكير؟",a:"التحقق من سبب انخفاض PER والإيرادات والأداء، وتمييز ما إذا كان سعر السهم رخيصًا حقًا نسبة إلى الربح والأصول"},{q:"وجدت واستثمرت في شركة سعر سهمها منخفض مقارنةً بقوتها الحقيقية، رغم أن أرباحها مستقرة. ما اسم الأسلوب؟",a:"الاستثمار القيمي: البحث عن واختيار شركة سعر سهمها منخفض مقارنةً بقوتها الحقيقية"},{q:'بعد اكتساب التنويع وتمييز الشركات، بإضافة "الصندوق الاستثماري" أكملت محفظة. ما تفسير مناسب للصندوق؟',a:"منتج يستثمر فيه متخصص مالًا مُجمَّعًا من أشخاص كثيرين، مُنوَّعًا في أسهم وسندات وما شابه"},{q:"بعد اكتساب طريقة الاختيار بالبحث وطريقة الربط بالسوق بأكمله، مرّت عدة سنوات. ما طريقة مناسبة لدمج الطرق لصنع شكل سهل الاستمرار في بناء أصول مستقر طويل المدى؟",a:"التركيز على التقسيط في الاستثمار في المؤشر الذي يربط بحركة السوق بأكمله، ودمج جزئيًا سهم شركات مُميَّزة كرخيصة"},{q:'نمت الـ 30,000 جنيه المُخصَّصة للإدارة إلى 42,000 جنيه على مدى سنوات قليلة. ما "معدل النمو" من المبلغ الأولي ومعناه؟',a:"زيادة 40%، تُظهر أن 12,000 جنيه زادت على الـ 30,000 جنيه الأولية"},{q:"الأسهم والسندات والذهب التي حملتها مُقسّمة نمت كما في الجدول على مدى سنوات قليلة. ما استنتاج دقيق من الفرق في كيفية نمو الأصول الثلاثة؟",a:"كلما كبر التحرك السعري للأسهم، كلما نمت أكثر، وتظهر علاقة المخاطرة والعائد في النتيجة"},{q:"انتهت تجربة المحاكي، واكتسبت القوة على تنمية 30,000 جنيه إلى 42,000 جنيه. وفي العالم الحقيقي مستقبلًا، في كل مرة يتغيّر هدفك أو وضعك، ستُعيد التأكد من (1)، وبمبدأ (2) ستُنمّي الأموال. ما زوج الكلمات الذي يملأ الفراغين؟",a:"(1) القدرة على تحمل المخاطر، (2) الاستمرار طويل المدى، والتنويع، والتقسيط، ورؤية الأرقام كالأداء ومحتوى الأعمال معًا"}]}]},{id:21,title:"المستوى الحادي والعشرون — شركات الذكاء الاصطناعي ونماذج الأعمال",tag:"الذكاء الاصطناعي والفينتك",sections:[{title:"درس: كيف يغيّر الذكاء الاصطناعي عالم الأعمال",items:[{q:'تطبيق تسوّق يعرض "هذا المنتج أيضًا موصى به". ما تفسير وظيفة الذكاء الاصطناعي؟',a:"الذكاء الاصطناعي يكتشف أنماطًا من بيانات سلوك المستخدم السابقة ويتنبأ بمنتجات من المحتمل أن تهمّه بعد ذلك"},{q:'طالب ثانوي يفكر في استشارة خدمة محادثة ذكاء اصطناعي بخصوص "مشكلة مع صديقه". ما أفضل طريقة للاستخدام؟',a:"لا يُدخل معلومات تحدد هوية الطرف الآخر، ويعمّم المحتوى إذا احتاج قبل الاستشارة"},{q:"شركة على وشك استخدام خدمة محادثة ذكاء اصطناعي توليدي في عملها. ما أفضل طريقة للاستخدام؟",a:"يجعله يعمل مسودة لوصف منتج، ويستخدمها بعد أن يتأكد المسؤول من أنها مطابقة للحقائق"},{q:"شركة على وشك إدخال الذكاء الاصطناعي لرفع الكفاءة. أي مما يلي ليس مكسب كفاءة يمكن توقّعه؟",a:"يترك الحديث العادي وبناء العلاقات بين الموظفين للذكاء الاصطناعي، لتحسين الجو وتقليل الأخطاء"},{q:"سوبر ماركت استخدم ذكاء اصطناعي يتنبأ بالمبيعات، لكن عندما بُنيت محطة جديدة وتغيّرت قاعدة العملاء، بدأت التنبؤات تفشل. ما الربط الصحيح بين السبب والحل؟",a:"بما أن الذكاء الاصطناعي لم يتعلّم كيف أصبح البيع بعد تغيّر قاعدة العملاء، يجعله يتعلم من جديد ببيانات جديدة"}]},{title:"درس: التكنولوجيا المالية والذكاء الاصطناعي في التمويل",items:[{q:"أي مما يلي يحدد الخدمات التي تُستخدم فيها تقنية الفينتك؟ 1 تطبيق حسابات أسرة يرتبط بالبنك ويحسب الدخل والمصروفات، 2 خدمة حجز مكان في مطعم، 3 خدمة ذكاء اصطناعي تدير الاستثمار تلقائيًا، 4 الوقوف في طابور بنك وإجراء تحويل باستمارة مكتوبة",a:"(1) و (3)"},{q:'بخصوص طريقة الدفع "BNPL"، أي مما يلي يفسّر بشكل أفضل خصائصها والنقاط التي يجب ملاحظتها؟',a:"لديها راحة الحصول على المنتج أولًا، لكن بما أن الدفع يحدث بعد ذلك، يحتاج تأكدًا مخططًا له"},{q:'شركة تقدّم خدمة دفع لاحق. عندما يصل طلب استخدام الخدمة، ما دور "تقييم الجدارة الائتمانية"؟',a:"تسجيل درجة الجدارة الائتمانية بناءً على بيانات الاستخدام في خدمات مالية أخرى وغيرها، والحكم هل يبدون قادرين على الدفع في الوقت"},{q:"شخص يريد أن يستثمر تدريجيًا ويستخدم مستشارًا آليًا يقترح خطة عندما يجيب عن العمر والأهداف وتحمل الخطر. ما أفضل عقلية للاستخدام؟",a:"يفهم خطر نزول الأسعار، ويرجع إلى المقترحات، ويحكم ويستخدمها بنفسه في النهاية"},{q:"في بنك تحدث فيه تحويلات كثيرة، قرروا إدخال الذكاء الاصطناعي لمنع جريمة استخدام حسابات أشخاص آخرين. ما أفضل طريقة لاستخدام اكتشاف الاحتيال؟",a:"يكتشف الذكاء الاصطناعي معاملات مشبوهة مختلفة عن المعتاد، ويُستخدم كدليل حتى يتأكد شخص هل هي احتيال فعلًا"}]},{title:"درس: نماذج أعمال الشركات الناشئة في الذكاء الاصطناعي",items:[{q:"منتجان لنفس النموذج الأساسي: المنتج أ تصميم مخصص يقلل وقت الرد على حجوزات المطعم، والذكاء الاصطناعي يعمل مسودة والمالك يتأكد قبل الإرسال. المنتج ب تصميم عام يُستخدم كما هو. أي منتج اختاره كثير من المطاعم القلقة من خطر الإجابات الخاطئة ولماذا؟",a:"المنتج أ: لأنه يركّز على مشاكل المستخدمين الملموسة ويصمّم شاشة تشغيل وأنظمة محيطة تسهّل على البشر التأكيد والتصحيح"},{q:"شركة تفكر في أربعة مشاهد من تطوير منتج حتى طرحه للبيع. أي مشهد ليس مناسبًا لاستخدام الذكاء الاصطناعي؟",a:"مشهد اتخاذ القرار النهائي، بناءً على المعلومات المجمّعة، هل ستطرح الشركة هذا المنتج للبيع"},{q:"شركة ناشئة تخطط خدمة مرتبطة بنموذج أساسي واحد مقدم من الخارج، وقبل التطوير حدث إعلان عن رفع أسعار وتغييرات في قواعد النموذج. ما أفضل إجراء؟",a:"إعادة التحقق هل يستمر العمل يصمد في ظل الشروط الجديدة المُعلنة، وتعديل الخطة نحو تصميم برنامج يسهّل التحول إلى نموذج أساسي مختلف، حتى لا يعتمد على خدمة ذكاء اصطناعي خارجية معيّنة، وبعد ذلك المضي في التطوير"},{q:"في خدمة توليد صور بالذكاء الاصطناعي، كل مرة يصنع المستخدم صورة تحدث تكاليف الخادم والمعالجة. ما تفسير أفضل لتصميم نموذج دخل بمراعاة بنية التكلفة؟",a:"نموذج التسعير على أساس الاستخدام (الدفع لكل استخدام): بما أن الرسوم تتغيّر حسب عدد الصور المولّدة، أسهل أن تحافظ على التوازن بين الدخل وبنية التكلفة التي تزيد فيها التكاليف الخفية بما يتناسب مع حجم الاستخدام"},{q:'أنت تخطط "تطبيق ذكاء اصطناعي لدعم المتاجر" مرتبطًا بنفس النموذج الأساسي الخارجي. أكمل الفراغات: "بما أن التكاليف الخفية تزيد كلما استخدم المستخدمون أكثر، ابتكر (1) حتى لا تتحمل الشركة عجزًا. أيضًا، استعدادًا لتغييرات مستقبلية، اصنع تصميمًا يسهّل التحول إلى (2). فوق هذا، من المهم منع (3) لبيانات المتاجر، وشرح (4) استخدام البيانات بوضوح."',a:"(1) خطة التسعير، (2) ذكاء اصطناعي مختلف، (3) التسريب، (4) الهدف"}]},{title:"اختبار المستوى الحادي والعشرون",items:[{q:'متجر يستخدم الذكاء الاصطناعي لكي يقدّر "كم قطعة يُحتمل بيعها الشهر القادم" بناءً على المبيعات السابقة والأحوال الجوية. أي وظيفة تتوافق؟',a:'"التنبؤ"، بالتقدير المسبق من بيانات الماضي'},{q:"قررت استخدام خدمة محادثة ذكاء اصطناعي لعمل مسودة عرض عمل لشريك. لديك اسم الشريك ومعلومات عن منتج لم يُعلن عنه وإحصائيات من شركات أخرى. ما أفضل طريقة؟",a:"عدم إدخال المعلومات التي لم تُعلن بعد أو اسم الشريك، والتأكد بنفسك هل المحتوى الناتج مطابق للحقائق قبل الاستخدام"},{q:"شريت أشياء عدة مرات خلال شهر باستخدام الدفع اللاحق (BNPL). وقت الشراء لم ينقص المال في يدك، لكن في نهاية الشهر تجمعت الدفعات مع مدفوعات عادية كالإيجار. ما تفسير الموقف؟",a:"الدفع اللاحق فقط يؤجّل الدفع والسعر لا يختفي، فكلما استخدمته أكثر، كلما زاد إجمالي الدفع المستقبلي"},{q:"مع انتشار الفينتك، الخدمات المرتبطة بالفلوس تغيّرت كثيرًا. أي مما يلي يصف بدقة أكبر التغيّرات وطريقة تعامل المستخدمين؟",a:"تقدمت راحة الاستخدام على مدار الساعة والتخصيص المناسب لكل فرد، لكن المسؤولية عن التأكد من محتوى العقد بنفسك لم تتغيّر"},{q:'عندما قدّم شخص طلبًا لشراء هاتف بالتقسيط، تم على الفور تأكيد "تقييم الجدارة الائتمانية" بمراجعة تاريخ الدفع. ما دور التقييم؟',a:"تحديد، من خلال بيانات مثل تاريخ الدفع السابق، ما إذا كانوا قادرين على دفع أقساطهم في موعدها"},{q:'أثناء رحلة، قمت بعملية شراء أكبر من المعتاد في متجر غير مألوف. وصلت رسالة من شركة البطاقة: "هل الاستخدام الآن كان بواسطتك؟" ما الآلية التي وصلت بها الرسالة؟',a:"اكتشف الذكاء الاصطناعي معاملة غير معتادة وأطلق تنبيهًا، ثم استُخدم التنبيه كإشارة ليتأكد الشخص مما إذا كان هو من أجرى المعاملة فعلًا"},{q:'شركة ناشئة تعمل "خدمة يستطيع فيها موظفو الشركة أن يتأكدوا بسرعة من النقاط التي يجب أن ينتبهوا لها في عقد"، بربط ذكاء اصطناعي لتوليد النص. ما أفضل طريقة لتحقيق "قيمة فريدة"؟',a:"تنشأ قيمة فريدة من خلال دمج، مع الذكاء الاصطناعي الموجود، معلومات عن النقاط التي غالبًا تصبح مشكلة في العقود وتصميم شاشة (واجهة مستخدم) سهلة الفحص للموظفين"},{q:'شركة ناشئة أطلقت خدمتها في صورة "SaaS (البرمجيات كخدمة)". ما أفضل تصور لتشغيل وتكاليف خدمة الذكاء الاصطناعي من نوع SaaS؟',a:"كلما زاد استخدام المستخدمين للذكاء الاصطناعي، زادت التكاليف الحسابية الخفية (مثل رسوم الخوادم)، فخطة تسعير تأخذ في الاعتبار توازن التكاليف والدخل تصبح ضرورية"},{q:'شركة تفكر في كيفية الاستفادة مستقبلًا من البيانات المتعلقة بكيفية استخدام المستخدمين لخدمتها. ما أفضل منظور لعمل "تحقيق قيمة اقتصادية من البيانات"؟',a:"إدارة البيانات بأمان، وشرح هدف الاستخدام بوضوح للمستخدمين، وبعد ذلك ربطها بتحسينات الخدمة ودخل عمل جديد"},{q:"شخص اختار كما هي الخطة التي اقترحها مستشار آلي، لكن بعد فترة انخفض السعر وحدثت خسارة. ما أفضل طريقة لتفسير النتيجة؟",a:"الذكاء الاصطناعي خدمة مريحة تساعد في إجراءات وحكم الاستثمار، لكن ما دام الأمر يتعلق باستثمار، فإن مسؤولية الاختيار النهائي ومخاطر الخسارة الناتجة عن انخفاض السعر تقع عليك أنت"}]}]},{id:22,title:"المستوى الثاني والعشرون — تأثير الذكاء الاصطناعي والثقافة الرقمية",tag:"الوظائف والثقافة الرقمية",sections:[{title:"درس: كيف يغيّر الذكاء الاصطناعي الوظائف والمجتمع",items:[{q:'أي مما يلي يمثّل بشكل أفضل "العمل الروتيني" السهل أن يُترك للذكاء الاصطناعي؟',a:"في شركة تصنيع لعب أطفال، عمل تجميع بيانات ردود استبيان داخلي، وعمل رسومات وجداول، وتجميعها في مواد تقرير"},{q:'في مركز اتصال، أدخلوا روبوت محادثة يرد على استفسارات بسيطة. أصبح الذكاء الاصطناعي يتولى "الأسئلة المتكررة". ما تفسير العلاقة بين "أتمتة جزء من العمل" وخطر "إزاحة الوظيفة"؟',a:'حتى لو تمت أتمتة الرد على "الأسئلة المتكررة"، يصبح البشر قادرين على التركيز على استفسارات أخرى أكثر تعقيدًا، فـ "إزاحة الوظيفة" لا تحدث فورًا'},{q:"أي مما يلي ليس حالة استخدام للذكاء الاصطناعي؟",a:"في مدرسة، عمل معلم التوجيه المهني وهو يقدّم استشارات مع مراعاة مشاعر وظروف كل طالب"},{q:'شخص على وشك أن يفتح "متجرًا يقدّم مشروبات مطابقة تمامًا لطلب كل عميل". أي مما يلي ليس طريقة مناسبة لاستخدام الذكاء الاصطناعي في هذا المتجر؟',a:"يترك كل خدمة العملاء وتقديم المشروبات للذكاء الاصطناعي، ويجعل البشر يتركون المتجر دون موظفين لشراء مكونات"},{q:"شركة تستخدم الذكاء الاصطناعي في فحص مستندات الموظفين الجدد، وجعلته يتعلم بيانات توظيف سابقة. ما أنسب نقطة يجب أخذها بعين الاعتبار؟",a:"لو كانت السجلات السابقة التي تعلمها الذكاء الاصطناعي فيها انحياز، يمكن أن يظهر انحياز غير عادل في نتائج الفحص أيضًا"}]},{title:"درس: ما هي الثقافة الرقمية للذكاء الاصطناعي؟",items:[{q:'أي مما يلي يفسّر بشكل أفضل "الثقافة الرقمية للذكاء الاصطناعي"؟',a:"مهارات وموقف للتعامل بأمان وبشكل جيد مع الذكاء الاصطناعي، والقدرة على التمكّن منه بشكل استباقي دون تصديق المعلومات كما هي"},{q:'رأيت منشورًا: "رياضي مشهور متحمس جدًا لأكل صحي جديد". أي مما يلي يحدد بشكل صحيح إجراءات التأكد هل المعلومة حقيقية، من منظور "التأكد هل يوجد تأكيد"؟ 1 فحص هل يوجد إعلان في الموقع الرسمي للفريق، 2 فحص عدد المشاهدات واللايكات، 3 البحث هل نفس المعلومة مذكورة في وسائل إخبارية كبرى، 4 البحث عن منشورات بنفس الصياغة على وسائل أخرى',a:"(1) و (3)"},{q:'النص شرح لـ "خصوصية البيانات". أكمل الفراغات: "خصوصية البيانات هي (2)، فيما يخص كيفية استخدام معلوماتك الشخصية (1)."',a:"(1) متى، ولمن، وإلى أي حد تقدّمها / (2) الحق في التحكم في نفسك"},{q:"عندما تُدخل معلومات في الذكاء الاصطناعي، أي مما يلي لا يفسّر بشكل صحيح كيف يُفترض أن تتعامل معها؟",a:"قائمة أعضاء النادي، وسجلات الأنشطة، ومعلومات الدرجات للنادي الذي تنتمي إليه لا بأس أن تُدخلها في الذكاء الاصطناعي"},{q:"س أدخل أمرًا توجيهيًا ليجعل الذكاء الاصطناعي يفكر في أفكار بحث لعرض نادي علوم، لكن الأفكار احتاجت معدات غالية أو استغرقت أشهرًا. أي عنصر يجب أن يضيفه س للأمر التوجيهي؟",a:'الشروط "بتكلفة أقل من 500 جنيه" و"يُكمَّل في حوالي أسبوع"'}]},{title:"درس: استراتيجية شخصية في عصر الذكاء الاصطناعي",items:[{q:'شخص يدير محلًا يبيع أكلًا صحيًا. قرر أن يفرز الأعمال اليومية إلى "عمل يُترك للذكاء الاصطناعي" و"عمل يجب أن يتولاه البشر": 1 تنبؤ الشراء، 2 خدمة العملاء بتقديم تحيات قريبة من الحالة الجسدية والمزاج، 3 الرد على الأسئلة المتكررة، 4 التعامل مع الشكاوى. ما التصنيف؟',a:"الذكاء الاصطناعي: (1) و (3) / البشر: (2) و (4)"},{q:'شركة ناشئة عالمية ستطوّر منصة توزيع أغذية لتقليل "هدر الطعام". أي مما يلي يحدد الخطوات التي استخدام الذكاء الاصطناعي فيها الأكثر فعالية؟ 1 بحث الحاجات المحلية بالحوار، 2 تحليل بيانات الحالات الموجودة، 3 إبرام شراكات دولية ببناء الثقة، 4 صنع نموذج تجريبي للتطبيق بكتابة كود بسرعة',a:"(2) و (4)"},{q:'شخص عمل 15 سنة كموظف مكتبة، واثق من معرفته بالكتب وخدمة العملاء، يتم نقله لوظيفة "مدير تسويق رقمي". ما أنسب "استراتيجية مهنية"؟',a:'وإذ يستخدم "معرفة الكتب" و"مهارات خدمة العملاء" التي طوّرها حتى الآن كأساس، يتعلم من جديد مهارات "تحليل البيانات" و"جذب العملاء عبر الويب" ليصنع قوة يمتلكها هو فقط'},{q:'أي مما يلي أنسب مسار لبناء "محفظة مهارات" لشخص يخطط أن يدير مشروعًا زراعيًا في المستقبل؟',a:"وإذ يصقل خبرة عميقة بتقنية الزراعة كنواة، تغطية واسعة للمعرفة المالية والتسويقية المطلوبة للإدارة"},{q:'رائد أعمال على وشك أن يبدأ متجره ويجعل إدارته مستقرة. أي إجراء يدمج "الثقافة المالية" و"الثقافة الرقمية للذكاء الاصطناعي" حتى يتحكم بشكل استباقي في المشروع مع تقليل الخطر؟',a:"وإذ يرجع إلى بيانات دخل الشهر القادم التي تنبأ بها الذكاء الاصطناعي، يقرر رائد الأعمال نفسه كمية الشراء النهائية داخل نطاق ميزانية آمنة، ليتجنب خطر نقص النقد المتاح"}]},{title:"اختبار المستوى الثاني والعشرون",items:[{q:"شخص بدأ يبيع إكسسوارات يدوية أونلاين ويفكر يدمج الذكاء الاصطناعي. ما أفضل طريقة للاستفادة من نقاط قوة الذكاء الاصطناعي والبشر؟",a:"سيب تحليل بيانات المبيعات للذكاء الاصطناعي، والتفكير في تصاميم ورسائل جديدة للعملاء بنفسه"},{q:'صاحب مخبز رأى تنبؤ طلب من أداة ذكاء اصطناعي واشترى دقيقًا زائدًا، لكن التنبؤ أخطأ وبقي دقيق فائض. ما أفضل منظور على "المساءلة"؟',a:"بما أنه هو نفسه الذي تبنّى التنبؤ وقرر، التفكير بأن مسؤولية النتيجة عليه، والاستفادة منها في الحكم القادم"},{q:"عندما طبقت مدرسة آلية لتصحيح مقالات الطالب بالذكاء الاصطناعي، تبيّن أن الطلاب الذين كتبوا بأسلوب ثابت فقط حصلوا على درجات عالية. ما تفسير الموقف؟",a:"من المتصوَّر أن المقالات التي حصلت على درجات عالية في الماضي كانت تتسم بخصائص متشابهة، وأن وجود أو غياب هذه الخصائص أثّر على الدرجات، فتتحمل المدرسة المسؤولية وتحسّن طريقة التصحيح"},{q:"لما خليت الذكاء الاصطناعي يبحث حدثًا تاريخيًا لتقرير، ظهرت إجابة منطقية ومفصلة حتى في التواريخ والأعداد. ما أفضل طريقة للتعامل مع المعلومة؟",a:"بما أن المحتوى لا يكون بالضرورة صحيحًا، استخدامها بعد التأكد أيضًا بمصدر آخر مثل كتاب مدرسي أو موقع رسمي"},{q:'شفت منشورًا يقول "شركة مشهورة قريبًا هتفلس". انتشر المنشور. ما أفضل إجراء مع مراعاة احتمالية أنها أخبار كاذبة؟',a:"بما أنك لا تعرف هل هي صحيحة، لا تصدّقها بتهور إلى أن تتأكد بالإعلان الرسمي للشركة أو مقال إخباري كبير موثوق"},{q:"أنت على وشك استخدام الذكاء الاصطناعي للمساعدة في التخطيط لرحلة مع أصدقائك. ما أفضل طريقة للتعامل مع المعلومات التي تُدخلها؟",a:"ليقدّم أفكارًا لأكل تأكله في الوجهة، أدخل فقط معلومات لا ترتبط بأفراد، مثل اسم الوجهة والبرنامج الزمني"},{q:"شركة بتفكر تسيب جزءًا من شغلها للذكاء الاصطناعي. أي من الأعمال التالية يجب أن يواصل البشر توليها بدلًا من الذكاء الاصطناعي؟",a:"الاستماع بعناية إلى عميل مر بتجربة مؤلمة، والتفكير في رد يراعي مشاعره"},{q:'شخص كان يعمل شغل صنع مواد إدارية بناءً على استبيانات داخلية، وبدأ يعمل على "إعادة صقل المهارات". ما أنسب مسار؟',a:'التفكير "أستفد من القوى التي طوّرتها حتى الآن كأساس"، وتعلّم مهارات جديدة لاستخدام الذكاء الاصطناعي بشكل مناسب لرفع الإنتاجية، وهدفه ضربهما مع بعض'},{q:'شخص ماهر في الطبخ، هدفه أن يصبح مستقلًا ويفتح مطعمه الخاص، يفكر في أن يبني "محفظة مهاراته". ما أفضل تصور؟',a:'مع تعميق مهاراته في الطبخ، يتعلم أيضًا تدريجيًا مهارات مرتبطة بالإدارة، مثل "إدارة المال" و"النشر على وسائل التواصل الاجتماعي"'},{q:'شخص بدأ "محل وجبات معلّبة يهتم بخضروات موسمية محلية" لدعم المزارعين المحليين، لكنه يواجه مشاكل: عدد العملاء لا يمكن قراءته، وكثير من التخلص من وج
